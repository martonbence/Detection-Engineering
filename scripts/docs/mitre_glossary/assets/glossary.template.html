<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MITRE Navigator — glosszárium</title>
  <link rel="icon" type="image/png" sizes="32x32" href="data:image/png;base64,@@FAVICON_DATA@@">
  <style>
@@INLINE_CSS@@
  </style>
</head>
<body>
  <!-- Generated by scripts/docs/mitre_glossary/generate_mitre_glossary.py -- do not hand-edit. -->
  <header class="stats-strip">
    <div class="strip-brand">
      <img class="strip-logo" src="data:image/png;base64,@@LOGO_DATA@@" width="40" height="40" alt="">
      <span class="strip-title">MITRE Navigator · glosszárium</span>
      <span class="strip-sep" aria-hidden="true"></span>
      <span class="strip-total">@@N_TACTICS@@ taktika · @@N_TECHNIQUES@@ technika · @@N_SUBS@@ altechnika</span>
    </div>
    <div class="search-input-wrap">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke-width="2"></circle><path d="M20 20l-4-4" stroke-width="2"></path></svg>
      <input id="q" class="search-input" type="search" placeholder="Keresés: ID, név vagy szöveg…" aria-label="Keresés a glosszáriumban" autocomplete="off">
    </div>
  </header>
  <main>
    <section class="matrix-wrap" aria-label="Lefedett ATT&amp;CK elemek">
      <div class="legend">
        <span class="lg"><span class="sw sw-cov"></span>Lefedett (saját szabály)</span>
        <span class="lg"><span class="sw sw-part"></span>Részleges (csak altechnikán keresztül)</span>
        <span class="lg-ts">Generálva: @@TS@@</span>
      </div>
      <div id="matrix" class="att-matrix"></div>
    </section>
    <aside id="detail" class="detail" aria-live="polite"></aside>
  </main>
  <script id="glossary-data" type="application/json">@@DATA_JSON@@</script>
  <script>
@@INLINE_JS@@
  </script>
</body>
</html>
