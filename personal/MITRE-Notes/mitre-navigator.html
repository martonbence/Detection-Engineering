  <style>
/* Visual language copied from the rule browser (scripts/docs/assets/page.css),
   per the web-visual-system skill: navy + two radial washes, glass panels
   with a bright hairline, amber (#ffaa00) as the brand/interactive colour,
   solid-amber tactic headers, mono for IDs, sans for headings. */
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg3: #1c2128;
  --bg4: #21262d;
  --border2: #444c56;
  --text: #e6edf3;
  --text2: #a2a9b1;
  --text3: #9a9fa7;
  --accent: #58a6ff;
  --amber: #ffaa00;
  --radius: 6px;
  --radius-lg: 10px;
  --font: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
}

html, body { height: 100%; }

body {
  background-color: #0f172a;
  background-image:
    radial-gradient(1500px 1200px at 8% -10%, rgba(64, 116, 244, 0.26), transparent 72%),
    radial-gradient(1300px 1100px at 100% 16%, rgba(132, 98, 230, 0.30), transparent 70%);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 14px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── Top strip (same recipe as page.css .stats-strip) ── */
.stats-strip {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  height: 60px;
  padding: 0 16px;
  background: rgba(20, 25, 34, 0.55);
  backdrop-filter: blur(16px) saturate(1.3);
  -webkit-backdrop-filter: blur(16px) saturate(1.3);
  border-bottom: 1px solid rgba(255, 255, 255, 0.10);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 12px 30px -10px rgba(0, 0, 0, 0.6);
  position: relative;
  z-index: 2;
}
.strip-brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.strip-logo { width: 40px; height: 40px; flex-shrink: 0; display: block; }
.strip-title { font-size: 14px; font-weight: 700; letter-spacing: -0.2px; white-space: nowrap; }
.strip-sep { width: 1px; height: 14px; background: var(--border2); flex-shrink: 0; }
.strip-total { font-family: var(--font); font-size: 12px; white-space: nowrap; }

.search-input-wrap { position: relative; width: 340px; max-width: 45vw; height: 28px; display: flex; align-items: center; }
.search-input-wrap svg {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  width: 14px; height: 14px; stroke: var(--text3); fill: none;
}
.search-input {
  width: 100%; height: 28px; padding: 0 10px 0 32px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.10);
  border-radius: var(--radius);
  color: var(--text); font-size: 13px; font-family: var(--font-ui);
  outline: none;
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.25);
  transition: border-color 0.12s;
}
.search-input:focus { border-color: var(--amber); }
.search-input::placeholder { color: var(--text2); }

/* ── Body: matrix + detail panel ── */
main {
  flex: 1; min-height: 0;
  display: flex; gap: 14px; padding: 14px;
}

.matrix-wrap {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; gap: 10px;
  overflow: auto;
}

.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; font-size: 12px; color: var(--text2); }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.lg-ts { margin-left: auto; font-family: var(--font); font-size: 11px; }
.sw { width: 14px; height: 14px; border-radius: 2px; display: inline-block; }
.sw-cov { background: var(--bg4); border-left: 3px solid var(--amber); }
.sw-part { background: rgba(255, 170, 0, .13); border-left: 2px solid rgba(255, 170, 0, .55); }

.att-matrix { display: flex; gap: 2px; align-items: flex-start; padding-bottom: 4px; }

.tc-col { flex: 0 0 185px; display: flex; flex-direction: column; gap: 1px; }

.tc-hdr {
  width: 100%;
  background: var(--amber);
  color: #111;
  border: none;
  font-family: var(--font-ui);
  font-size: 12px; font-weight: 700;
  padding: 6px 5px;
  text-align: center;
  border-radius: 3px 3px 0 0;
  min-height: 44px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  cursor: pointer;
}
.tc-hdr .tc-count { font-size: 10px; font-weight: 400; opacity: .8; font-family: var(--font); }
.tc-hdr:hover, .tc-hdr.sel { box-shadow: inset 0 0 0 2px #111; }

.tc {
  width: 100%;
  text-align: left;
  font-family: var(--font-ui);
  font-size: 12px;
  padding: 5px 6px;
  border: none;
  border-radius: 2px;
  min-height: 40px;
  display: flex; flex-direction: column; gap: 1px;
  cursor: pointer;
  color: var(--text);
  background: var(--bg4);
  border-left: 3px solid var(--amber);
  transition: box-shadow 0.12s, background 0.12s;
}
.tc.partial {
  background: rgba(255, 170, 0, .13);
  border-left: 2px solid rgba(255, 170, 0, .55);
}
.tc.sub { margin-left: 12px; width: calc(100% - 12px); min-height: 34px; background: var(--bg3); }
.tc .ti { font-family: var(--font); font-size: 11px; font-weight: 600; color: var(--amber); }
.tc .tn { line-height: 1.25; }
.tc .tm { font-family: var(--font); font-size: 10px; color: var(--text2); }
.tc:hover, .tc.sel {
  box-shadow: 0 0 0 2px rgba(255, 170, 0, .14), inset 0 0 0 1px var(--amber);
}
.tc:focus-visible, .tc-hdr:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tc.dim, .tc-hdr.dim { opacity: .28; }
.tc.nob .ti::after { content: ' ·?'; color: #f85149; }

/* ── Detail panel: the rule browser's glass card recipe ── */
.detail {
  flex: 0 0 440px;
  max-width: 45vw;
  overflow-y: auto;
  padding: 20px;
  display: flex; flex-direction: column; gap: 12px;
  background: rgba(22, 27, 34, 0.82);
  backdrop-filter: blur(12px) saturate(1.2);
  -webkit-backdrop-filter: blur(12px) saturate(1.2);
  border: 1px solid rgba(255, 255, 255, 0.10);
  border-radius: var(--radius-lg);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), 0 12px 34px -14px rgba(0, 0, 0, 0.6);
}
.d-id { font-family: var(--font); font-size: 13px; font-weight: 700; color: var(--amber); }
.d-name { font-size: 18px; font-weight: 700; letter-spacing: -0.2px; }
.d-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  display: inline-block; padding: 2px 7px; border-radius: 20px;
  font-family: var(--font); font-size: 10px; font-weight: 600; letter-spacing: .3px;
  background: #262c35; color: var(--text2); border: 1px solid rgba(162, 169, 177, .35);
}
.pill.cov { background: #3a2f16; color: #ffc34d; border-color: rgba(255, 170, 0, .4); }
.pill.part { background: #2b2717; color: #e3b659; border-color: rgba(255, 170, 0, .28); }
.d-section-title {
  align-self: flex-start;
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px;
  border-radius: 5px; padding: 3px 10px; background: var(--amber); color: #111;
}
.d-blurb { font-size: 14px; line-height: 1.6; color: var(--text); }
.d-blurb code, .d-meta code {
  font-family: var(--font); font-size: 12px;
  background: rgba(255, 255, 255, 0.06); border-radius: 4px; padding: 1px 4px;
}
.d-missing {
  font-size: 13px; line-height: 1.5; color: var(--text);
  border-left: 3px solid #f0883e; padding: 6px 10px; background: rgba(240, 136, 62, .08);
}
.d-meta { font-size: 12px; line-height: 1.7; color: var(--text2); }
.d-meta b { color: var(--text); font-weight: 600; }
.d-links { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; }
.d-rel { display: flex; flex-wrap: wrap; gap: 6px; }
.d-rel button {
  background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.10);
  color: var(--text); border-radius: 20px; padding: 3px 9px; cursor: pointer;
  font-family: var(--font); font-size: 11px;
}
.d-rel button:hover { border-color: var(--amber); box-shadow: 0 0 0 2px rgba(255, 170, 0, .14); }

@media (max-width: 900px) {
  body { height: auto; overflow: auto; }
  main { flex-direction: column; }
  .detail { flex: none; max-width: none; }
  .search-input-wrap { width: 200px; }
  .strip-total, .strip-sep { display: none; }
}

  </style>
</head>

  <script id="glossary-data" type="application/json">{"items": {"TA0043": {"id": "TA0043", "name": "Reconnaissance", "kind": "tactic", "state": "covered", "blurb": "A Reconnaissance a támadási lánc első, pre-kompromittációs taktikája: a támadó információt gyűjt a célpontról, mielőtt bármihez hozzáérne. Két ágra bomlik. A passzív felderítés (OSINT, külső adatbázisok, publikus felületek) teljes egészében a támadó oldalán zajlik, és a védett környezetből nem is látható. Az aktív felderítés viszont közvetlen interakcióba lép a célponttal — port scan, service fingerprinting, webes tartalom-térképezés —, és ez már nyomot hagy a peremen. A cél mindig ugyanaz: elég kontextust szerezni ahhoz, hogy egy későbbi lépés (célzott phishing, exploit) pontos és hihető legyen. Detekciós szempontból a Reconnaissance ritkán hagy magas fidelitású jelet; inkább aggregált anomáliák (sweep-ek, szokatlan user-agentek) és threat intel feedek (ismert scanner IP-k) adnak értéket. Ez a mátrix első oszlopa.", "note": "Tactics/TA0043 - Reconnaissance.md", "rules": [], "platforms": [], "url": "https://attack.mitre.org/tactics/TA0043/", "coverage": "1/12"}, "T1595": {"id": "T1595", "name": "Active Scanning", "kind": "technique", "state": "partial", "blurb": "Az Active Scanning alatt a támadó aktív hálózati vizsgálattal térképezi fel a célpont infrastruktúráját — a passzív OSINT-tel szemben itt közvetlen forgalmat küld a célpont felé, tehát nyomot is hagy. Három altechnikára bomlik. A Scanning IP Blocks (.001) azt állapítja meg, mely IP-k élnek és milyen szolgáltatások/verziók futnak rajtuk. A Vulnerability Scanning (.002) ezt követi, és megmondja, hogy a feltérképezett szolgáltatások sérülékenyek-e egy ismert exploit követelményeihez. A Wordlist Scanning (.003) az alkalmazási rétegben szólistákkal keres rejtett tartalmakat, könyvtárakat, admin- felületeket vagy cloud tárolókat. Az Active Scanning sosem öncél: az összegyűjtött adat egy későbbi lépés (célzott exploit, belépés) bemenete — egy nyitott RDP port vagy egy sérülékeny webszolgáltatás azonnal Initial Access-célponttá válik. Platformja PRE (pre-kompromittáció), és detekciósan jellemzően csak a szervezet saját, kifelé néző felületein (webszerver access log, peremeszköz) látszik.", "note": "Techniques/T1595 - Active Scanning.md", "rules": [], "platforms": ["PRE"], "url": "https://attack.mitre.org/techniques/T1595/", "tacticNames": ["Reconnaissance"], "subTotal": 3}, "T1595.002": {"id": "T1595.002", "name": "Vulnerability Scanning", "kind": "subtechnique", "state": "covered", "blurb": "A Vulnerability Scanning során a támadó a célpont már azonosított szolgáltatásait ismert sérülékenységek után vizsgálja: eldönti, hogy egy adott végponton futó szoftver típusa és verziója illeszkedik-e egy általa ismert exploit követelményeihez. Tipikusan a Scanning IP Blocks (.001) után jön — míg az meghatározza, hol milyen szolgáltatás fut, a Vulnerability Scanning megmondja, hol van rajta kihasználható gyenge pont. A tevékenységet többnyire automatizált sérülékenység-szkennerek (Nessus, OpenVAS, Nuclei) végzik, amelyek listaszerűen sorolják fel a talált gyengeségeket. A gyakorlatban a szkenner sok, gyorsan egymás után kiadott kérést küld ismert sérülékeny útvonalakra és paraméterekre, gyakran jellegzetes user-agenttel. A webszerver access logjában ez sűrű, gépi mintázatú, sokféle útvonalat érintő forgalomként jelenik meg egyetlen forrásból. Platformja PRE, és mivel a vállalati kontrollokon kívüli viselkedésen alapul, megelőző eszközzel nehezen mérsékelhető — a detekció a peremen történő megfigyelésre épül. A repóban a linux-victim nginx access logja adja a jelet. Detekciósan a kihívás elkülöníteni a legitim biztonsági szkenneléstől és a keresőrobotoktól.", "note": "Subtechniques/T1595.002 - Vulnerability Scanning.md", "rules": ["DETECT-2026-0038"], "platforms": ["PRE"], "url": "https://attack.mitre.org/techniques/T1595/002/", "parent": "T1595"}, "T1595.003": {"id": "T1595.003", "name": "Wordlist Scanning", "kind": "subtechnique", "state": "covered", "blurb": "A Wordlist Scanning során a támadó szólistákkal (wordlist) iteratívan próbálja feltérképezni a célpont felületét — de nem hitelesítő adatot keres, hanem rejtett tartalmakat: nem linkelt oldalakat, régi fájlokat, admin-felületeket, könyvtárakat. A szólista lehet generikus, széles körben használt fájl- és könyvtárnevek gyűjteménye, vagy célpont-specifikus, korábbi felderítésből összeállított lista. Két fő alkalmazási területe van. Az egyik a webes tartalom-felderítés: rejtett útvonalak és felületek megtalálása olyan eszközökkel, mint a Gobuster, Dirb vagy DirBuster. A másik a cloud storage- felderítés: publikus vagy privát tárolók (S3, GCP bucket) azonosítása, mivel ezek globálisan egyedi nevet használnak. A gyakorlatban ez a webszerveren sok <code>404<\/code>/<code>403<\/code> választ generál rövid idő alatt, mert a lista túlnyomó része nem létező útvonalra mutat — épp ez a mennyiségi mintázat a jel. Platformja PRE, és mint a többi Active Scanning altechnika, megelőző kontrollal nehezen mérsékelhető; a védelem inkább a felesleges felületek elrejtése. A repóban a linux-victim webszerver access logja látja.", "note": "Subtechniques/T1595.003 - Wordlist Scanning.md", "rules": ["DETECT-2026-0036"], "platforms": ["PRE"], "url": "https://attack.mitre.org/techniques/T1595/003/", "parent": "T1595"}, "TA0001": {"id": "TA0001", "name": "Initial Access", "kind": "tactic", "state": "covered", "blurb": "Az Initial Access az a pillanat, amikor a támadó tevékenysége átlép a saját infrastruktúrájáról a célpont rendszereire — az első lábnyom megszerzése. Ez a határvonal a felderítési fázis és a tényleges behatolás között: előtte a támadó csak tud a célpontról, utána benne van. A belépési pontok két, detekciósan nagyon eltérő családra oszlanak. Az egyik a technikai kihasználás: internetről elérhető szolgáltatás sérülékenységének kiaknázása (T1190) vagy a böngésző megtámadása egy weboldalon át (T1189) — itt van payload és szignatúra. A másik a legitim belépés visszaélésszerű használata: ellopott hitelesítő adattal VPN-re/RDP-re bejelentkezés — itt a támadó ugyanazt teszi, mint egy valódi felhasználó, és a jel csak a kontextusban van. Ezért ez a taktika kiemelten értékes: itt még a peremen van a támadó, minden későbbi lépést drágább detektálni.", "note": "Tactics/TA0001 - Initial Access.md", "rules": [], "platforms": [], "url": "https://attack.mitre.org/tactics/TA0001/", "coverage": "3/11"}, "T1189": {"id": "T1189", "name": "Drive-by Compromise", "kind": "technique", "state": "covered", "blurb": "A Drive-by Compromise nem a szervert, hanem a felhasználó böngészőjét támadja — miközben az áldozat teljesen hétköznapi módon, saját szándékából nyit meg egy weboldalt. Az oldal tartalma (vagy egy része: egy hirdetés, egy beágyazott szkript, egy felhasználó által feltölthető tartalom) a támadó kezén van, és betöltéskor automatikusan lefutó kód használja ki a böngésző vagy egy plugin sérülékenységét. A lényeg a bizalmi irány megfordítása a T1190-hez képest: ott a támadó küld kérést a szerverhez, itt a kliens kéri le a tartalmat, és a rosszindulatú anyag a válaszban érkezik — ezért a kihasználás a végponton történik, nem a szerver logjában. A phishinggel szemben itt nincs csali, amire rá kell venni a felhasználót: elég, hogy meglátogat egy amúgy is szokott oldalt (watering hole) vagy egy hirdetési hálózat eljuttatja rá (malvertising). A MITRE négy lépésben írja le: látogatás, a szkriptek lefutása és a böngésző/plugin verziójának vizsgálata, az exploit eljuttatása, majd kódfuttatás megszerzése. A szempontunkból legfontosabb eset, amikor a szervezet saját, sérülékeny webalkalmazása szolgálja ki a rosszindulatú szkriptet a látogatóinak.", "note": "Techniques/T1189 - Drive-by Compromise.md", "rules": ["DETECT-2026-0042"], "platforms": ["Identity Provider", "Linux", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1189/", "tacticNames": ["Initial Access"], "subTotal": 0}, "T1190": {"id": "T1190", "name": "Exploit Public-Facing Application", "kind": "technique", "state": "covered", "blurb": "Az Exploit Public-Facing Application során a támadó egy internetről elérhető szolgáltatás szoftverhibáját használja ki, hogy belépési pontot szerezzen. A közös nevező nem egy sérülékenység-típus, hanem a pozíció: a célpont egy szándékosan publikált alkalmazás (webapp, API, VPN-koncentrátor, adatbázis- frontend, levelezőszerver), tehát nem kell sem hitelesítő adat, sem felhasználói interakció — csak egy jól megfogalmazott kérés. Ami detekciósan megkülönbözteti: a payload a kérés része, tehát a rosszindulatú tartalom átmegy azon a csatornán, amit a szerver amúgy is naplóz — ezért szignatúra- alapon detektálható, még mielőtt bármi végrehajtódna. Tipikus alakjai a path traversal / Local File Inclusion (<code>../<\/code> kódolt változatai a <code>/etc/passwd<\/code> vagy konfigfájlok felé), az injekciók és a távoli kódfuttatás. Egyes sérülékenységek (Log4Shell, RFI) a második lépésben kimenő kapcsolatot kényszerítenek a szerverből a támadó callback-infrastruktúrája felé — ilyenkor a valódi payload nem is a kérésben van. A támadó a kihasznált folyamat jogosultságát örökli: ha a webapp service accountként fut, azzal jelenik meg a hálózaton. A repóban a linux-victim nginx access logja a detekció forrása.", "note": "Techniques/T1190 - Exploit Public-Facing Application.md", "rules": ["DETECT-2026-0037", "DETECT-2026-0041", "DETECT-2026-0043"], "platforms": ["Containers", "ESXi", "IaaS", "Linux", "Network Devices", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1190/", "tacticNames": ["Initial Access"], "subTotal": 0}, "T1566": {"id": "T1566", "name": "Phishing", "kind": "technique", "state": "partial", "blurb": "A Phishing alatt a támadó megtévesztő elektronikus üzenettel próbál belépési pontot szerezni: rábírja a címzettet, hogy megnyisson egy mellékletet, rákattintson egy linkre, vagy megadjon egy hitelesítő adatot. Ez a leggyakoribb kezdeti belépési vektor, mert nem igényel hálózati sérülékenységet — az egyetlen kihasznált gyengeség az ember. Három altechnika tartozik alá: a rosszindulatú melléklet (.001), a rosszindulatú link (.002), és a szolgáltatáson keresztüli phishing (.003), pl. közösségi médián. Jellemzően célzott és hihető ürüggyel operál (spearphishing), gyakran egy korábbi felderítés (T1595, identity gathering) adataira építve. A támadói logika szerint egy sikeres megnyitás egy második, tényleges payloadot indít, ami már a végponton fut. Detekciósan a kihívás, hogy a legitim üzleti levelezés is tartalmaz mellékleteket és linkeket — a jel a feladó, a reputáció, a melléklet-típus és a megnyitás utáni folyamatlánc kombinációjában van. Platformja jellemzően Windows/macOS/Linux végpont és a levelezési szolgáltatás. A védelem több rétegű: e-mail gateway, MOTW, makró-blokkolás, felhasználói tudatosság.", "note": "Techniques/T1566 - Phishing.md", "rules": [], "platforms": ["Identity Provider", "Linux", "Office Suite", "SaaS", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1566/", "tacticNames": ["Initial Access"], "subTotal": 4}, "T1566.001": {"id": "T1566.001", "name": "Spearphishing Attachment", "kind": "subtechnique", "state": "covered", "blurb": "A Spearphishing Attachment során a támadó egy célzott, hihető ürüggyel ellátott e-mailhez rosszindulatú mellékletet csatol — makrós Office- dokumentumot, jelszóval védett (AV-scan elől rejtett) ZIP-et, HTA-t vagy egy exploit-terhelt PDF-et —, és ráveszi a felhasználót a megnyitásra. A megnyitás pillanatában a melléklet a saját alkalmazásán (Word, Excel, Adobe Reader) belül futtat kódot, ami egy második, tényleges payloadot indít. A klasszikus forma a VBA-makró: egy <code>AutoOpen<\/code>/<code>Document_Open<\/code> makró tipikusan <code>Shell()<\/code> vagy <code>CreateObject(&quot;WScript.Shell&quot;).Run<\/code> hívással PowerShellt indít. A HTA/ script-alapú változat <code>mshta.exe<\/code>-vel, <code>wscript.exe<\/code>/<code>cscript.exe<\/code>-vel fut, az exploit-terhelt dokumentum (pl. Follina, <code>msdt.exe<\/code>) pedig már pusztán a megnyitással kódot futtat, makró-engedélyezés nélkül. A Microsoft alapból blokkolja az internetről letöltött makrókat, ezért a támadók megkerülő trükköket használnak (jelszavas ZIP, ISO/IMG-becsomagolás, ami elveszíti a Mark-of-the-Web-et). Detekciósan a jel jellemzően a folyamatlánc: egy Office- vagy szkript-motor gyanús gyermekfolyamatot indít. A tartalmat a fájl alapján nehéz elkülöníteni a legitim makróktól.", "note": "Subtechniques/T1566.001 - Spearphishing Attachment.md", "rules": ["DETECT-2026-0013"], "platforms": ["Linux", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1566/001/", "parent": "T1566"}, "TA0002": {"id": "TA0002", "name": "Execution", "kind": "tactic", "state": "covered", "blurb": "Az Execution taktika alatt a támadó saját kódot futtat a célkörnyezet egy gépén. Ez sosem a végcél önmagában — a futtatott kód mindig valami mást szolgál: felderítést, hitelesítőadat-lopást, perzisztenciát, C2-t —, ezért szinte minden láncban szerepel, jellemzően többször is. Detekciósan kitüntetett helyzetben van két okból. Egyrészt ez a legjobban megfigyelhető taktika: a folyamatindítás (Sysmon EID 1, Windows 4688) a legrészletesebb végponti telemetria, és minden kódfuttatás keletkeztet ilyen eseményt. Másrészt a támadó itt sok megfigyelhető döntést kényszerül meghozni — milyen interpreter, milyen paraméterek, milyen szülőfolyamat —, és ezek ujjlenyomatként viselkednek. A taktika igazi nehézsége nem a láthatóság, hanem a legitimitás: a támadó ugyanazokat az interpretereket (PowerShell, <code>cmd.exe<\/code>, WMI, bash) használja, mint az adminok. A kérdés tehát nem az, hogy látjuk-e, hanem hogy meg tudjuk-e különböztetni.", "note": "Tactics/TA0002 - Execution.md", "rules": [], "platforms": [], "url": "https://attack.mitre.org/tactics/TA0002/", "coverage": "2/20"}, "T1059": {"id": "T1059", "name": "Command and Scripting Interpreter", "kind": "technique", "state": "partial", "blurb": "A Command and Scripting Interpreter alatt a támadó a rendszeren már jelen lévő parancs- és szkriptmotorokat használja kódfuttatásra ahelyett, hogy saját binárist hozna be. A közös nevező, hogy ezek az interpreterek (PowerShell, <code>cmd.exe<\/code>, Windows Script Host, bash/sh, Python) beépítettek és megbízottak, gyakran allowlisteltek — ezért egyszerre kényelmes és feltűnésmentes vektorok. Az egyes altechnikák a konkrét interpretert nevezik meg: PowerShell (.001), Unix Shell (.004), és így tovább. A támadó azért szereti ezt a réteget, mert az interpreterek beépített képességei (letöltés, dekódolás, memóriába töltés, API-hívás) önmagukban is elegendők egy teljes, akár fájl nélküli (fileless) lánchoz. Detekciósan az Execution a legjobban megfigyelhető taktika: minden kódfuttatás folyamatindítási eseményt (Sysmon EID 1, 4688) hagy a parancssorral együtt. A nehézség a legitimitás: az adminok és a telepítőcsomagok ugyanezeket az interpretereket futtatják. A jel ezért a parancssor tartalmában, a szülőfolyamatban és a láncban van, nem magában a futás tényében.", "note": "Techniques/T1059 - Command and Scripting Interpreter.md", "rules": [], "platforms": ["Containers", "ESXi", "IaaS", "Identity Provider", "Linux", "Network Devices", "Office Suite", "SaaS", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1059/", "tacticNames": ["Execution"], "subTotal": 13}, "T1059.001": {"id": "T1059.001", "name": "PowerShell", "kind": "subtechnique", "state": "covered", "blurb": "A PowerShell natívan telepített, aláírt, teljes .NET-hozzáféréssel rendelkező szkriptmotor minden modern Windowson — pontosan ez teszi a legvonzóbb execution-vektorrá. A támadó nem hoz be idegen binárist, hanem egy megbízhatónak minősített, gyakran allowlistelt interpretert használ tetszőleges kódra: fájl-, hálózat- és memóriaműveletekre, .NET reflection-alapú assembly- betöltésre, sőt közvetlen Win32 API-hívásra (P/Invoke). Ez a legnépszerűbb altechnika a T1059 alatt: szinte minden post-exploitation keretrendszer (Cobalt Strike, Empire, PowerSploit, Nishang) PowerShellre épít, mert a beépített képességek (<code>Net.WebClient<\/code>, <code>Reflection.Assembly<\/code>, <code>Add-Type<\/code>) elegendők egy teljes fileless lánchoz. Tipikus alakjai: közvetlen cmdlet/ szkript-végrehajtás, download cradle + <code>IEX<\/code> memóriában, <code>-EncodedCommand<\/code> (<code>-enc<\/code>) Base64-payload, GZip/Deflate-tömörített stager, és reflection-alapú assembly-betöltés. Az obfuszkáció (backtick, string-összefűzés) gyakran kombinálódik vele a string-alapú szűrés megkerülésére. Detekciósan a ScriptBlock-naplózás (4104) és a folyamat-parancssor a fő forrás. A kihívás, hogy a legitim adminisztráció is PowerShellt használ.", "note": "Subtechniques/T1059.001 - PowerShell.md", "rules": ["DETECT-2026-0001", "DETECT-2026-0007", "DETECT-2026-0008", "DETECT-2026-0009", "DETECT-2026-0010", "DETECT-2026-0011", "DETECT-2026-0012", "DETECT-2026-0013", "DETECT-2026-0014", "DETECT-2026-0015", "DETECT-2026-0016", "DETECT-2026-0018"], "platforms": ["Windows"], "url": "https://attack.mitre.org/techniques/T1059/001/", "parent": "T1059"}, "T1059.004": {"id": "T1059.004", "name": "Unix Shell", "kind": "subtechnique", "state": "covered", "blurb": "A Unix Shell alatt a támadó Unix shell (<code>sh<\/code>, <code>bash<\/code>, <code>zsh<\/code>, BusyBox <code>ash<\/code>) parancsokat és szkripteket futtat kódvégrehajtásra — ugyanaz a szerep Linux/ macOS/ESXi rendszereken, mint amit Windowson a PowerShell (.001) tölt be. A shell azért kitüntetett a támadónak, mert mindenütt ott van és mindent tud: nincs szükség külön eszközre, maga a shell tud fájlt letölteni (<code>curl<\/code>/<code>wget<\/code>), hálózati kapcsolatot nyitni (<code>/dev/tcp<\/code>), interpretert indítani, jogosultságot vizsgálni. Egy megszerzett kódfuttatás első lépése szinte mindig egy shell megnyitása. Klasszikus esetben egygépes technika: a shell a kompromittált gépen fut, tipikusan szokatlan szülőből vagy kontextusból (a MITRE AN1081–AN1084 analitikái épp ezt a láncolt viselkedést nevezik jelnek). A repóban ez a réteg — a natív végponti shell-futás — tudatosan nincs felépítve, mert nincs Linux- végponti folyamat-telemetria. Ehelyett a repo közvetve, a webszerver access logján át látja: amikor egy web shellt (T1505.003) a query stringjén keresztül vezérelnek, a beadott érték egy Unix parancs (<code>whoami<\/code>, <code>uname<\/code>, <code>/dev/tcp/<\/code>). A shell-parancs itt a web shell artefaktuma, nem közvetlen végponti futás.", "note": "Subtechniques/T1059.004 - Unix Shell.md", "rules": ["DETECT-2026-0040"], "platforms": ["ESXi", "Linux", "Network Devices", "macOS"], "url": "https://attack.mitre.org/techniques/T1059/004/", "parent": "T1059"}, "T1197": {"id": "T1197", "name": "BITS Jobs", "kind": "technique", "state": "covered", "blurb": "A BITS Jobs során a támadó a Windows beépített Background Intelligent Transfer Service (BITS) szolgáltatását használja fájlletöltésre, -feltöltésre vagy parancsfuttatásra. A BITS egy legitim, aszinkron fájlátviteli mechanizmus, amit a Windows Update és sok telepítő is használ — épp ez teszi jó fedéssé: a forgalom egy megbízott rendszerszolgáltatáson keresztül megy, és nem a gyanús folyamathoz kötődik. A támadó a <code>bitsadmin<\/code> eszközzel vagy a PowerShell <code>Start-BitsTransfer<\/code> cmdlettel hoz létre feladatot; a <code>bitsadmin /SetNotifyCmdLine<\/code> révén a feladat befejeztével akár tetszőleges parancsot is futtathat, ami perzisztenciát ad. A BITS-feladatok túlélik az újraindítást és a kijelentkezést, és a beütemezett újrapróbálkozás miatt makacsul fennmaradnak. Ezért a technika egyszerre szolgál letöltő-, perzisztencia- és stealth-célt (innen a több taktikás besorolás). Detekciósan a jel a <code>bitsadmin<\/code> gyanús parancssora, a szokatlan BITS-célok, és a BITS operational eseménynapló bejegyzései. A nehézség, hogy a legitim szoftver- frissítés is folyamatosan használja a BITS-t.", "note": "", "rules": ["DETECT-2026-0005", "DETECT-2026-0006"], "platforms": ["Windows"], "url": "https://attack.mitre.org/techniques/T1197/", "tacticNames": ["Stealth", "Persistence", "Execution"], "subTotal": 0}, "TA0003": {"id": "TA0003", "name": "Persistence", "kind": "tactic", "state": "covered", "blurb": "A Persistence célja, hogy a támadó hozzáférése túlélje azt, ami egy illékony kódfuttatást megszüntetne: az újraindítást, a kijelentkezést, a folyamat leállását, a hitelesítő adat lejáratát. Nem új képességet ad, hanem biztosítja a már megszerzettet. Értéke onnan jön, hogy a belépési pont drága volt (exploit, phishing, ellopott adat), és a támadó nem akarja újra megfizetni — ezért a perzisztencia jellemzően közvetlenül az első kódfuttatás után, és gyakran több helyen párhuzamosan épül ki. Ha az egyiket megtalálják, a többi életben marad. Detekciósan azért kitüntetett, mert szinte minden technikája állapotot ír valahová: registry-kulcsot, fájlt, ütemezett feladatot, szolgáltatás-bejegyzést. Ez kétszeresen hasznos: a létrehozás pillanata eseményt generál, és — más taktikákkal ellentétben — az eredmény utólag is megtalálható, mert definíció szerint ott marad.", "note": "Tactics/TA0003 - Persistence.md", "rules": [], "platforms": [], "url": "https://attack.mitre.org/tactics/TA0003/", "coverage": "2/22"}, "T1505": {"id": "T1505", "name": "Server Software Component", "kind": "technique", "state": "partial", "blurb": "A Server Software Component alatt a támadó egy szerver-szoftver legitim bővíthetőségi képességét fordítja perzisztenciává: egy webszerverhez, adatbázis- szerverhez vagy alkalmazás-szerverhez ad hozzá saját, rosszindulatú komponenst. A közös nevező, hogy nem külső binárist telepít, hanem a szerver saját futtatási képességét (PHP/ASP/JSP interpreter, tárolt eljárás, transport agent, modul) használja fel arra, hogy tartós hozzáférést vagy kódfuttatást kapjon. Az altechnikák a komponens típusát nevezik meg: web shell (.003), IIS-komponens, SQL tárolt eljárás, transport agent. Az előnye kettős: a komponens a szerver folyamatán belül, annak jogosultságával fut, és a forgalma beleolvad a szerver normál működésébe — nincs külön csatorna, amit egy hálózati szabály megfogna. A web shell (a repo lefedett esete) a leggyakoribb alak: egy webből elérhető könyvtárba írt kis szkript, amin keresztül a támadó parancsokat futtat sima HTTP-forgalomként. Detekciósan a jel a komponens létrejötte (fájlírás a webroot alá) és aktiválása. A létrehozás sokszor egy korábbi exploit (T1190) következménye.", "note": "", "rules": [], "platforms": ["ESXi", "Linux", "Network Devices", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1505/", "tacticNames": ["Persistence"], "subTotal": 6}, "T1505.003": {"id": "T1505.003", "name": "Web Shell", "kind": "subtechnique", "state": "covered", "blurb": "A Web Shell egy kis szerveroldali szkript, amit a támadó egy webről elérhető könyvtárba helyez, és ezen keresztül tartós, interaktív hozzáférést kap a szerverhez — miközben kifelé minden forgalom sima HTTP marad. Nem exploit, hanem a következmény, amit egy korábbi kihasználás (T1190) vagy egy sérülékeny feltöltési pont lehetővé tett; a T1505 alá azért tartozik, mert a webszerver saját interpreterét (PHP/ASP/JSP) fordítja perzisztenciává. A nyereség kettős: perzisztencia (a fájl túléli az újraindítást és nem függ attól, hogy az exploit még működik-e) és álca (a forgalom a 443/80-as porton, ugyanabban a folyamatban zajlik, mint a legitim webforgalom). Az életciklus két, időben elváló fázisra bomlik. Az 1. fázis a shell elhelyezése — feltöltés vagy írás a webroot alá, klasszikus megkerülő trükkökkel (dupla kiterjesztés <code>.php.jpg<\/code>, trailing-dot, null-byte) —, ez önmagában rutin webforgalom. A 2. fázis a shell aktiválása: a felkerült szkript meghívása, jellemzően paraméterben átadott paranccsal — detekciósan pont ez a szétválás a lényeg, mert az első fázis zajos, a második a tényleges jel. A repo emulációs tesztje a mintát ártalmatlan tartalommal gyakorolja.", "note": "Subtechniques/T1505.003 - Web Shell.md", "rules": ["DETECT-2026-0039", "DETECT-2026-0040"], "platforms": ["Linux", "Network Devices", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1505/003/", "parent": "T1505"}, "TA0005": {"id": "TA0005", "name": "Stealth", "kind": "tactic", "state": "covered", "blurb": "A Stealth (Defense Evasion rokon fogalma) alatt a támadó azt teszi, hogy a tevékenysége ne látszódjon vagy ne keltsen gyanút. Nem előreviszi a láncot, hanem fedezi a többi lépést: elrejti a folyamatokat, obfuszkálja a parancsokat, kihasznál aláírt, megbízható bináriskat (LOLBins), vagy tölt be kódot közvetlenül a memóriába, hogy lemezre semmi ne kerüljön. A közös nevező, hogy a támadó nem új utat nyit, hanem a meglévő tevékenységét teszi észlelhetetlenné a védelmi és naplózási mechanizmusok előtt. Éppen ezért ezek a technikák szinte sosem állnak önmagukban: egy elrejtett ablak, egy kódolt parancs vagy egy proxy-végrehajtás mindig valami mást takar. Detekciósan a legnehezebb taktikák egyike, mert a legitim adminisztráció is használ hasonló eszközöket (aláírt segédprogramok, háttérszkriptek). A jel ritkán az egyes technikában van, inkább a kontextusban és a technikák együttállásában. A repóban ide tartozik többek közt az obfuszkáció, a rejtett ablak, a proxy- végrehajtás és a reflektív kódbetöltés.", "note": "", "rules": [], "platforms": [], "url": "https://attack.mitre.org/tactics/TA0005/", "coverage": "5/30"}, "T1027": {"id": "T1027", "name": "Obfuscated Files or Information", "kind": "technique", "state": "partial", "blurb": "Az Obfuscated Files or Information alatt a támadó úgy alakítja át a fájljait vagy a végrehajtott tartalmat (kódolással, tömörítéssel, titkosítással, karakter-behelyettesítéssel), hogy a statikus, kulcsszó-alapú elemzés ne ismerje fel a valódi szándékot, miközben a futásidejű viselkedés változatlan. A cél a szignatúra- és allowlist-alapú detekció megkerülése a legolcsóbb módon: nem kell új exploit, csak a meglévő tartalom elrejtése. Az altechnikák a konkrét módszert nevezik meg: parancs-obfuszkáció (.010), szoftvercsomagolás, steganográfia, kódolt fájlok. A repo lefedett esete a Command Obfuscation, ahol a parancssor szövegét kódolják vagy tördelik. Ez a technika a legtöbb kulcsszó-alapú szabály természetes ellenfele: egy <code>IEX<\/code>-re épülő selection triviálisan kijátszható. Detekciósan a jel gyakran nem a konkrét kulcsszó, hanem a maga az obfuszkáció jellemzői: szokatlanul hosszú Base64-blokkok, magas entrópia, sűrű escaping-karakterek. A nehézség, hogy a legitim eszközök is használnak kódolást (pl. a <code>-EncodedCommand<\/code> idézőjel- problémák elkerülésére). A jel ezért mennyiségi és kontextuális.", "note": "Techniques/T1027 - Obfuscated Files or Information.md", "rules": [], "platforms": ["ESXi", "Linux", "Network Devices", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1027/", "tacticNames": ["Stealth"], "subTotal": 18}, "T1027.010": {"id": "T1027.010", "name": "Command Obfuscation", "kind": "subtechnique", "state": "covered", "blurb": "A Command Obfuscation során a támadó úgy alakítja át a ténylegesen végrehajtott parancsot — kódolással, tömörítéssel, karakter-behelyettesítéssel vagy szintaktikai trükkökkel —, hogy a parancssor szövege ne tartalmazza a szándékot eláruló kulcsszavakat, miközben az interpreter (PowerShell, <code>cmd.exe<\/code>, bash) futásidőben pontosan ugyanazt hajtja végre. Ez a legolcsóbb és leggyakoribb evázió, mert nem igényel új binárist vagy exploitot — pusztán a már meglévő interpreter beépített képességeit (Base64-dekódolás, string- konkatenáció, backtick-escaping) használja a kulcsszó-alapú detekció megkerülésére. Tipikus alakjai: a <code>-EncodedCommand<\/code>/<code>-enc<\/code> flag (UTF-16LE + Base64), a szkript törzsébe ágyazott inline Base64-dekódolás, a tömörítés és kódolás egymásra rétegezése (<code>GZipStream<\/code>/<code>DeflateStream<\/code>, Empire/PowerSploit stager), és a backtick-escaping (<code>I<\/code>\\`<code>E<\/code>\\`<code>X<\/code>), ami a kulcsszó karakterei közé szúrva megtöri a szöveges egyezést. Éppen ezért ez a legtöbb kulcsszó-alapú Sigma szabály ellenfele. Detekciósan a jel a maga az obfuszkáció-mintázat: hosszú kódolt blokk, dekódoló hívás, escaping-sűrűség. A legitim <code>-enc<\/code> használat (pl. idézőjel-problémák miatt) miatt a jel kontextusfüggő.", "note": "Subtechniques/T1027.010 - Command Obfuscation.md", "rules": ["DETECT-2026-0007", "DETECT-2026-0009", "DETECT-2026-0011"], "platforms": ["Linux", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1027/010/", "parent": "T1027"}, "T1218": {"id": "T1218", "name": "System Binary Proxy Execution", "kind": "technique", "state": "partial", "blurb": "A System Binary Proxy Execution alatt a támadó egy aláírt, megbízott, a Windowsba beépített segédprogramot (LOLBin) használ arra, hogy azzal, mint proxyval, rosszindulatú kódot futtasson vagy töltsön be. A közös nevező, hogy a tényleges végrehajtást nem a támadó binárisa, hanem egy legitim rendszer- eszköz végzi — így a művelet megbízható aláíráson keresztül, gyakran allowlisteket megkerülve zajlik. Az altechnikák a konkrét proxy-binárist nevezik meg: <code>rundll32<\/code> (.011), <code>regsvr32<\/code>, <code>mshta<\/code>, <code>msiexec<\/code>, <code>installutil<\/code> és társaik. A támadó nyeresége, hogy a folyamatfa egy ismerős, aláírt eszközt mutat, és a saját payload csak paraméterként vagy betöltött modulként jelenik meg. Detekciósan a jel nem a bináris futása (az normális), hanem a szokatlan paraméterezés, a szokatlan szülő-gyermek viszony, és a betöltött nem szokásos modul vagy hálózati elérés. A LOLBAS-projekt katalogizálja, melyik natív eszköz mire használható vissza. A nehézség pont az, hogy ezek az eszközök a napi működésben is futnak.", "note": "Techniques/T1218 - System Binary Proxy Execution.md", "rules": [], "platforms": ["Linux", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1218/", "tacticNames": ["Stealth"], "subTotal": 14}, "T1218.011": {"id": "T1218.011", "name": "Rundll32", "kind": "subtechnique", "state": "covered", "blurb": "A Rundll32 során a támadó a <code>rundll32.exe<\/code> aláírt Windows-segédprogramot használja arra, hogy azzal, mint proxyval, egy DLL exportált függvényét (vagy más betölthető tartalmat) futtasson — így a rosszindulatú kód egy megbízott, beépített bináris égisze alatt fut, gyakran allowlisteket és egyszerű folyamatnév-alapú szabályokat megkerülve. Eredetileg a <code>rundll32<\/code> a DLL-ekben tárolt függvények parancssori meghívására való, és a Windows napi működésében is fut — ez adja a fedést. A klasszikus offenzív alakok: egy saját DLL adott export-jának hívása (<code>rundll32 evil.dll,EntryPoint<\/code>), a <code>comsvcs.dll MiniDump<\/code> hívása LSASS-dumpra (T1003.001), vagy a JavaScript-en keresztüli végrehajtás (<code>javascript:<\/code> protokoll-handler, <code>mshtml<\/code>). A gyakori jelek a parancssorban: szokatlan vagy hiányzó DLL-útvonal, <code>.dll<\/code> helyett más kiterjesztés, ordinal- szám szerinti export-hívás, vagy közvetlen szkript-protokoll. Detekciósan a szülő-gyermek viszony (ki indította a <code>rundll32<\/code>-t) és a betöltött modul a legbeszédesebb. A nehézség, hogy rengeteg legitim szoftver is <code>rundll32<\/code>-n keresztül hív rendszerfunkciókat.", "note": "Subtechniques/T1218.011 - Rundll32.md", "rules": ["DETECT-2026-0020"], "platforms": ["Windows"], "url": "https://attack.mitre.org/techniques/T1218/011/", "parent": "T1218"}, "T1564": {"id": "T1564", "name": "Hide Artifacts", "kind": "technique", "state": "partial", "blurb": "A Hide Artifacts alatt a támadó a tevékenységének látható vagy megtalálható nyomait rejti el a felhasználó és a védők elől: ablakokat, fájlokat, felhasználói fiókokat, könyvtárakat vagy egyéb artefaktumokat. A közös nevező, hogy nem a végrehajtást vagy a hozzáférést változtatja meg, hanem annak észlelhető lenyomatát csökkenti — a rendszer beépített elrejtő mechanizmusait (rejtett attribútum, rejtett ablak, NTFS alternate data stream, rejtett felhasználó) fordítja a maga javára. Az altechnikák ezeket a konkrét elrejtési módokat nevezik meg, köztük a Hidden Window-t (.003). A technika ritkán áll önmagában: egy elrejtett ablakú folyamat, egy rejtett fájlba írt payload vagy egy rejtett fiók mindig valami mást fedez. Detekciósan a jel gyakran nem maga az elrejtés — az legitim célra is használatos —, hanem az elrejtett artefaktum tartalma vagy a körülötte lévő gyanús lánc. A nehézség, hogy sok legitim automatizáció (telepítők, háttérszkriptek) szándékosan rejt el dolgokat a felhasználó elől. A repóban a Hidden Window altechnika van lefedve.", "note": "Techniques/T1564 - Hide Artifacts.md", "rules": [], "platforms": ["ESXi", "Linux", "Office Suite", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1564/", "tacticNames": ["Stealth"], "subTotal": 14}, "T1564.003": {"id": "T1564.003", "name": "Hidden Window", "kind": "subtechnique", "state": "covered", "blurb": "A Hidden Window során a támadó úgy indít egy folyamatot, hogy annak ne legyen látható ablaka a felhasználó számára — így elkerüli, hogy egy villanásnyi konzolablak vagy egy megnyíló program felkeltse a gyanút. Windowson ez tipikusan a PowerShell <code>-WindowStyle Hidden<\/code> (röviden <code>-W Hidden<\/code>/<code>-W h<\/code>) kapcsolójával, vagy a <code>Start-Process<\/code>/<code>WScript.Shell.Run<\/code> ablak-elrejtő paraméterével történik. Ez nem önálló execution- vagy persistence-technika, hanem egy kiegészítő &quot;csend-üzemmód&quot; más technikák fölé: egy háttérben futó reverse shell, egy ütemezett feladatból induló payload vagy egy C2-beacon mind hasznot húz abból, ha a felhasználó semmilyen vizuális jelet nem lát. Éppen ezért szinte mindig más T1059.001-mintákkal (kódolt parancs, download cradle) együtt jelenik meg ugyanabban a parancssorban. Egy közvetett változat egy <code>wscript.exe<\/code>/VBScript wrapper: a <code>WScript.Shell.Run<\/code> harmadik paramétere (<code>0<\/code> = rejtett) éri el ugyanazt, miközben a <code>powershell.exe<\/code> parancssora akár tiszta maradhat. Detekciósan a jel a <code>Hidden<\/code>/<code>-W h<\/code> a parancssorban, más gyanús indikátorral kombinálva. A legnagyobb kihívás, hogy rengeteg legitim háttér-automatizáció (SCCM/Intune telepítő, monitoring-agent) is szándékosan fut rejtett ablakkal — önmagában a rejtett ablak szinte semmit sem jelent.", "note": "Subtechniques/T1564.003 - Hidden Window.md", "rules": ["DETECT-2026-0014"], "platforms": ["Linux", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1564/003/", "parent": "T1564"}, "T1620": {"id": "T1620", "name": "Reflective Code Loading", "kind": "technique", "state": "covered", "blurb": "A Reflective Code Loading során a támadó úgy tölt be és futtat kódot (jellemzően egy .NET assembly-t vagy egy natív DLL-t), hogy megkerüli a rendszer szokásos betöltő mechanizmusát (a Windows image loadert) — a kód közvetlenül egy már futó folyamat memóriájába kerül, anélkül hogy lemezre íródna vagy a rendes <code>LoadLibrary<\/code>/CreateProcess úton menne. Ez a fileless végrehajtás egyik sarokköve: mivel nincs lemezre írt fájl és nincs szabályos module-load esemény, a fájl-alapú AV-nak és a képbetöltés-figyelő szabályoknak nincs mit megfogniuk. A .NET-világban ezt a <code>System.Reflection.Assembly.Load(byte[])<\/code> hívás valósítja meg (a Cobalt Strike <code>execute-assembly<\/code>, a PowerShell <code>[Reflection.Assembly]::Load<\/code>), a natív oldalon a klasszikus reflective DLL injection. A támadó gyakran egy megbízott folyamatba tölti a kódot, hogy a végrehajtás annak nevében fusson. Detekciósan a jel a memória-anomáliákban van: végrehajtható (RWX) memóriaterület backing fájl nélkül, gyanús .NET-CLR betöltés egy nem-menedzselt folyamatba, vagy a reflection API-k hívása szokatlan kontextusban. A nehézség, hogy sok legitim menedzselt alkalmazás is tölt be assembly-t reflectionnel. A megbízható jel jellemzően EDR-szintű memória-telemetriát igényel.", "note": "", "rules": ["DETECT-2026-0015"], "platforms": ["Linux", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1620/", "tacticNames": ["Stealth"], "subTotal": 0}, "TA0112": {"id": "TA0112", "name": "Defense Impairment", "kind": "tactic", "state": "covered", "blurb": "A Defense Impairment (a repo saját taktika-besorolása) alatt a támadó közvetlenül a védelmi és naplózási képességeket rontja le vagy kapcsolja ki, hogy a további tevékenysége se megelőzésbe, se rögzítésbe ne ütközzön. Különbözik a puszta elrejtőzéstől: itt a támadó aktívan hozzányúl a kontrollhoz magához — leállítja a naplószolgáltatást, kikapcsol audit- kategóriákat, patcheli az AMSI-t, vagy törli a már keletkezett bejegyzéseket. A cél a szemtanú megvakítása: vagy meg sem születik a bizonyíték, vagy utólag eltűnik. Ezek a lépések tipikusan közvetlenül a fő payload előtt vagy után futnak, mert csak akkor van értelmük, ha valamit fedezni kell. A megelőző változat (naplózás letiltása) csendesebb, mint az utólagos (napló-törlés), mert egy üres napló önmagában gyanús. Detekciósan a kihívás az, hogy ugyanezeket a kulcsokat és parancsokat a legitim hardening-szkriptek is írják, csak ellenkező irányban. A repóban a Windows-naplózás letiltása és törlése tartozik ide.", "note": "", "rules": [], "platforms": [], "url": "https://attack.mitre.org/tactics/TA0112/", "coverage": "1/18"}, "T1685": {"id": "T1685", "name": "Disable or Modify Tools", "kind": "technique", "state": "covered", "blurb": "A Disable or Modify Tools (a repo besorolása szerint) alatt a támadó közvetlenül manipulálja azokat a védelmi és naplózási mechanizmusokat, amik egyébként a tevékenységét rögzítenék vagy megakadályoznák — a Windows Event Log szolgáltatást, egy biztonsági eszköz felhasználói felületét vagy riasztását, egy cloud-naplózási funkciót, vagy a Linux <code>auditd<\/code>-t. A közös nevező nem egy konkrét mechanizmus, hanem a szándék: a védelem tudatos hatástalanítása, mielőtt vagy miközben a tényleges rosszindulatú tevékenység lezajlana. A technika két, ellentétes időbeli irányban valósulhat meg. Az egyik megelőzi az esemény keletkezését (a naplózás/eszköz előzetes letiltása — .001, .002, .004), a másik eltünteti a már keletkezett bejegyzést utólag (törlés — .005, .006). A kettő anti-forensics szempontból nem egyenértékű: egy hirtelen üres napló azonnal gyanút kelt, míg a megelőző letiltás belesimul abba, hogy &quot;erről sosem keletkezett bejegyzés&quot;. Detekciósan a legnagyobb kihívás, hogy a legitim hardening- és karbantartó-szkriptek ugyanezekhez a kulcsokhoz, szolgáltatásokhoz és audit-kategóriákhoz nyúlnak, csak ellenkező irányban — a szándékbeli különbség a parancssorból nem mindig olvasható ki.", "note": "Techniques/T1685 - Disable or Modify Tools.md", "rules": ["DETECT-2026-0012"], "platforms": ["Containers", "ESXi", "IaaS", "Linux", "Network Devices", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1685/", "tacticNames": ["Defense Impairment"], "subTotal": 6}, "T1685.001": {"id": "T1685.001", "name": "Disable or Modify Windows Event Log", "kind": "subtechnique", "state": "covered", "blurb": "A Disable or Modify Windows Event Log (a repo besorolása szerint) során a támadó közvetlenül manipulálja azt a naplózási mechanizmust, ami egyébként a tevékenységét rögzítené — még mielőtt a tényleges payload lefutna. Kétféle módon: vagy magát a Windows Event Log szolgáltatást (leállítás, <code>auditpol<\/code> kategóriák kikapcsolása), vagy egy adott alkalmazás naplózási képességét (pl. a PowerShell ScriptBlock/Module logging GPO-ját). Ez a klasszikus &quot;vakítsd meg a szemtanút&quot; lépés: nem a már meglévő bejegyzéseket törli (azt a T1685.005 teszi), hanem megelőzi, hogy egyáltalán keletkezzen bejegyzés a következő lépésekről. Anti-forensics szempontból ez az olcsóbb és kevésbé feltűnő út: egy törölt napló azonnal gyanús, míg a naplózás megelőző letiltása belesimul abba, hogy &quot;erről soha nem is keletkezett bejegyzés&quot;. Tipikus alakjai: a <code>ScriptBlockLogging<\/code> GPO-kulcs átírása/törlése (a 4104/4103 elnémítására), az AMSI reflection-alapú patchelése (<code>AmsiScanBuffer<\/code>, <code>amsiInitFailed<\/code>), és az <code>EventLog<\/code> szolgáltatás leállítása. Detekciósan a kihívás, hogy a legitim hardening-szkriptek ugyanezeket a kulcsokat és kategóriákat írják, csak ellenkező irányban — a parancssor a szándékbeli különbséget nem mutatja.", "note": "Subtechniques/T1685.001 - Disable or Modify Windows Event Log.md", "rules": ["DETECT-2026-0016"], "platforms": ["Windows"], "url": "https://attack.mitre.org/techniques/T1685/001/", "parent": "T1685"}, "TA0006": {"id": "TA0006", "name": "Credential Access", "kind": "tactic", "state": "covered", "blurb": "A Credential Access alatt a támadó érvényes hitelesítő adatokat próbál szerezni: felhasználónév-jelszó párt, jelszó-hasht, Kerberos ticketet, tokent vagy tanúsítványt. Ennek az az értéke, hogy a lopott azonosítóval végzett tevékenység legitim felhasználói tevékenységnek látszik — nem kell hozzá exploit, nem kell malware, és a legtöbb kontroll elengedi. Egy megszerzett domain admin hash lényegében kiváltja az összes további privilege escalationt. Ez a lánc fordulópontja: innentől a támadó nem betör, hanem bejelentkezik. A megszerzés útjai szélesek: az OS hitelesítőadat-tárolóiból való dump (T1003), online vagy offline próbálgatás (T1110), Kerberos-jegyek lopása és kovácsolása (T1558), vagy hálózati man-in-the-middle (T1557). Detekciósan itt éri meg a legtöbbet befektetni, mert ez az utolsó pont, ahol a tevékenység még egyértelműen rosszindulatúnak látszik, mielőtt beleolvadna a normál forgalomba.", "note": "Tactics/TA0006 - Credential Access.md", "rules": [], "platforms": [], "url": "https://attack.mitre.org/tactics/TA0006/", "coverage": "6/17"}, "T1003": {"id": "T1003", "name": "OS Credential Dumping", "kind": "technique", "state": "partial", "blurb": "Az OS Credential Dumping alatt a támadó az operációs rendszer saját hitelesítőadat-tárolóiból próbál felhasználóneveket, jelszó-hasheket vagy cleartext jelszavakat kinyerni. A közös nevező nem az eszköz és nem a módszer, hanem a cél tárolója: minden altechnika ugyanarra a kérdésre ad más választ — hol tartja a Windows a hitelesítő adatot, és hogyan lehet hozzáférni. Ez detekciósan is meghatározó: mindegy, hogy Mimikatz, ProcDump vagy saját írású eszköz csinálja, a tárolóhoz ugyanazon a néhány úton lehet hozzáférni — az LSASS folyamat megnyitása (.001), a SAM (.002) / SECURITY (.004) / cache (.005) registry hive kiexportálása, az NTDS.dit fájl kimásolása (.003), vagy a domain replikáció megszemélyesítése (DCSync, .006). Szinte minden altechnika helyi rendszergazdai vagy SYSTEM jogot feltételez, tehát a technika megjelenése önmagában azt is jelzi, hogy a támadó már túl van a privilege escalationön. A zsákmány értéke altechnikánként eltér: a friss LSASS és az NTDS.dit azonnal használható domain-anyagot ad, a cache-elt hitelesítők csak offline törésre jók. A repo mind a hat Windows-altechnikát lefedi.", "note": "Techniques/T1003 - OS Credential Dumping.md", "rules": [], "platforms": ["Linux", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1003/", "tacticNames": ["Credential Access"], "subTotal": 8}, "T1003.001": {"id": "T1003.001", "name": "LSASS Memory", "kind": "subtechnique", "state": "covered", "blurb": "Az LSASS Memory során a támadó a futó LSASS (Local Security Authority Subsystem Service) folyamat memóriájából nyeri ki a hitelesítő adatokat. Az LSASS azért célpont, mert az interaktívan bejelentkezett felhasználók titkait — NTLM hash, Kerberos ticket, és bizonyos konfigurációnál (WDigest) cleartext jelszó — a folyamat memóriájában tartja, amíg a munkamenet él. Ez a T1003 legértékesebb altechnikája: egy frissen bejelentkezett domain admin munkamenetéből azonnal használható hitelesítő adat esik ki, exploit nélkül. Cserébe ennek a legjobb a detekciós esélye is, mert nagyon kevés legitim ok van arra, hogy egy nem-rendszerfolyamat olvasási joggal megnyissa az LSASS-t. Minden módszer közös lépése egy <code>OpenProcess<\/code> hívás az LSASS-re olvasási joggal; utána már csak abban különböznek, hogyan olvassák ki és hova írják a memóriát. Klasszikus alakjai: közvetlen memóriaolvasás (Mimikatz <code>sekurlsa::logonpasswords<\/code>), aláírt LOLBin minidump (<code>comsvcs.dll MiniDump<\/code> <code>rundll32<\/code>-vel), aláírt Sysinternals <code>ProcDump -ma<\/code>, és a Task Manager &quot;Create dump file&quot; GUI-útja. A dumpból a kinyerés tipikusan később, másik gépen történik — ezért a detekciónak a dump keletkezésekor kell megfognia.", "note": "Subtechniques/T1003.001 - LSASS Memory.md", "rules": ["DETECT-2026-0019", "DETECT-2026-0020", "DETECT-2026-0021", "DETECT-2026-0022", "DETECT-2026-0025"], "platforms": ["Windows"], "url": "https://attack.mitre.org/techniques/T1003/001/", "parent": "T1003"}, "T1003.002": {"id": "T1003.002", "name": "Security Account Manager", "kind": "subtechnique", "state": "covered", "blurb": "A Security Account Manager (SAM) során a támadó a <code>HKLM\\SAM<\/code> registry hive-ból nyeri ki a helyi felhasználói fiókok NTLM jelszó-hasheit. A SAM hive futás közben kizárólag a SYSTEM fiók számára olvasható, ezért a sikeres hozzáférés önmagában azt jelenti, hogy a támadó már rendszergazdai vagy SYSTEM jogot szerzett — ez nem privilege escalation eszköz, hanem annak eredménye. Domain környezetben a SAM önmagában kevés értékű (csak helyi fiókokat tartalmaz), de mivel sok szervezet ugyanazt a helyi admin jelszót használja gépről gépre, egyetlen SAM kinyerése tipikusan azonnali laterális mozgást enged pass-the- hash-sel. A hive dekódolásához a boot key kell, ami a <code>HKLM\\SYSTEM<\/code> hive-ban van — ezért a kettő szinte mindig együtt kerül kiexportálásra. A közös cél megkerülni a Windows futásidejű zárolását ezeken a hive-okon. Tipikus alakjai: a natív <code>reg.exe save<\/code>/<code>export<\/code>, az <code>esentutl /y /vss<\/code> (zárolt fájl másolása Volume Shadow Copyból), és a VSC közvetlen elérése a <code>\\\\?\\GLOBALROOT\\...\\config\\SAM<\/code> nyers útvonalon. A kinyert hive-ból a hasheket offline fejtik (<code>secretsdump.py<\/code>, <code>pypykatz<\/code>, Mimikatz). A <code>reg.exe<\/code> minta itt ugyanaz, mint a LSA Secretsnél — a célhive (<code>SAM<\/code> vs. <code>SECURITY<\/code>) dönti el, melyik altechnikáról van szó.", "note": "Subtechniques/T1003.002 - Security Account Manager.md", "rules": ["DETECT-2026-0022", "DETECT-2026-0023", "DETECT-2026-0026", "DETECT-2026-0027"], "platforms": ["Windows"], "url": "https://attack.mitre.org/techniques/T1003/002/", "parent": "T1003"}, "T1003.003": {"id": "T1003.003", "name": "NTDS", "kind": "subtechnique", "state": "covered", "blurb": "Az NTDS során a támadó a Domain Controller <code>%SystemRoot%\\NTDS\\ntds.dit<\/code> fájljából — az Active Directory saját ESE (Extensible Storage Engine) adatbázisából — nyeri ki a teljes domain összes felhasználói és gépi fiókjának hash-ét egyszerre. Ez a T1003 legmagasabb hozamú altechnikája: egyetlen fájl a teljes domain hitelesítőadat-készletét tartalmazza, beleértve a <code>krbtgt<\/code> fiókot, amivel golden ticket készíthető. A művelethez Domain Controller admin jog kell, tehát ez a domain-szintű teljes kompromittálódás egyik utolsó lépése. Az <code>ntds.dit<\/code> futás közben az ESE motor által kizárólagosan zárolt fájl, ezért minden módszer közös eleme megkerülni ezt a zárolást. Tipikus alakjai: az <code>ntdsutil<\/code> IFM (Install From Media, <code>ac i ntds<\/code> + <code>create full<\/code>), az <code>esentutl /vss<\/code>/<code>/y<\/code>, a Volume Shadow Copy manuális útvonala (<code>vssadmin create shadow<\/code>, <code>diskshadow<\/code>, WMI) tetszőleges másolóeszközzel, a <code>wbadmin<\/code> system state backup, és — ha a támadó le tudja állítani az AD DS szolgáltatást — a fájl közvetlen másolása. A <code>SYSTEM<\/code> hive-ot ehhez is együtt viszik a dekódoláshoz. A kinyerés a DC-től függetlenül, offline zajlik.", "note": "Subtechniques/T1003.003 - NTDS.md", "rules": ["DETECT-2026-0024", "DETECT-2026-0030", "DETECT-2026-0031"], "platforms": ["Windows"], "url": "https://attack.mitre.org/techniques/T1003/003/", "parent": "T1003"}, "T1003.004": {"id": "T1003.004", "name": "LSA Secrets", "kind": "subtechnique", "state": "covered", "blurb": "Az LSA Secrets során a támadó a <code>HKLM\\SECURITY\\Policy\\Secrets<\/code> alatt tárolt, a Local Security Authority által kezelt titkokat nyeri ki. Ez a hive tartalmazza a szolgáltatásfiók-jelszavakat (amiket a Windows automatikus indításhoz tárol), az automatikus bejelentkezési jelszót (<code>DefaultPassword<\/code>), a VPN/vezeték nélküli előre megosztott kulcsokat, és a Domain Cached Credentials (DCC2) hasheket — ez utóbbi átfed a T1003.005-tel, mert ugyanaz az adat mindkét helyről kinyerhető. A kiemelt veszélye, hogy a benne tárolt jelszavak jelentős része visszafejthető cleartextre, nem csak hash-ként: a Windows titkosítva tárolja, de a boot key (a <code>SYSTEM<\/code> hive-ból) birtokában a titkosítás megfordítható. Egy szolgáltatásfiók-jelszó gyakran domain-szintű jogosultsággal bír, így ez közvetlen laterális mozgási vagy privilege escalation utat nyithat. A SAM kinyeréséhez képest a különbség csak a célhive: itt <code>HKLM\\SECURITY<\/code> a cél a <code>HKLM\\SAM<\/code> helyett, a boot keyhez ugyanúgy a <code>HKLM\\SYSTEM<\/code> kell. Tipikus alakja a <code>reg.exe save<\/code>/<code>export<\/code> (gyakran PsExec <code>-s<\/code>-sel, SYSTEM-szintű <code>reg.exe<\/code>-ért) és az <code>esentutl /y<\/code>. A titkokat a kimásolt hive-ból offline fejtik (<code>secretsdump.py<\/code>, <code>pypykatz<\/code>, Mimikatz <code>lsadump::secrets<\/code>).", "note": "Subtechniques/T1003.004 - LSA Secrets.md", "rules": ["DETECT-2026-0022", "DETECT-2026-0023", "DETECT-2026-0026"], "platforms": ["Windows"], "url": "https://attack.mitre.org/techniques/T1003/004/", "parent": "T1003"}, "T1003.005": {"id": "T1003.005", "name": "Cached Domain Credentials", "kind": "subtechnique", "state": "covered", "blurb": "A Cached Domain Credentials során a támadó a Windows által domain-tag végpontokon eltárolt, hash-elt bejelentkezési hitelesítő adatokat célozza. A Windows az utolsó néhány (alapból 10) sikeres domain bejelentkezést tárolja a <code>HKLM\\SECURITY\\Cache<\/code> alatt, hogy a felhasználó Domain Controller elérése nélkül (pl. offline laptop) is be tudjon jelentkezni. Ez a Domain Cached Credentials version 2 (DCC2, &quot;mscash2&quot;) formátum — nem azonos az NTLM hash-sel, saját, iterált (10 000 kör) eljárást használ, ezért jelentősen lassabb feltörni. Fontos korlát: a DCC2 nem hálózatképes, nem használható pass-the- hash-hez, csak offline brute-force/szótár-alapú törésre — ezért ez az altechnika alacsonyabb prioritású a T1003 családban, a zsákmány értéke a jelszó erősségétől függ. A közvetlen hash-kinyerés a LSA Secrets-hez hasonló: a <code>Cache<\/code> a <code>HKLM\\SECURITY<\/code> hive része, tehát ugyanaz a <code>reg.exe save<\/code>/ <code>esentutl<\/code> hive-export módszer, majd offline <code>secretsdump.py<\/code>. Egy kapcsolódó, de más lépés a <code>cmdkey /list<\/code>: ez nem DCC2 hasheket ad, hanem a Credential Managerben mentett célok neveit (RDP, megosztások) — ez felderítés, nem közvetlen hash-lopás. A <code>cmdkey /list<\/code> egyébként hétköznapi help desk parancs.", "note": "Subtechniques/T1003.005 - Cached Domain Credentials.md", "rules": ["DETECT-2026-0022", "DETECT-2026-0028"], "platforms": ["Linux", "Windows"], "url": "https://attack.mitre.org/techniques/T1003/005/", "parent": "T1003"}, "T1003.006": {"id": "T1003.006", "name": "DCSync", "kind": "subtechnique", "state": "covered", "blurb": "A DCSync gyökeresen más, mint a T1003 többi altechnikája: itt a támadó nem fér hozzá semmilyen lemezen tárolt fájlhoz vagy hive-hoz — ehelyett a saját gépén futó eszközzel Domain Controllernek adja ki magát, és a domain replikációs protokollon (MS-DRSR) keresztül kéri le tetszőleges fiók, akár a <code>krbtgt<\/code>, hash-eit. A DC ugyanúgy válaszol, mintha egy másik valódi DC kérné a replikációt — a protokoll szintjén nincs különbség. Ehhez nem kell kódvégrehajtás a DC-n, sem hozzáférés az <code>ntds.dit<\/code>-hez, csak Replicating Directory Changes (és All) jogosultság a hívó fiókon. Ez a jog alapból csak Domain/Enterprise Adminok és DC-gépfiókok birtokában van, de egy AD ACL- hibás konfiguráció miatt alacsonyabb jogú fiók is megkaphatja — ezért a sikeres DCSync vagy egy már kompromittált privilegizált fiókot, vagy egy korábbi ACL-visszaélést jelez. Tipikus eszközei: a Mimikatz <code>lsadump::dcsync<\/code>, a legitim, aláírt DSInternals <code>Get-ADReplAccount<\/code>, és az Impacket <code>secretsdump.py -just-dc<\/code> (akár Linuxról). Mindhárom azonos hálózati mintát hagy: egy <code>DRSGetNCChanges<\/code> hívást, amit a DC <code>4662<\/code>-es eseményként rögzít, ha a SACL be van állítva. Legitim oldalon csak a valódi DC-k egymás közti replikációja (mindig DC-gépfiókból) generál hasonlót.", "note": "Subtechniques/T1003.006 - DCSync.md", "rules": ["DETECT-2026-0022", "DETECT-2026-0029"], "platforms": ["Windows"], "url": "https://attack.mitre.org/techniques/T1003/006/", "parent": "T1003"}, "T1040": {"id": "T1040", "name": "Network Sniffing", "kind": "technique", "state": "covered", "blurb": "A Network Sniffing során a támadó a gép hálózati interfészén passzívan olvassa a forgalmat, hogy abból információt nyerjen: hitelesítő adatot, session-tokent, belső hosztneveket, protokoll-verziókat, a hálózat topológiáját. Nem küld semmit, nem módosít semmit — csak hallgat. Ez a technika egyszerre két taktikában szerepel, és ez a lényege: ugyanaz a művelet két nyereséget ad — Credential Access oldalon a hitelesítő anyagot (cleartext jelszó, NTLMv2 challenge-response, Kerberos ticket), Discovery oldalon magát a környezet megismerését. A technika gyakorlati korlátja, hogy kapcsolt (switchelt) hálózaton a sniffing önmagában kevés: a switch csak a portnak szóló és a broadcast/multicast forgalmat küldi, így a támadó csak a saját gépe forgalmát és a szegmens broadcast-jait látja. Ezért a sniffing a valóságban szinte mindig egy pozíció-technikával párban jelenik meg (T1557 Adversary-in-the-Middle, vagy port mirroring/SPAN a hálózati eszközön). Minden módszerhez helyi rendszergazdai jog kell (capture driver vagy raw socket), tehát sosem az első lépés. Tipikus eszközei: a Wireshark-család (<code>tshark<\/code>, <code>dumpcap<\/code>) Npcap driverrel, a <code>RawCap<\/code> driver nélkül, és a natív <code>pktmon<\/code>. Detekciósan az <code>OriginalFileName<\/code> mező átnevezés-ellenálló jel.", "note": "Techniques/T1040 - Network Sniffing.md", "rules": ["DETECT-2026-0044"], "platforms": ["IaaS", "Linux", "Network Devices", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1040/", "tacticNames": ["Credential Access", "Discovery"], "subTotal": 0}, "T1056": {"id": "T1056", "name": "Input Capture", "kind": "technique", "state": "partial", "blurb": "Az Input Capture alatt a támadó a felhasználó által bevitt adatot fogja el — jellemzően azért, hogy hitelesítő adatot vagy más érzékeny információt szerezzen közvetlenül a beviteli forrásnál, mielőtt az titkosításra vagy feldolgozásra kerülne. Ezért szerepel a technika egyszerre Collection és Credential Access taktikában: a begyűjtött bevitel egyszerre nyersanyag és hitelesítő adat. A közös nevező, hogy a támadó a beviteli csatornát csapolja meg, nem a tárolt adatot — így olyan titkokhoz is hozzáfér, amik sehol nem pihennek lemezen (frissen begépelt jelszó, MFA-kód, űrlap-tartalom). Az altechnikák a lehallgatás pontját nevezik meg: billentyűleütés-naplózás (.001 Keylogging), hamis GUI-beviteli mező (.002), webportál-átirányítás (.003), és a hitelesítési API-k beékelése/hookolása (.004). A repo lefedett esete a Keylogging. Detekciósan a jel az elfogó mechanizmus telepítésében és működésében van: alacsony szintű billentyűzet-hook, a beviteli eseményekre való feliratkozás, vagy egy folyamatosan növekvő log-fájl. A nehézség, hogy egyes legitim szoftverek (távoli asztal, akadálymentesítés, makró-eszközök) is hookolják a bevitelt.", "note": "", "rules": [], "platforms": ["Linux", "Network Devices", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1056/", "tacticNames": ["Collection", "Credential Access"], "subTotal": 4}, "T1056.001": {"id": "T1056.001", "name": "Keylogging", "kind": "subtechnique", "state": "covered", "blurb": "A Keylogging során a támadó a felhasználó billentyűleütéseit naplózza, hogy begépelt jelszavakat, hitelesítő adatokat és egyéb érzékeny bevitelt fogjon el — közvetlenül a forrásnál, még a titkosítás előtt. Ez az Input Capture leggyakoribb és legrégebbi alakja, és azért különösen értékes, mert olyan titkokhoz is hozzáfér, amiket semelyik hitelesítőadat-tároló nem őriz (egy frissen begépelt jelszó, egy MFA egyszeri kód, egy jelmondat). Windowson technikailag több úton valósulhat meg: alacsony szintű billentyűzet-hook telepítése (<code>SetWindowsHookEx<\/code> a <code>WH_KEYBOARD_LL<\/code> hook-kal), az egyes billentyűk állapotának periodikus lekérdezése (<code>GetAsyncKeyState<\/code>), vagy keretrendszer-alapú begyűjtés (PowerSploit <code>Get-Keystrokes<\/code>, más post-exploitation eszközök). A begyűjtött leütések tipikusan egy helyi log-fájlba kerülnek, amit a támadó később kiexfiltrál. Detekciósan a jel az elfogó mechanizmus telepítésében (hook-hívások, gyanús API-használat), a keylogger-keretrendszerek parancssori mintáiban, és a folyamatosan növekvő, gépeltnek látszó tartalmú log-fájl keletkezésében van. A nehézség, hogy egyes legitim eszközök (távoli asztal, akadálymentesítés, makró-rögzítők) is jogosan használnak billentyűzet-hookot.", "note": "", "rules": ["DETECT-2026-0045"], "platforms": ["Linux", "Network Devices", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1056/001/", "parent": "T1056"}, "T1110": {"id": "T1110", "name": "Brute Force", "kind": "technique", "state": "partial", "blurb": "A Brute Force alatt a támadó nem ismer érvényes hitelesítő adatot (vagy csak egy hasht jelszó nélkül), és ezt szisztematikus próbálgatással próbálja pótolni. A közös nevező a négy altechnikában nem egy protokoll, hanem a próbálgatás iránya és forrása: vagy közvetlenül egy élő hitelesítési szolgáltatás ellen fut sok kísérlet (online), vagy egy már megszerzett hash ellen a támadó saját gépén, kapcsolat nélkül (offline). Ez az irány-különbség a legfontosabb tanulság. Az online altechnikák — Password Guessing (.001), Password Spraying (.003), Credential Stuffing (.004) — mindegyike sok sikertelen hitelesítési kísérletet hagy a célrendszeren vagy a DC-n, ami natívan naplózott, jól detektálható jel (<code>4625<\/code>, <code>4771<\/code>). Az offline (.002 Password Cracking) viszont a támadó infrastruktúráján zajlik, semmilyen forgalmat nem generál a védett környezet felé, amíg a feltört jelszót fel nem használja — az pedig egy darab, normálisnak látszó sikeres bejelentkezés. A .001 és a .003 egymás tükörképe: az egyik egy fiók × sok jelszó, a másik egy jelszó × sok fiók (a lockout megkerülésére). Detekciósan a jel a kudarcok mennyiségében és eloszlásában van. A repo a Guessing és a Spraying altechnikát fedi.", "note": "Techniques/T1110 - Brute Force.md", "rules": [], "platforms": ["Containers", "ESXi", "IaaS", "Identity Provider", "Linux", "Network Devices", "Office Suite", "SaaS", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1110/", "tacticNames": ["Credential Access"], "subTotal": 4}, "T1110.001": {"id": "T1110.001", "name": "Password Guessing", "kind": "subtechnique", "state": "covered", "blurb": "A Password Guessing a klasszikus brute force szűk értelemben: a támadó egy (vagy néhány) ismert fiókot céloz, és ellene sok, szisztematikusan generált vagy listából vett jelszót próbál, közvetlenül egy élő hitelesítési szolgáltatás ellen. A támadó a szolgáltatást magát használja orákulumként: minden próbára kap egy igen/nem választ. Ez a legkockázatosabb az online altechnikák közül a támadónak, mert egyetlen fiókra koncentrál sok próbát, így egy szigorú fiók-lockout házirend gyorsan lezárja — pont ez az oka, hogy a Password Spraying (.003) létezik, ennek a kockázatnak a megkerülésére. Tipikus eszköze a <code>Hydra<\/code>, ami tucatnyi protokollt támogat (SSH, RDP, SMB, FTP, HTTP form); egy ismert felhasználónév (<code>-l<\/code>) és egy jelszólista (<code>-P<\/code>) ellen fut, RDP-nél jellemzően fojtva (<code>-t 1<\/code>). Egy másik alak a <code>CrackMapExec<\/code>/<code>NetExec<\/code> SMB/WinRM ellen, már meglévő domain-ismerettel — ez még mindig egy fiók × sok jelszó, csak több célgép ellen. A logban a célgépen vagy a DC-n sorozatban jelenik meg a <code>4625<\/code> ugyanarra a <code>TargetUserName<\/code>-re, jellemzően egy forrás- IP-ről. A leggyakoribb legitim ok egy elfelejtett jelszóval újrapróbálkozó felhasználó vagy egy rossz jelszóval konfigurált szolgáltatás.", "note": "Subtechniques/T1110.001 - Password Guessing.md", "rules": ["DETECT-2026-0002"], "platforms": ["Containers", "ESXi", "IaaS", "Identity Provider", "Linux", "Network Devices", "Office Suite", "SaaS", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1110/001/", "parent": "T1110"}, "T1110.003": {"id": "T1110.003", "name": "Password Spraying", "kind": "subtechnique", "state": "covered", "blurb": "A Password Spraying a Password Guessing tengelyének szándékos megfordítása: ahelyett, hogy egy fiók ellen próbálna sok jelszót, a támadó egy (vagy néhány) gyakori jelszót próbál ki sok fiók ellen. A cél explicit a fiók-szintű lockout-küszöb kikerülése — statisztikailag egy nagyobb szervezetben szinte biztosan lesz néhány felhasználó, akinek épp az adott gyakori jelszava van (<code>Summer2026!<\/code>, <code>Welcome1<\/code>), és mivel fiókonként csak egy-két próba történik, egyik sem éri el a lockout-küszöböt. Ez az altechnika kifejezetten azért létezik, mert a .001 elleni legkézenfekvőbb védekezés (fiók-lockout) a spraying-et nem állítja meg — ez a legfontosabb tanulság hozzá. Tipikus eszközei: a <code>kerbrute<\/code>, ami a Kerberos pre-authentikációt (AS-REQ) használja próbálgatásra (gyorsabb, de a sikertelen pre-auth ugyanúgy lockoutolhat); a <code>DomainPasswordSpray.ps1<\/code>, ami domain-csatlakoztatott gépen automatikusan begyűjti az összes felhasználót és ütemezetten sprayel; és a <code>CrackMapExec<\/code>/<code>NetExec<\/code> spray-módja megfordított bemenettel. A DC-n ez sok fiókra elosztott, egyenként kevés <code>4625<\/code>/<code>4771<\/code> kudarcként jelenik meg egy forrásból. A leggyakoribb legitim hasonlóság egy IT-oldali jelszó-reset kampány.", "note": "Subtechniques/T1110.003 - Password Spraying.md", "rules": ["DETECT-2026-0003"], "platforms": ["Containers", "ESXi", "IaaS", "Identity Provider", "Linux", "Network Devices", "Office Suite", "SaaS", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1110/003/", "parent": "T1110"}, "T1557": {"id": "T1557", "name": "Adversary-in-the-Middle", "kind": "technique", "state": "partial", "blurb": "Az Adversary-in-the-Middle során a támadó a hálózati kommunikációba ékelődik be két végpont, vagy egy végpont és az infrastruktúra közé, hogy onnan lehallgassa vagy manipulálja a forgalmat. A közös nevező nem egy konkrét protokoll, hanem a pozíció: a támadó hamis hálózati-rétegbeli válaszokkal (névfeloldás, ARP, DHCP) elhiteti az áldozat gépével, hogy ő a legitim célpont, majd az így hozzá irányuló forgalmat vagy csak lehallgatja, vagy aktívan tovább is adja (relay) egy másik, valódi célpont felé. Ez utóbbi — a relay — teszi a technikát különösen veszélyessé a puszta lehallgatáshoz képest: a támadónak nem kell megfejtenie egy hash-t, mert a hitelesítési kísérletet élőben, a saját nevében továbbküldve azonnal hitelesített session-t kap egy másik gépen, az áldozat identitásával. Ezért szerepel a technika egyszerre Credential Access és Collection taktikában. Az altechnikák a megszemélyesítés hálózati rétegét nevezik meg: LLMNR/NBT-NS poisoning (.001), ARP cache poisoning (.002), DHCP spoofing (.003), Evil Twin (.004). Az AiTM szinte mindig a Network Sniffinggel (T1040) párban dolgozik, mert az odairányítja a forgalmat a lehallgatáshoz. Detekciósan a jel a hamis névfeloldási válaszokban és a szokatlan relay-forgalomban van. A repo az LLMNR/SMB relay altechnikát fedi.", "note": "Techniques/T1557 - Adversary-in-the-Middle.md", "rules": [], "platforms": ["Linux", "Network Devices", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1557/", "tacticNames": ["Credential Access", "Collection"], "subTotal": 4}, "T1557.001": {"id": "T1557.001", "name": "Name Resolution Poisoning and SMB Relay", "kind": "subtechnique", "state": "covered", "blurb": "Az LLMNR/NBT-NS Poisoning and SMB Relay azt a Windows-viselkedést használja ki, hogy ha egy névfeloldás DNS-en nem sikerül, a gép automatikusan visszaesik két elavult, broadcast/multicast-alapú protokollra: LLMNR (UDP 5355) és NBT-NS (UDP 137). Mindkettő ugyanazzal a tervezési hibával él: bármelyik gép a szegmensen válaszolhat a kérésre, hitelesítés nélkül — &quot;igen, én vagyok az a host, amit keresel&quot;. A támadó meghallgatja a broadcast forgalmat, és minden ilyen kérésre saját magát ajánlja fel válaszként; az áldozat ezután hitelesítési kísérletet indít (tipikusan SMB-n) a támadó felé. Innen két út van: a támadó vagy elfogja a hitelesítés NTLMv2 hash-ét (offline törésre), vagy élőben továbbadja (relay) egy harmadik, valódi célgépnek — utóbbinál nincs is szükség törésre, mert az eredmény egy azonnal használható, hitelesített session. A relay path három szerepet foglal magába: A a poisoning proxy (itt fut a <code>Responder<\/code>/<code>Inveigh<\/code>), B az áldozat (az ő NTLMv2 identitásával történik minden), C a relay tényleges célpontja (ide fut a <code>ntlmrelayx.py<\/code>, feltéve hogy ott nincs kikényszerítve az SMB Signing). A parancsok fizikailag A-n futnak, de C-n, B jogosultságával hatnak. A leggyakoribb kiváltó ok egy hétköznapi elgépelt vagy megszűnt hosztnév, ami sikertelen DNS-feloldáshoz vezet.", "note": "Subtechniques/T1557.001 - LLMNR-NBT-NS Poisoning and SMB Relay.md", "rules": ["DETECT-2026-0033"], "platforms": ["Windows"], "url": "https://attack.mitre.org/techniques/T1557/001/", "parent": "T1557"}, "T1558": {"id": "T1558", "name": "Steal or Forge Kerberos Tickets", "kind": "technique", "state": "partial", "blurb": "A Steal or Forge Kerberos Tickets alatt a támadó a Kerberos hitelesítési rendszer jegyeivel (ticketjeivel) él vissza: vagy ellopja őket, vagy — ha megszerezte a megfelelő kulcsanyagot — hamisat kovácsol. A Kerberosban a hozzáférést jegyek igazolják: a Ticket Granting Ticket (TGT) a felhasználó általános identitását, a Service Ticket (TGS) egy konkrét szolgáltatáshoz való jogot. A közös nevező, hogy a támadó a jegyrendszer bizalmi feltevéseit fordítja a maga javára — mivel a jegyeket kriptográfiai kulcs írja alá, aki a kulcsot birtokolja, tetszőleges jegyet gyárthat. Az altechnikák ezt konkretizálják: Golden Ticket (.001, a <code>krbtgt<\/code> hashével hamis TGT), Silver Ticket (.002, egy szolgáltatásfiók hashével hamis TGS), Kerberoasting (.003, gyenge szolgáltatásfiók-jelszó offline törése egy legitim TGS-kérésből), és AS-REP Roasting. A megszerzett kulcsanyag jellemzően egy korábbi Credential Access lépésből (T1003) származik. Detekciósan a nehézség, hogy egyes formák (silver ticket) teljesen megkerülik a DC-t, mások (kerberoasting kérése) teljesen legitimnek látszanak — a jel gyakran a jegy anomáliáiban vagy a kérés-mintázatban van. A repo mindhárom fő altechnikát (Golden, Silver, Kerberoasting) lefedi.", "note": "Techniques/T1558 - Steal or Forge Kerberos Tickets.md", "rules": [], "platforms": ["Linux", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1558/", "tacticNames": ["Credential Access"], "subTotal": 5}, "T1558.001": {"id": "T1558.001", "name": "Golden Ticket", "kind": "subtechnique", "state": "covered", "blurb": "A Golden Ticket során a támadó, aki már megszerezte a domain <code>krbtgt<\/code> fiók jelszó-hash-ét (jellemzően DCSync-kel (T1003.006) vagy egy DC-n végrehajtott LSASS-dumppal), tetszőleges felhasználó nevében, tetszőleges jogosultsággal (akár nem létező, &quot;phantom&quot; Domain Admin csoporttagsággal), tetszőlegesen hosszú érvényességgel tud hamis Kerberos TGT-t kovácsolni. Mivel a <code>krbtgt<\/code> hash az, ami a KDC-t hitelesíti minden TGT aláírásakor, egy ilyen hamis jegy a KDC szempontjából megkülönböztethetetlen egy valódi, legitim módon kiadott jegytől. Ez a legsúlyosabb Kerberos-alapú perzisztencia: a <code>krbtgt<\/code> hash egyszeri megszerzése után a támadó hónapokig fenntarthat teljes domain-hozzáférést anélkül, hogy bármelyik felhasználó jelszavát ismerné vagy módosítaná — a jegy önmagában elég, és csak a <code>krbtgt<\/code> jelszó kétszeri elforgatásával szüntethető meg végleg. A klasszikus lánc két lépés: a <code>krbtgt<\/code> hash megszerzése, majd a jegy kovácsolása és élesítése — Mimikatz <code>kerberos::golden<\/code> + <code>ptt<\/code> (pass-the- ticket), vagy a modern, .NET-natív Rubeus <code>golden<\/code> egy lépésben. Detekciósan ez a legegyértelműbb jel a T1558 alatt: semmilyen legitim üzemeltetés nem generál ilyen mintát, mert a <code>krbtgt<\/code> hash birtoklása kizárólag ehhez köthető.", "note": "Subtechniques/T1558.001 - Golden Ticket.md", "rules": ["DETECT-2026-0022"], "platforms": ["Windows"], "url": "https://attack.mitre.org/techniques/T1558/001/", "parent": "T1558"}, "T1558.002": {"id": "T1558.002", "name": "Silver Ticket", "kind": "subtechnique", "state": "covered", "blurb": "A Silver Ticket a golden ticket kisebb testvére: a támadó nem a domain <code>krbtgt<\/code> fiók hash-ét szerzi meg, hanem egy konkrét szolgáltatás (pl. egy fájlszerver vagy alkalmazás-szerver) saját gépi fiókjának (<code>computer$<\/code>) vagy szolgá
