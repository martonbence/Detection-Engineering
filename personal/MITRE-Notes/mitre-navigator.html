ltatásfiókjának NTLM-hash-ét. Ezzel közvetlenül egy hamis Service Ticketet (TGS) kovácsol — a KDC-t és a TGT-kérés lépését teljesen kihagyva —, ami az adott egyetlen szolgáltatáshoz tetszőleges jogosultsággal ad hozzáférést. A golden tickethez képest a hatóköre szűkebb (egy szolgáltatásra korlátozódik, nem az egész domainre), de éppen ez teszi nehezebben észlelhetővé: mivel a KDC-t teljesen megkerüli, a Domain Controller Kerberos-naplóiban (<code>4768<\/code>/<code>4769<\/code>) nyoma sem marad — a hamis jegyet a támadó közvetlenül a célszolgáltatásnak mutatja be, a DC soha nem látja a kérést. Kovácsolása egy megszerzett szolgáltatásfiók hashével, a célszolgáltatás SPN-jét megcélozva történik. A Mimikatz szintaxisában ugyanaz a <code>kerberos::golden<\/code> parancs gyártja mindkét jegytípust — a <code>/target<\/code> és <code>/service<\/code> paraméterek jelenléte (silver) vagy hiánya (golden) a különbség, ami detekciósan azt jelenti, hogy CLI-minta szintjén a kettő nem különül el. Rubeus-alakja az explicit <code>/service<\/code> paraméter. A szolgáltatásfiók-hash legjellemzőbb forrása egy Kerberoasting- lánc (T1558.003) vagy egy gyenge gépi fiók jelszó — a silver ticket ritkán önálló első lépés.", "note": "Subtechniques/T1558.002 - Silver Ticket.md", "rules": ["DETECT-2026-0022"], "platforms": ["Windows"], "url": "https://attack.mitre.org/techniques/T1558/002/", "parent": "T1558"}, "T1558.003": {"id": "T1558.003", "name": "Kerberoasting", "kind": "subtechnique", "state": "covered", "blurb": "A Kerberoasting azt használja ki, hogy bármely hitelesített domain-felhasználó — akár a legalacsonyabb jogú is — kérhet Kerberos Service Ticketet (TGS) bármelyik SPN-nel (Service Principal Name) rendelkező fiókhoz, anélkül hogy igazolnia kéne, jogosult-e ténylegesen a szolgáltatáshoz. A visszaadott TGS egy részét a KDC a célfiók jelszavából származó kulccsal titkosítja — ez azt jelenti, hogy a kérő a jegyet offline, a hálózattól függetlenül, tetszőleges ideig próbálhatja feltörni, anélkül hogy egyetlen sikertelen próbálkozás is zárolást vagy naplóbejegyzést generálna a célfiókon. Ez teszi az egyik legalattomosabb credential-access technikává: a kérés maga (<code>4769<\/code> a DC-n) teljesen legitim és mindennapos — minden normál szolgáltatás-hozzáférés generál ilyet —, a támadás a kérés utáni offline törésben zajlik, ami a DC szemszögéből láthatatlan. A szolgáltatásfiókok jelszava statisztikailag gyakran gyengébb és régebbi (&quot;sosem jár le&quot;), ami a technikát rendkívül eredményessé teszi. Tipikus lánca: SPN-ek felderítése (<code>setspn.exe<\/code>, PowerView <code>Get-DomainUser -SPN<\/code>), tömeges TGS-kérés (Rubeus <code>kerberoast<\/code>, Impacket <code>GetUserSPNs.py<\/code>), majd offline törés (Hashcat/John). A jel nem az SPN-lekérdezésben van (az állandó háttérzaj), hanem a rövid idő alatt sok különböző SPN-re irányuló TGS-kérés- sorozatban egy forrásból.", "note": "Subtechniques/T1558.003 - Kerberoasting.md", "rules": ["DETECT-2026-0022"], "platforms": ["Windows"], "url": "https://attack.mitre.org/techniques/T1558/003/", "parent": "T1558"}, "TA0007": {"id": "TA0007", "name": "Discovery", "kind": "tactic", "state": "covered", "blurb": "A Discovery alatt a támadó azt próbálja megtudni, hova érkezett: milyen gépen van, milyen jogosultsággal, milyen domainben, ki van bejelentkezve, hol az adat, és mi figyeli őt. A behatolás pillanatában szinte semmit nem tud a belső környezetről, és ezt a hiányt pótolja. A taktika különlegessége, hogy szinte kizárólag legitim, beépített eszközökkel zajlik — <code>whoami<\/code>, <code>net user<\/code>, <code>nltest<\/code>, <code>systeminfo<\/code>, <code>tasklist<\/code>, <code>ipconfig<\/code> —, semmi nem exploit, a rendszer csak válaszol egy jogosult kérdésre. Ebből két dolog következik. Egyrészt a fidelitás alacsony: egyetlen <code>whoami<\/code> teljesen normális, így az egyedi detekció ritkán actionable. Másrészt a minta jellegzetes: a támadó (vagy a felderítő szkriptje) rövid idő alatt sok, egymáshoz kapcsolódó parancsot futtat — és ez a sűrűség olyan jel, ami legitim adminnál ritka. A Discovery detekciója ezért nem szűrés, hanem aggregáció.", "note": "Tactics/TA0007 - Discovery.md", "rules": [], "platforms": [], "url": "https://attack.mitre.org/tactics/TA0007/", "coverage": "2/34"}, "T1087": {"id": "T1087", "name": "Account Discovery", "kind": "technique", "state": "partial", "blurb": "Az Account Discovery alatt a támadó a környezetben létező fiókokat sorolja fel — helyi felhasználókat, domain-fiókokat, csoportokat, e-mail címeket —, hogy megtudja, kik léteznek, ki privilegizált, és melyik fiókot érdemes célba venni a következő lépéshez (privilege escalation, laterális mozgás, célzott hitelesítőadat-lopás). A közös nevező, hogy a támadó a directory és a rendszer saját, jogosultként elérhető lekérdezéseit használja: nem tör be sehova, csak kérdez. Az altechnikák a fiókok forrását nevezik meg: helyi fiók (.001), domain fiók (.002), e-mail cím (.003), cloud fiók (.004). A repo lefedett esete a Domain Account felderítés. A támadó tipikusan natív eszközökkel dolgozik (<code>net user /domain<\/code>, <code>net group<\/code>, <code>dsquery<\/code>, <code>Get-ADUser<\/code>, PowerView), amelyek mind legitim adminisztratív parancsok. Detekciósan a fidelitás alacsony: egyetlen fiók-lekérdezés teljesen normális. A jel — mint az egész Discovery taktikánál — inkább a sűrűségben és a láncban van: sok, egymást követő felderítő parancs rövid idő alatt, gyakran közvetlenül a belépés után. A nehézség a legitim admin- és directory-szinkronizáló tevékenységtől való elkülönítés.", "note": "Techniques/T1087 - Account Discovery.md", "rules": [], "platforms": ["ESXi", "IaaS", "Identity Provider", "Linux", "Office Suite", "SaaS", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1087/", "tacticNames": ["Discovery"], "subTotal": 4}, "T1087.002": {"id": "T1087.002", "name": "Domain Account", "kind": "subtechnique", "state": "covered", "blurb": "A Domain Account felderítés során a támadó a domain-szintű fiókokat sorolja fel az Active Directory-ból: felhasználókat, privilegizált csoportok tagságát, szolgáltatásfiókokat. Ez a domain-környezet feltérképezésének egyik első lépése — a támadó itt tudja meg, kik a Domain Adminok, mely fiókok érdekesek egy Kerberoasting-hoz (SPN-nel rendelkezők), és hova érdemes laterálisan mozogni. A cél nem hozzáférés, hanem célpont-kijelölés a lánc további lépéseihez. A tevékenység szinte kizárólag beépített, legitim eszközökkel zajlik: <code>net user /domain<\/code>, <code>net group &quot;Domain Admins&quot; /domain<\/code>, <code>dsquery<\/code>, a PowerShell <code>Get-ADUser<\/code>/<code>Get-ADGroupMember<\/code>, vagy a red team klasszikusa, a PowerView (<code>Get-DomainUser<\/code>, <code>Get-NetGroupMember<\/code>). Ezek mind LDAP-lekérdezésre fordulnak le a DC felé, és a napi adminisztrációban is folyamatosan futnak. Detekciósan ezért a fidelitás alacsony: egyetlen lekérdezés normális. A jel a mintázatban van — szokatlanul széles enumeráció (az összes felhasználó vagy az összes privilegizált csoport egyszerre), gyakran egy nem-adminisztratív gépről vagy fiókból, és tipikusan más felderítő parancsok sorozatába ágyazva. A nehézség a legitim directory-eszközöktől és a monitoring-rendszerektől való elkülönítés.", "note": "Subtechniques/T1087.002 - Domain Account.md", "rules": ["DETECT-2026-0004"], "platforms": ["Linux", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1087/002/", "parent": "T1087"}, "TA0009": {"id": "TA0009", "name": "Collection", "kind": "tactic", "state": "covered", "blurb": "A Collection alatt a támadó összegyűjti azt az adatot, amiért a művelet egyáltalán folyik vagy amit egy későbbi lépéshez fel akar használni — még mielőtt kijuttatná (az az Exfiltration). Az adat forrása sokféle: helyi fájlrendszer, hálózati megosztás, e-mail, adatbázis, képernyő, billentyűzet, vagy a hálózaton áthaladó forgalom. A közös nevező, hogy a támadó itt még nem visz ki semmit, csak lokálisan felhalmoz, tipikusan egy staging-helyre, gyakran tömörítve vagy titkosítva. Detekciósan a nehézség az, hogy az adathozzáférés önmagában rendszerint legitim — a felhasználók és a szolgáltatások is olvasnak fájlokat és megosztásokat. A jel inkább a mintában van: szokatlanul széles vagy tömeges hozzáférés, automatizált begyűjtés, staging-artefaktumok. A repóban a Collection a hálózati man-in-the-middle forgalom-begyűjtő oldalán (T1557) kapcsolódik be, ahol a lehallgatott forgalom egyszerre credential access és collection nyereség.", "note": "", "rules": [], "platforms": [], "url": "https://attack.mitre.org/tactics/TA0009/", "coverage": "2/17"}, "TA0011": {"id": "TA0011", "name": "Command & Control", "kind": "tactic", "state": "covered", "blurb": "A Command and Control (C2) alatt a támadó kommunikációs csatornát tart fenn a kompromittált géppel, hogy parancsokat adhasson és adatot mozgathasson. A legfontosabb tervezési cél az álca: a C2-forgalom igyekszik beleolvadni a normál hálózati zajba, tipikusan a gyakori, kifelé amúgy is engedélyezett protokollokba (HTTP/HTTPS, DNS), hogy egy tűzfal- vagy proxy-szabály ne fogja meg. Ide tartozik a csatorna kiépítése és fenntartása, a beacon-szerű periodikus visszahívás, a további eszközök letöltése a fertőzött gépre, és a forgalom kódolása/obfuszkálása. Egy tipikus lánc egy alkalmazásréteg- protokollon (T1071) fut, néha nem-alkalmazásrétegű protokollra (T1095) vált, és a tényleges eszközöket ingress tool transferrel (T1105) hozza be. Detekciósan a jel ritkán a protokollban van — az legitim —, inkább a viselkedésben: periodicitás, szokatlan cél, aránytalan fel/le forgalom, gyanús user-agent vagy JA3-ujjlenyomat. A C2 az a taktika, ahol a művelet élő kapcsolata a leginkább megfogható.", "note": "", "rules": [], "platforms": [], "url": "https://attack.mitre.org/tactics/TA0011/", "coverage": "3/18"}, "T1071": {"id": "T1071", "name": "Application Layer Protocol", "kind": "technique", "state": "partial", "blurb": "Az Application Layer Protocol alatt a támadó a C2-kommunikációját egy gyakori, legitim alkalmazásréteg-protokollba (HTTP/HTTPS, DNS, e-mail, WebSocket) ágyazza, hogy beleolvadjon a normál hálózati forgalomba és elkerülje a protokoll-alapú tűzfal- vagy proxy-szabályokat. A közös nevező, hogy a csatorna nem egy egzotikus, gyanús porton fut, hanem pont azon, amit a szervezet amúgy is enged kifelé — így a beacon-visszahívás és a parancs/válasz forgalom első ránézésre rendes webes vagy DNS-forgalomnak tűnik. Az altechnikák a hordozó protokollt nevezik meg: Web Protocols (.001, HTTP/S), DNS (.004), Mail Protocols (.003), File Transfer Protocols (.002). A repo lefedett esete a Web Protocols. A támadó a payloadot és a parancsokat gyakran a protokoll legitim mezőibe rejti (HTTP header, URI-path, cookie, DNS-lekérdezés aldomainje). Detekciósan a jel ritkán a protokollban van — az szabályos —, inkább a viselkedésben: periodikus beaconing, szokatlan user-agent vagy JA3-ujjlenyomat, aránytalan fel/le forgalom, ismeretlen vagy fiatal domain, szokatlanul hosszú DNS-lekérdezések. A nehézség, hogy a legitim webes forgalom hatalmas és zajos, amiben elrejtőzni könnyű.", "note": "Techniques/T1071 - Application Layer Protocol.md", "rules": [], "platforms": ["ESXi", "Linux", "Network Devices", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1071/", "tacticNames": ["Command & Control"], "subTotal": 5}, "T1071.001": {"id": "T1071.001", "name": "Web Protocols", "kind": "subtechnique", "state": "covered", "blurb": "A Web Protocols altechnikában a támadó a C2-forgalmát HTTP vagy HTTPS protokollba ágyazza — messze a leggyakoribb csatorna, mert a webforgalom szinte minden környezetben engedélyezett kifelé, és a titkosított HTTPS-ben a tartalom is rejtve marad. A támadó a parancsokat és a válaszokat a protokoll legitim szerkezetébe illeszti: kérés az URI-path-ban vagy query stringben, a válasz a HTTP-body-ban, a metaadat a headerekben és cookie-kban. A beacon- alapú keretrendszerek (Cobalt Strike, Empire, Sliver) periodikusan hívnak vissza egy vezérlőszerverre új parancsért, gyakran testre szabott, legitimnek tűnő user-agenttel és URL-mintával (malleable C2 profilok, amelyek szándékosan utánoznak ismert szolgáltatásokat). Az álca kettős: a port (443/80) megszokott, és a forgalom formája is a normál webezésre hasonlít. Detekciósan a jel nem a HTTP-ben van, hanem a viselkedési anomáliákban: szabályos időközű visszahívás (jitterrel), szokatlan vagy hardcode-olt user-agent, ismeretlen/ fiatal vagy reputáció nélküli cél-domain, aránytalanul kicsi kérés és nagyobb válasz, gyanús JA3/JA3S TLS-ujjlenyomat. A nehézség a hatalmas legitim webes háttérzaj, amiben egy jól megírt beacon nehezen tűnik ki.", "note": "Subtechniques/T1071.001 - Web Protocols.md", "rules": ["DETECT-2026-0001"], "platforms": ["ESXi", "Linux", "Network Devices", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1071/001/", "parent": "T1071"}, "T1095": {"id": "T1095", "name": "Non-Application Layer Protocol", "kind": "technique", "state": "covered", "blurb": "A Non-Application Layer Protocol alatt a támadó a C2-kommunikációhoz nem egy alkalmazásréteg-protokollt (mint a HTTP), hanem egy alacsonyabb, hálózati vagy szállítási rétegű protokollt használ — pl. ICMP-t, nyers TCP/UDP-t, vagy egyéb, nem szabványos szolgáltatáshoz kötött csatornát. A logika az, hogy sok hálózati monitoring és tűzfal az alkalmazásréteg ismert protokolljaira van hangolva, az alacsonyabb rétegű vagy nem szokványos forgalom pedig könnyebben átcsúszik — egy ICMP-alagút (adat a ping payloadjában) klasszikus példa, mert az ICMP-t sok helyen egyáltalán nem vizsgálják tartalmilag. A támadó így megkerülheti a proxy-alapú tartalomszűrést, és olyan környezetben is kaphat csatornát, ahol a HTTP-kimenet szigorúan kontrollált. A csatorna jellemzően szűk sávszélességű, ezért inkább vezérlésre és kis adatra, mint tömeges exfiltrációra használatos. Detekciósan a jel a protokoll szokatlan használatában van: aránytalanul nagy vagy sűrű ICMP-forgalom, nyers TCP/UDP ismeretlen porton egy külső cél felé, olyan protokoll, amit a hoston normál esetben nem várnánk. A nehézség, hogy a nyers protokoll-forgalom kevés kontextust hordoz, és a legitim hálózati diagnosztika (ping, traceroute) is hasonlót generál.", "note": "", "rules": ["DETECT-2026-0001"], "platforms": ["ESXi", "Linux", "Network Devices", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1095/", "tacticNames": ["Command & Control"], "subTotal": 0}, "T1105": {"id": "T1105", "name": "Ingress Tool Transfer", "kind": "technique", "state": "covered", "blurb": "Az Ingress Tool Transfer során a támadó külső eszközöket, payloadokat vagy további malware-t tölt le a saját infrastruktúrájáról a már kompromittált gépre — jellemzően azért, mert a kezdeti hozzáférés minimális, és a következő lépésekhez több eszköz kell (post-exploitation keretrendszer, privilege escalation exploit, lateral movement tool). A közös nevező, hogy adat a támadó felől befelé, a védett környezetbe mozog egy meglévő csatornán. A gyakorlatban ezt a rendszer beépített, megbízott letöltő-eszközeivel csinálják, hogy ne kelljen idegen binárist behozni: Windowson <code>certutil -urlcache<\/code>, <code>bitsadmin<\/code>, PowerShell <code>Invoke-WebRequest<\/code>/<code>Net.WebClient.DownloadFile<\/code>, Linuxon <code>curl<\/code>/<code>wget<\/code>, vagy akár a <code>/dev/tcp<\/code> shell-mechanizmus. A letöltés célja lehet a lemezre írás, de a modern minta gyakran a memóriába tölt (fileless), hogy ne maradjon fájl-artefaktum. Detekciósan a jel kettős: a hálózati oldalon egy letöltés egy ismeretlen/külső célról, a végponti oldalon egy megbízott letöltő- eszköz (LOLBin) szokatlan parancssora (<code>certutil<\/code> egy URL-lel, <code>bitsadmin<\/code> átvitel) vagy egy interpreter, ami hálózatról hoz be tartalmat. A nehézség, hogy ugyanezek az eszközök a legitim szoftverfrissítésben és adminisztrációban is folyamatosan használatosak.", "note": "", "rules": ["DETECT-2026-0008"], "platforms": ["ESXi", "Linux", "Network Devices", "Windows", "macOS"], "url": "https://attack.mitre.org/techniques/T1105/", "tacticNames": ["Command & Control"], "subTotal": 0}}, "layout": [{"id": "TA0043", "techniques": [{"id": "T1595", "subs": ["T1595.002", "T1595.003"]}]}, {"id": "TA0001", "techniques": [{"id": "T1189", "subs": []}, {"id": "T1190", "subs": []}, {"id": "T1566", "subs": ["T1566.001"]}]}, {"id": "TA0002", "techniques": [{"id": "T1059", "subs": ["T1059.001", "T1059.004"]}, {"id": "T1197", "subs": []}]}, {"id": "TA0003", "techniques": [{"id": "T1197", "subs": []}, {"id": "T1505", "subs": ["T1505.003"]}]}, {"id": "TA0005", "techniques": [{"id": "T1027", "subs": ["T1027.010"]}, {"id": "T1197", "subs": []}, {"id": "T1218", "subs": ["T1218.011"]}, {"id": "T1564", "subs": ["T1564.003"]}, {"id": "T1620", "subs": []}]}, {"id": "TA0112", "techniques": [{"id": "T1685", "subs": ["T1685.001"]}]}, {"id": "TA0006", "techniques": [{"id": "T1003", "subs": ["T1003.001", "T1003.002", "T1003.003", "T1003.004", "T1003.005", "T1003.006"]}, {"id": "T1040", "subs": []}, {"id": "T1056", "subs": ["T1056.001"]}, {"id": "T1110", "subs": ["T1110.001", "T1110.003"]}, {"id": "T1557", "subs": ["T1557.001"]}, {"id": "T1558", "subs": ["T1558.001", "T1558.002", "T1558.003"]}]}, {"id": "TA0007", "techniques": [{"id": "T1040", "subs": []}, {"id": "T1087", "subs": ["T1087.002"]}]}, {"id": "TA0009", "techniques": [{"id": "T1056", "subs": ["T1056.001"]}, {"id": "T1557", "subs": ["T1557.001"]}]}, {"id": "TA0011", "techniques": [{"id": "T1071", "subs": ["T1071.001"]}, {"id": "T1095", "subs": []}, {"id": "T1105", "subs": []}]}]}</script>
  <script>
(function () {
  'use strict';
  var DATA = JSON.parse(document.getElementById('glossary-data').textContent);
  var ITEMS = DATA.items;
  var matrix = document.getElementById('matrix');
  var detail = document.getElementById('detail');
  var q = document.getElementById('q');
  var KIND = { tactic: 'Taktika', technique: 'Technika', subtechnique: 'Altechnika' };
  var cells = {};

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function mkCell(id, cls) {
    var it = ITEMS[id];
    var b = document.createElement('button');
    b.type = 'button';
    b.className = cls + (it.blurb ? '' : ' nob');
    b.dataset.id = id;
    if (cls === 'tc-hdr') {
      b.innerHTML = '<span>' + esc(it.name) + '</span><span class="tc-count">' +
        esc(id) + ' · ' + esc(it.coverage) + ' covered</span>';
    } else {
      var nSubs = Object.keys(ITEMS).filter(function (k) { return ITEMS[k].parent === id; }).length;
      var meta = it.kind === 'technique' && it.subTotal
        ? '<span class="tm">' + nSubs + '/' + it.subTotal + ' altechnika</span>' : '';
      b.innerHTML = '<span class="ti">' + esc(id) + '</span><span class="tn">' + esc(it.name) + '</span>' + meta;
    }
    b.addEventListener('click', function () { select(id); });
    (cells[id] = cells[id] || []).push(b);
    return b;
  }

  DATA.layout.forEach(function (col) {
    var c = document.createElement('div');
    c.className = 'tc-col';
    c.appendChild(mkCell(col.id, 'tc-hdr'));
    col.techniques.forEach(function (t) {
      c.appendChild(mkCell(t.id, 'tc ' + ITEMS[t.id].state));
      t.subs.forEach(function (s) { c.appendChild(mkCell(s, 'tc sub')); });
    });
    matrix.appendChild(c);
  });

  function relBtn(id) {
    var it = ITEMS[id];
    return it ? '<button type="button" data-go="' + esc(id) + '">' + esc(id) + ' ' + esc(it.name) + '</button>' : '';
  }

  function render(id) {
    var it = ITEMS[id];
    var pills = '<span class="pill">' + KIND[it.kind] + '</span>';
    if (it.kind !== 'tactic') {
      pills += it.state === 'covered'
        ? '<span class="pill cov">Lefedett</span>'
        : '<span class="pill part">Részleges</span>';
    } else {
      pills += '<span class="pill cov">' + esc(it.coverage) + ' technika lefedve</span>';
    }
    (it.platforms || []).forEach(function (p) { pills += '<span class="pill">' + esc(p) + '</span>'; });

    var body = it.blurb
      ? '<p class="d-blurb">' + it.blurb + '</p>'
      : '<p class="d-missing">Ehhez az elemhez még nincs glosszárium-szöveg (blurbs.yaml). ' +
        'Pótold, majd futtasd újra a generátort.</p>';

    var rel = [];
    if (it.parent) rel.push(relBtn(it.parent));
    Object.keys(ITEMS).forEach(function (k) {
      if (ITEMS[k].parent === id) rel.push(relBtn(k));
    });

    var meta = [];
    if (it.rules && it.rules.length) meta.push('<b>Szabályok:</b> ' + it.rules.map(esc).join(', '));
    if (it.tacticNames && it.tacticNames.length > 1) meta.push('<b>Taktikák:</b> ' + it.tacticNames.map(esc).join(', '));

    var links = '<a href="' + esc(it.url) + '" target="_blank" rel="noopener">attack.mitre.org ↗</a>';
    if (it.note) links += '<a href="' + esc(encodeURI(it.note)) + '">Vault-jegyzet: ' + esc(it.note.split('/').pop()) + '</a>';

    detail.innerHTML =
      '<div class="d-id">' + esc(id) + '</div>' +
      '<div class="d-name">' + esc(it.name) + '</div>' +
      '<div class="d-pills">' + pills + '</div>' +
      '<div class="d-section-title">Mi ez</div>' + body +
      (rel.length ? '<div class="d-section-title">Kapcsolódó</div><div class="d-rel">' + rel.join('') + '</div>' : '') +
      (meta.length ? '<div class="d-meta">' + meta.join('<br>') + '</div>' : '') +
      '<div class="d-links">' + links + '</div>';
    detail.querySelectorAll('[data-go]').forEach(function (b) {
      b.addEventListener('click', function () { select(b.dataset.go, true); });
    });
  }

  var current = null;
  function select(id, scroll) {
    if (current) (cells[current] || []).forEach(function (c) { c.classList.remove('sel'); });
    current = id;
    (cells[id] || []).forEach(function (c) { c.classList.add('sel'); });
    if (scroll && cells[id]) cells[id][0].scrollIntoView({ block: 'nearest', inline: 'nearest' });
    render(id);
    if (history.replaceState) history.replaceState(null, '', '#' + id);
  }

  q.addEventListener('input', function () {
    var term = q.value.trim().toLowerCase();
    Object.keys(cells).forEach(function (id) {
      var it = ITEMS[id];
      var hay = (id + ' ' + it.name + ' ' + it.blurb.replace(/<[^>]+>/g, '')).toLowerCase();
      var hit = !term || hay.indexOf(term) !== -1;
      cells[id].forEach(function (c) { c.classList.toggle('dim', !hit); });
    });
  });

  var start = decodeURIComponent(location.hash.slice(1));
  select(ITEMS[start] ? start : DATA.layout[0].id, true);
})();

  </script>
</body>
</html>
