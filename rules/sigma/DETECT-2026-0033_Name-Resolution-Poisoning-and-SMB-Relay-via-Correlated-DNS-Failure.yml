title: Name Resolution Poisoning and SMB Relay via Correlated DNS Failure
detect_id: DETECT-2026-0033
status: experimental
description: >
  Detects the victim-side telemetry pattern left behind by LLMNR/NBT-NS poisoning
  (Responder, Inveigh) and its SMB relay follow-up (Impacket ntlmrelayx): a DNS query that
  fails to resolve (Sysmon EID 22, QueryStatus != 0), immediately followed on the same host
  by an outbound SMB connection attempt (Sysmon EID 3, port 445) — the OS falling back to a
  broadcast-poisoned name resolution and then authenticating to whatever answered it. Neither
  event alone is meaningful (DNS failures and SMB connections are both common); the two
  occurring back-to-back within a few seconds on the same host is not. This does not detect
  the poisoning itself (that happens on the wire, outside what a Windows host's own Sysmon
  can see) or the attacker's tooling (see DETECT-2026-0034 for Responder/Inveigh process
  execution) — it detects a host that just fell for it.
references:
  - https://attack.mitre.org/techniques/T1557/001/
author: Bence Marton
date: 2026-09-08
modified: 2026-09-08
version: "1.0"
tags:
  - attack.credential_access
  - attack.collection    # T1557.001 belongs to both tactics in this repo's own ATT&CK cache
  - attack.t1557.001

logsource:
  product_category: os
  product: windows
  service: sysmon
  event_type: network_connection   # the triggering half of the pair; see custom.splunk.raw_query
                                     # for the actual two-event-type correlation this rule runs

detection:
  # Placeholder only — this is a correlation across two Sysmon event types (EID 22 + EID 3),
  # which Sigma's detection: block cannot express and this repo's pipeline cannot convert
  # (see docs/credential-access-buildout.md §6 — multi-document Sigma correlation rules are
  # unreadable by scripts/lib/rules.py's yaml.safe_load). custom.splunk.raw_query below is
  # what actually runs; this block exists only because the schema requires it.
  selection:
    EventID: 3
  condition: selection

fields:
  - _time
  - ComputerName
  - User
  - QueryName
  - DestinationIp
  - DestinationPort
  - Image

falsepositives:
  - Legitimate legacy NetBIOS-name (non-FQDN) SMB access — a user or script opening
    \\SERVER01\share where SERVER01 has no DNS record produces the exact same DNS-failure-then-
    SMB-connect sequence, entirely benignly. This is the dominant false positive and is handled
    by the known_smb_servers.csv lookup the raw_query calls — populate it with every legitimate
    file/print server IP in the environment before enabling; a hit against a listed IP is
    suppressed. Un-tuned, this rule will be noisy in any environment with real legacy NetBIOS
    share usage.
  - Backup, inventory, or patch-management tools that legitimately resolve and connect to many
    hosts by short name in quick succession.
  - Coincidental timing — an unrelated DNS failure and an unrelated SMB connection from the same
    host landing within the correlation window by chance. Narrow custom.splunk.raw_query's
    maxspan (currently 10s) if this shows up in practice.
  - A DNS-failure/SMB-connect pair that straddles two consecutive 5-minute search windows will
    not correlate and will be missed — a known gap of the scheduled-search approach, not a
    logic error.

level: high

custom:
  splunk:
    index: sysmon
    mode: alert
    cron: "*/5 * * * *"
    earliest: "-5m"
    latest: "now"
    severity: high
    raw_query: >-
      index=sysmon (EventCode=22 QueryStatus!=0) OR (EventCode=3 DestinationPort=445 Initiated="true")
      | transaction ComputerName startswith=(EventCode=22) endswith=(EventCode=3) maxspan=10s
      | where eventcount=2
      | eval QueryName=mvindex(QueryName,0), DestinationIp=mvindex(DestinationIp,0), DestinationPort=mvindex(DestinationPort,0), Image=mvindex(Image,0), User=mvindex(User,0)
      | lookup known_smb_servers.csv ip AS DestinationIp OUTPUT is_known_server
      | where isnull(is_known_server)
      | table _time, ComputerName, User, QueryName, DestinationIp, DestinationPort, Image

  # Manual two-host verification (not expressible as custom.testing — this
  # schema's `runner:` is a single value, and run_atomic.ps1 executes one
  # rule's test against one runner; there is no orchestration for a second,
  # independently-acting host in the same run). The lab has both a DC and a
  # victim host on the same segment, so this rule's full attack chain CAN be
  # exercised for real, by hand, using the actual Atomic Red Team test —
  # just not automatically in CI:
  #
  #   1. On one host (the "attacker"): run Atomic Red Team T1557.001 test 1
  #      ("LLMNR Poisoning with Inveigh") — this is a real ART test, verified
  #      via its atomics YAML to enable LLMNR/NBNS/HTTPS listening.
  #   2. On the OTHER host (the "victim"): attempt to reach a name with no
  #      DNS record on the same NetBIOS-suffix domain, e.g.
  #      `Test-Path \\NOTAREALSHARE01\test` or `net view \NOTAREALSHARE01` —
  #      this forces the real DNS-failure -> LLMNR/NBT-NS fallback -> SMB
  #      sequence the raw_query above correlates.
  #   3. Confirm on the victim host's own Sysmon (EID 22 QueryName=
  #      NOTAREALSHARE01, then EID 3 to the attacker host's IP:445) that both
  #      events land within the 10s maxspan, and that the attacker host's IP
  #      is NOT in known_smb_servers.csv so the lookup exclusion doesn't hide it.
  #   4. Stop Inveigh on the attacker host promptly after — it answers every
  #      broadcast query on the segment while running, not just the test's.
  #
  # This is the real thing the emulation test below only approximates on one
  # host; run it once by hand after the lookup exists, rather than relying on
  # the emulation test alone for full confidence in the correlation logic.
  testing:
    enabled: false
    runner: windows-victim
    type: emulation
    custom:
      - name: "Simulate the DNS-failure -> SMB-connect telemetry pattern"
        description: >
          Does not run Responder/Inveigh — reproduces only the resulting telemetry sequence
          the raw_query correlates: a DNS query that fails to resolve, immediately followed by
          an outbound SMB (445) connection attempt. This validates the correlation logic itself
          without needing a second, attacker-controlled host on the same broadcast segment.
          Atomic Red Team's real T1557.001 test (test 1, Inveigh) stands up the poisoning tool
          but never generates a victim's fallback query, so it would not reliably fire this
          rule — it is the right fit for DETECT-2026-0034 (process-execution based), not this
          one, whose detection keys on the victim's downstream behavior.
        executor: powershell
        command: >-
          $badName = "smbshare-$(Get-Random)-doesnotexist.corp.local";
          Resolve-DnsName -Name $badName -ErrorAction SilentlyContinue | Out-Null;
          Start-Sleep -Milliseconds 300;
          try { (New-Object Net.Sockets.TcpClient).Connect("203.0.113.1", 445) } catch {}
        cleanup: ""
        prerequisites:
          - Sysmon config must log EventID 22 (DnsQuery) and EventID 3 (NetworkConnect) without
            excluding port 445 or the 203.0.113.1 test destination
          - known_smb_servers.csv does not need to exist for this test — 203.0.113.1 is an
            RFC 5737 documentation-range address that will never appear in it
