title: Name Resolution Poisoning and SMB Relay via Correlated DNS Failure
detect_id: DETECT-2026-0033
status: experimental
description: >
  Detects the victim-side telemetry pattern left behind by LLMNR/NBT-NS poisoning
  (Responder, Inveigh) and its SMB relay follow-up (Impacket ntlmrelayx): a DNS query that
  fails to resolve (Sysmon EID 22, QueryStatus != 0), immediately followed on the same host
  by an outbound SMB connection attempt (Sysmon EID 3, port 445) — the OS falling back to a
  broadcast-poisoned name resolution and then authenticating to whatever answered it. Neither
  event alone is meaningful (DNS failures and SMB connections are both common); the two
  occurring back-to-back within a few seconds on the same host is not. This does not detect
  the poisoning itself (that happens on the wire, outside what a Windows host's own Sysmon
  can see) or the attacker's tooling (see DETECT-2026-0034 for Responder/Inveigh process
  execution) — it detects a host that just fell for it. NOTE, while status is experimental:
  the premise that a poisoned resolution leaves a *failed* EID 22 behind is an unverified
  assumption, not a confirmed fact — see the OPEN QUESTION comment above
  custom.splunk.raw_query and the manual two-host procedure above custom.testing.
references:
  - https://attack.mitre.org/techniques/T1557/001/
  - https://blog.didierstevens.com/2021/07/16/sysmons-dns-querystatus-field/
author: Bence Marton
date: 2026-09-08
modified: 2026-09-09
version: "2.0"
tags:
  - attack.credential_access
  - attack.collection    # T1557.001 belongs to both tactics in this repo's own ATT&CK cache
  - attack.t1557.001

logsource:
  product_category: os
  product: windows
  service: sysmon
  event_type: network_connection   # the triggering half of the pair; see custom.splunk.raw_query
                                   # for the actual two-event-type correlation this rule runs

detection:
  # Placeholder only — this is a correlation across two Sysmon event types (EID 22 + EID 3),
  # which Sigma's detection: block cannot express and this repo's pipeline cannot convert
  # (see docs/credential-access-buildout.md §6 — multi-document Sigma correlation rules are
  # unreadable by scripts/lib/rules.py's yaml.safe_load). custom.splunk.raw_query below is
  # what actually runs; this block exists only because the schema requires it.
  #
  # It is deliberately built to FAIL CLOSED. `selection` and `never_matches` are ANDed and are
  # mutually exclusive by construction — a network-connection event cannot have DestinationPort
  # 445 and -1 at the same time — so if the raw_query short-circuit in sigma_to_spl.py ever
  # breaks and this block actually gets converted, the emitted SPL returns zero rows instead of
  # alerting at level: high on every outbound network connection in the environment, every run.
  # (Previously this was a bare `EventID: 3`, which converted to exactly that.) The EventID vs
  # EventCode inconsistency this block used to have with the raw_query is gone: neither field
  # name appears anywhere in this rule any more — both halves now key on field presence, the
  # same convention every other Sysmon rule in rules/sigma/ uses.
  selection:
    DestinationPort: 445
  never_matches:
    DestinationPort: -1
  condition: selection and never_matches

fields:
  - _time
  - ComputerName
  - lag_seconds
  - failed_name
  - failed_status
  - dns_image
  - dns_user
  - smb_image
  - smb_user
  - DestinationIp
  - DestinationPort

falsepositives:
  - Legitimate legacy NetBIOS-name (non-FQDN) SMB access — a user or script opening
    \\SERVER01\share where SERVER01 has no DNS record produces the exact same DNS-failure-then-
    SMB-connect sequence, entirely benignly. This is the dominant false positive and is handled
    by the inline destination allowlist in custom.splunk.raw_query (see the comment above it for
    what to put there). Un-tuned, this rule will be noisy in any environment with real legacy
    NetBIOS share usage, and on a domain-joined host the DC's own SMB traffic alone will drive
    most of the volume.
  - Backup, inventory, or patch-management tools that legitimately resolve and connect to many
    hosts by short name in quick succession.
  - Coincidental timing — an unrelated DNS failure and an unrelated SMB connection from the same
    host landing within the correlation window by chance. The lag_seconds column in the output is
    there to triage this; if it shows up often, narrow both the streamstats time_window and the
    matching numeric guard in custom.splunk.raw_query (currently 10s / 10) together — they must
    always be changed as a pair.
  - A DNS-failure/SMB-connect pair that straddles the boundary between two consecutive scheduled
    search windows will not correlate and will be missed. The windows are contiguous and
    non-overlapping by design (5 minutes wide, 5-minute cron), so this costs roughly the
    correlation window over the search window — about 10s in every 300s of coverage. A known,
    accepted gap of the scheduled-search approach, not a logic error.

level: high

custom:
  splunk:
    index: sysmon
    mode: alert
    cron: "*/5 * * * *"
    # Ingestion-lag allowance. The window is a full 5 minutes wide (matching the 5-minute cron,
    # so consecutive runs are contiguous with no gap and no overlap) but shifted 2 minutes into
    # the past. An event is therefore searched between 2 and 7 minutes after it happened, which
    # is the tolerance for indexing latency: the previous "-5m to now" assumed zero latency and
    # permanently lost any event indexed even a second late, with no catch-up and no signal that
    # it had happened. Shifting rather than widening is deliberate — a widened window would
    # re-search the overlap and re-alert on events already alerted on in the previous run.
    # CI verification is unaffected: check_saved_search_hits.py dispatches the saved search with
    # its own --earliest/--latest (default -5m/now) and overrides these values.
    earliest: "-7m"
    latest: "-2m"
    severity: high
    # ------------------------------------------------------------------------------------
    # OPEN QUESTION — UNVERIFIED PREMISE. NOT SETTLED BEFORE status: test.
    # The base search assumes a poisoned LLMNR/NBT-NS resolution leaves a *failed* EID 22
    # behind (QueryStatus != 0). The alternative — which no public source consulted while
    # writing this rule settles either way — is that the DNS Client service performs the
    # multicast fallback internally, inside the same DnsQuery_* call Sysmon hooks, and returns
    # the poisoner's answer to the caller as a SUCCESS: QueryStatus=0 with QueryResults set to
    # the attacker's IP. If that is what actually happens, this rule's DNS half never matches
    # on the real attack and the rule is a permanent false negative — it would then have to be
    # rebuilt around "QueryStatus=0 whose QueryResults is an IP that then receives an SMB
    # connection", which is a different query, not a tweak of this one.
    # HOW TO SETTLE IT: the manual two-host procedure documented above custom.testing below.
    # Run step 2 on the victim while the poisoner is live, then read that host's own Sysmon
    # EID 22 for the queried name and record QueryStatus and QueryResults.
    #
    # SECOND UNVERIFIED ITEM — FIELD NAMES. No other rule in rules/sigma/ or rules/splunk/
    # filters on EventCode or EventID; they all disambiguate Sysmon event types by field
    # presence (GrantedAccess/TargetImage/TargetFilename/CommandLine), so this rule follows
    # that convention instead of reintroducing EventCode. It does mean four field names have to
    # actually exist in this pipeline's Sysmon extraction for the query to return anything at
    # all — QueryName, QueryStatus, DestinationPort, Initiated — and a missing extraction is a
    # silent zero-result, not an error. Confirm in the lab before status: test with:
    #   index=sysmon QueryStatus=* | head 5 | table _time ComputerName QueryName QueryStatus QueryResults Image User
    #   index=sysmon DestinationPort=445 | head 5 | table _time ComputerName Initiated DestinationIp DestinationPort Image User
    #
    # INLINE DESTINATION ALLOWLIST — POPULATE BEFORE ENABLING.
    # The two RFC 5737 documentation addresses on the base-search line below are placeholders,
    # not real suppressions: replace them with every legitimate file/print server and DC IP in
    # the environment, or this rule will fire on ordinary legacy NetBIOS share access and on a
    # domain-joined host's constant SMB traffic to the DC. This replaces the earlier
    # known_smb_servers.csv lookup, which errored at search time — the lookup table exists
    # nowhere in this repo and the pipeline has no lookup-deployment step to create it. The list
    # is scoped inside the SMB branch of the base search on purpose (not applied as a later
    # `| search NOT ...` stage): it prunes the dominant noise source before the correlation runs,
    # and scoping it to that branch means it can never accidentally drop DNS-failure events,
    # which carry no DestinationIp field at all. Do NOT add 203.0.113.1 — that is the emulation
    # test's destination.
    #
    # Restructured off `transaction` (which is not distributable, silently truncates at
    # maxopentxn/maxopenevents with no error, and offers no control over which of the two events
    # a shared field like Image or User came from) onto streamstats. Consequences to know:
    #   * `sort 0 +_time, +evtype` is a centralizing command — the base search must stay narrow.
    #     The ascending sort is what streamstats' time_window requires (Splunk docs: the events
    #     must be sorted in ascending or descending time order); descending would make the
    #     window look forward instead of back, which is the wrong direction here. The secondary
    #     +evtype key only breaks ties at identical _time, where "dnsfail" sorts before "smb"
    #     alphabetically — i.e. the pair is still correlated when both land in the same timestamp.
    #   * There is no eventcount test. The old `| where eventcount=2` dropped the true positive
    #     whenever anything else landed in the window: Windows retries a failed name resolution
    #     (several EID 22), a single share open emits several EID 3, and a domain-joined host
    #     talks to the DC on 445 constantly. streamstats needs no such test — each SMB event is
    #     evaluated against the most recent preceding DNS failure on its own host, and extra
    #     events in the window cannot suppress a match.
    #   * Every shared field is named for the side it came from (dns_image/dns_user vs
    #     smb_image/smb_user). The old `mvindex(Image, 0)` returned transaction's alphabetically
    #     first value, not the first event's, so the analyst silently got whichever side sorted
    #     first — with no way to tell which that was.
    #   * `| dedup ComputerName, DestinationIp` collapses a burst of SMB connects to one host
    #     into a single row per run. It keys only on fields guaranteed to be present, because
    #     dedup drops rows that are null in any key field.
    # ------------------------------------------------------------------------------------
    raw_query: >-
      index=sysmon (QueryName=* QueryStatus!="0") OR (DestinationPort=445 Initiated="true" NOT DestinationIp IN ("192.0.2.10", "192.0.2.11"))
      | eval evtype=if(isnotnull(QueryStatus), "dnsfail", "smb")
      | eval dq_time=if(evtype="dnsfail", _time, null()), dq_name=if(evtype="dnsfail", QueryName, null()), dq_status=if(evtype="dnsfail", QueryStatus, null()), dq_image=if(evtype="dnsfail", Image, null()), dq_user=if(evtype="dnsfail", User, null())
      | sort 0 +_time, +evtype
      | streamstats time_window=10s latest(dq_time) as dnsfail_time, latest(dq_name) as failed_name, latest(dq_status) as failed_status, latest(dq_image) as dns_image, latest(dq_user) as dns_user by ComputerName
      | where evtype="smb" AND isnotnull(dnsfail_time) AND (_time - dnsfail_time) <= 10
      | eval lag_seconds=round(_time - dnsfail_time, 3)
      | rename Image as smb_image, User as smb_user
      | dedup ComputerName, DestinationIp
      | table _time, ComputerName, lag_seconds, failed_name, failed_status, dns_image, dns_user, smb_image, smb_user, DestinationIp, DestinationPort

  # Manual two-host verification (not expressible as custom.testing — this
  # schema's `runner:` is a single value, and run_atomic.ps1 executes one
  # rule's test against one runner; there is no orchestration for a second,
  # independently-acting host in the same run). The lab has both a DC and a
  # victim host on the same segment, so this rule's full attack chain CAN be
  # exercised for real, by hand, using the actual Atomic Red Team test —
  # just not automatically in CI. This is also the ONLY recorded procedure
  # that can settle the OPEN QUESTION above custom.splunk.raw_query, so it
  # is a prerequisite for status: test, not an optional extra:
  #
  #   1. On one host (the "attacker"): run Atomic Red Team T1557.001 test 1
  #      ("LLMNR Poisoning with Inveigh") — this is a real ART test, verified
  #      via its atomics YAML to enable LLMNR/NBNS/HTTPS listening.
  #   2. On the OTHER host (the "victim"): attempt to reach a name with no
  #      DNS record on the same NetBIOS-suffix domain, e.g.
  #      `Test-Path \\NOTAREALSHARE01\test` or `net view \NOTAREALSHARE01` —
  #      this forces the real DNS-failure -> LLMNR/NBT-NS fallback -> SMB
  #      sequence the raw_query above correlates.
  #   3. On the victim host's own Sysmon, find the EID 22 for NOTAREALSHARE01
  #      and RECORD BOTH QueryStatus AND QueryResults. This is the answer to
  #      the open question: a non-zero QueryStatus confirms the rule's premise;
  #      a QueryStatus of 0 with QueryResults pointing at the attacker host's
  #      IP disproves it and means the DNS half has to be rebuilt.
  #   4. Then confirm the EID 3 to the attacker host's IP:445 lands within 10s
  #      of that EID 22, and that the attacker host's IP is NOT in the inline
  #      allowlist in custom.splunk.raw_query, so the suppression doesn't hide it.
  #   5. Stop Inveigh on the attacker host promptly after — it answers every
  #      broadcast query on the segment while running, not just the test's.
  #
  # This is the real thing the emulation test below only approximates on one
  # host; run it once by hand, rather than relying on the emulation test alone
  # for confidence in the correlation logic — the emulation test reproduces the
  # rule's own assumption about the telemetry, so it can only ever confirm that
  # the query matches what the query was written against.
  testing:
    # Deliberately off. The previous raw_query called a lookup table that does not exist, which
    # is a search-time error in Splunk — and a Splunk query error produces a FAIL verdict, not
    # NOT_VERIFIED, so the rule would have reported as a broken detection rather than an
    # untested one. Even with the lookup gone, enabling this is premature until the SPL has been
    # confirmed to run clean and return the expected rows in the lab (the field-name check in
    # the comment above custom.splunk.raw_query is the same gate). Flip to true only after that.
    enabled: false
    runner: windows-victim
    type: emulation
    custom:
      - name: "Simulate the DNS-failure -> SMB-connect telemetry pattern"
        description: >
          Does not run Responder/Inveigh — reproduces only the resulting telemetry sequence
          the raw_query correlates: a DNS query that fails to resolve, immediately followed by
          an outbound SMB (445) connection attempt. This validates the correlation logic itself
          without needing a second, attacker-controlled host on the same broadcast segment.
          Atomic Red Team's real T1557.001 test (test 1, Inveigh) stands up the poisoning tool
          but never generates a victim's fallback query, so it would not reliably fire this
          rule — it is the right fit for DETECT-2026-0034 (process-execution based), not this
          one, whose detection keys on the victim's downstream behavior. Note the limit of what
          this test can prove: it reproduces the rule's own assumption about what the attack
          looks like in Sysmon, so passing it confirms the correlation query works, not that the
          assumption holds. Only the manual two-host procedure above can do that.
        executor: powershell
        command: >-
          $badName = "smbshare-$(Get-Random)-doesnotexist.corp.local";
          Resolve-DnsName -Name $badName -ErrorAction SilentlyContinue | Out-Null;
          Start-Sleep -Milliseconds 300;
          try { (New-Object Net.Sockets.TcpClient).Connect("203.0.113.1", 445) } catch {}
        cleanup: ""
        prerequisites:
          - Sysmon config must log EventID 22 (DnsQuery) and EventID 3 (NetworkConnect) without
            excluding port 445 or the 203.0.113.1 test destination
          - The Sysmon extraction must populate QueryName, QueryStatus, DestinationPort and
            Initiated — the raw_query keys on field presence rather than an event-ID field, so a
            missing extraction returns zero rows silently instead of erroring
          - 203.0.113.1 must not be present in the inline destination allowlist in
            custom.splunk.raw_query; it is an RFC 5737 documentation-range address reserved for
            this test and must never be added there as a real server
