title: Web Server Path Traversal Attempt in Request Path or Query
detect_id: DETECT-2026-0037
status: experimental
description: >
  Detects nginx access-log requests carrying directory-traversal
  sequences (../ literal, percent-encoded, double-encoded, ..;/
  semicolon-bypass, ....// filter-bypass), well-known OS file targets
  (etc/passwd, win.ini, windows/system32, etc.), null-byte injection
  near a traversal marker, PHP stream-wrapper/protocol abuse
  (php://filter, phar://, zip://, data:, expect://, file:///) and
  Windows absolute drive-letter paths. The last is narrowed to C:/D:
  only: Sigma's `contains` can't express a word-boundary regex, so other
  drive letters (E:, F:, ...) are not covered. Checks both uri_path and
  uri_query -- unlike the SigmaHQ community rule, which checks only the
  query string: a traversal that escapes webroot is rejected by nginx
  with a 400 and logged raw in uri_path, so a query-only rule misses the
  most common real outcome. Fires regardless of HTTP status for that
  reason. Attempt-only signal (T1190); status/bytes are in the output so
  a 200 with bytes>0 can be triaged first. nginx logs the request line
  raw/undecoded, so encoded forms are matched literally
  (case-insensitive); backslash appears escaped as \x5C. A single ../ is
  not enough on its own (normal in legit query values) -- two consecutive
  segments, or an OS-file/stream-wrapper/drive-letter target, is the bar.
  ....// is the one literal form listed as a single hop, since it is a
  filter-bypass shape rather than a plain traversal pair. The
  stream-wrapper group likewise carries no ../ sequence at all: it is
  LFI/RFI delivery, kept in this rule because it is the same
  request-borne T1190 exploitation attempt against the same log source.
  That bar has a documented cost: each listed pattern encodes both hops
  the same way, so *alternating* per-hop encodings (..%2f../,
  ../..%2f, %2e%2e%2f..%2f, ..%5c..%2f) are a miss unless the payload
  also names an OS file -- see falsepositives, alongside the deeper
  double-encoding/overlong-UTF-8 limit.
  Field names are Splunk-native access_combined extractions
  (uri_path/uri_query); no field-mapping pipeline exists for this log
  source.
references:
  - https://attack.mitre.org/techniques/T1190/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/web/webserver_generic/web_path_traversal_exploitation_attempt.yml
  - https://github.com/SigmaHQ/sigma/blob/master/rules-emerging-threats/2021/Exploits/CVE-2021-41773/web_cve_2021_41773_apache_path_traversal.yml
  - https://book.hacktricks.xyz/pentesting-web/file-inclusion
  - https://nginx.org/en/docs/http/ngx_http_log_module.html#log_format
author: Bence Marton
date: 2026-09-20
modified: 2026-09-26
version: "1.1"
tags:
  - attack.initial_access
  - attack.t1190

logsource:
  product_category: web
  product: nginx
  service: access
  event_type: access_history

detection:
  selection_sourcetype:
    sourcetype: access_combined

  selection_literal:
    - uri_path|contains:
        - '../../'
        - '..\x5c..\x5c'
        - '....//'
        - '..//..//'
    - uri_query|contains:
        - '../../'
        - '..\x5c..\x5c'
        - '....//'
        - '..//..//'

  selection_encoded:
    - uri_path|contains:
        - '..%2f..%2f'
        - '%2e%2e/%2e%2e/'
        - '%2e%2e%2f%2e%2e%2f'
        - '..%5c..%5c'
        - '%2e%2e%5c%2e%2e%5c'
        - '.%2e/.%2e/'
        - '%2e./%2e./'
        - '..%252f..%252f'
        - '%252e%252e%252f%252e%252e%252f'
        - '..%c0%af..%c0%af'
    - uri_query|contains:
        - '..%2f..%2f'
        - '%2e%2e/%2e%2e/'
        - '%2e%2e%2f%2e%2e%2f'
        - '..%5c..%5c'
        - '%2e%2e%5c%2e%2e%5c'
        - '.%2e/.%2e/'
        - '%2e./%2e./'
        - '..%252f..%252f'
        - '%252e%252e%252f%252e%252e%252f'
        - '..%c0%af..%c0%af'

  selection_semicolon:
    - uri_path|contains:
        - '..;/..;/'
    - uri_query|contains:
        - '..;/..;/'

  # Directory prefix is required in every entry ('etc/passwd', never bare
  # 'passwd') -- a bare filename matches ordinary page names.
  selection_osfile:
    - uri_path|contains:
        - 'etc/passwd'
        - 'etc%2fpasswd'
        - 'etc/shadow'
        - 'etc%2fshadow'
        - 'proc/self/environ'
        - 'proc%2fself%2fenviron'
        - 'windows/win.ini'
        - 'windows%2fwin.ini'
        - 'winnt/win.ini'
        - '/boot.ini'
        - '%2fboot.ini'
        - 'windows/system32'
        - 'windows%2fsystem32'
        - 'windows%5csystem32'
    - uri_query|contains:
        - 'etc/passwd'
        - 'etc%2fpasswd'
        - 'etc/shadow'
        - 'etc%2fshadow'
        - 'proc/self/environ'
        - 'proc%2fself%2fenviron'
        - 'windows/win.ini'
        - 'windows%2fwin.ini'
        - 'winnt/win.ini'
        - '/boot.ini'
        - '%2fboot.ini'
        - 'windows/system32'
        - 'windows%2fsystem32'
        - 'windows%5csystem32'

  # %00 is only ever paired with a traversal marker here -- bare %00 alone
  # is too noisy to list.
  selection_nullbyte:
    - uri_path|contains:
        - '../%00'
        - '..%2f%00'
        - '..%5c%00'
        - '%2e%2e%2f%00'
        - '%2e%2e%5c%00'
    - uri_query|contains:
        - '../%00'
        - '..%2f%00'
        - '..%5c%00'
        - '%2e%2e%2f%00'
        - '%2e%2e%5c%00'

  selection_streamwrapper:
    - uri_path|contains:
        - 'php://filter'
        - 'php://input'
        - 'php://data'
        - 'phar://'
        - 'zip://'
        - 'data:text/'
        - 'data:application/'
        - 'expect://'
        - 'file:///'
    - uri_query|contains:
        - 'php://filter'
        - 'php://input'
        - 'php://data'
        - 'phar://'
        - 'zip://'
        - 'data:text/'
        - 'data:application/'
        - 'expect://'
        - 'file:///'

  selection_windrive:
    - uri_path|contains:
        - 'c:\x5c'
        - 'c%3a%5c'
        - 'd:\x5c'
        - 'd%3a%5c'
    - uri_query|contains:
        - 'c:\x5c'
        - 'c%3a%5c'
        - 'd:\x5c'
        - 'd%3a%5c'

  condition: >
    selection_sourcetype and (
      selection_literal or selection_encoded or
      selection_semicolon or selection_osfile or
      selection_nullbyte or selection_streamwrapper or selection_windrive
    )

fields:
  - _time
  - host
  - clientip
  - method
  - uri_path
  - uri_query
  - status
  - bytes
  - useragent
  - referer

falsepositives:
  - >-
    A scanner you run yourself (Nessus, Nikto, nuclei, an internal ASV
    scan) sends exactly these payloads by design -- correlate with the
    scan calendar or source IP before escalating; no allow-list built in,
    since one keyed on host/IP would also hide a genuine probe.
  - >-
    An application that legitimately passes a multi-level relative path
    in a query value (e.g. a redirect/file-picker parameter,
    ?next=../../home) matches selection_literal; a wiki/blog page whose
    URL or search query contains etc/passwd or windows/system32 matches
    selection_osfile.
  - >-
    selection_streamwrapper's data: pattern is the URI scheme, not the
    HTML data attribute -- a legitimate parameter carrying a literal
    data: URL (e.g. an image-upload endpoint) would still match.
    selection_windrive's c:\x5c/d:\x5c could in principle collide with an
    unrelated path segment containing that exact substring; considered
    unlikely but unproven for this lab.
  - >-
    Known blind spot, documented rather than fixed: every pattern in
    selection_literal/selection_encoded matches one *uniform* encoding of
    both traversal hops, so a payload that alternates encodings between
    hops is missed -- `..%2f../config.php`, `../..%2fconfig.php`,
    `%2e%2e%2f..%2fconfig.php` and `..%5c..%2fconfig.php` all slip
    through whenever the request carries no explicit OS-file name for
    selection_osfile to catch instead. Covering the full cross-product of
    per-hop encodings needs a regex, not Sigma's `contains`; the same
    applies to encodings deeper than the one double-encoded (%252f) and
    overlong-UTF-8 (%c0%af) form each listed above.
  - >-
    Alert volume, not false positives: SigmaHQ's own traversal rule notes
    such requests are expected continuously on internet-facing systems.
    Treat as an activity/enrichment signal; status/bytes separate a
    rejected attempt (400/404) from an answered one.

level: medium

custom:
  splunk:
    index: main
    mode: alert
    cron: "*/5 * * * *"
    earliest: "-5m"
    latest: "now"
    severity: medium

  testing:
    enabled: true
    runner: linux-victim
    type: emulation
    custom:
      - name: "Literal traversal in path and query"
        description: >-
          /static/../../app/x (uri_path, 400 expected) and
          /?f=../../app/x (uri_query, served normally) -- no OS-file
          name present, so only selection_literal matches.
        executor: powershell
        command: |-
          curl -s -o /dev/null --path-as-is 'http://localhost/static/../../app/x'
          curl -s -o /dev/null --path-as-is 'http://localhost/?f=../../app/x'
        cleanup: ""
        prerequisites:
          - nginx must be running on linux-victim and listening on port 80
          - curl must be installed (/usr/bin/curl)

      - name: "Encoded traversal in path and query"
        description: >-
          /..%2f..%2fapp%2fx (uri_path) and
          /index.html?x=%2e%2e/%2e%2e/app/x (uri_query) -- only
          selection_encoded matches.
        executor: powershell
        command: |-
          curl -s -o /dev/null --path-as-is 'http://localhost/..%2f..%2fapp%2fx'
          curl -s -o /dev/null --path-as-is 'http://localhost/index.html?x=%2e%2e/%2e%2e/app/x'
        cleanup: ""
        prerequisites:
          - nginx must be running on linux-victim and listening on port 80
          - curl must be installed (/usr/bin/curl)

      - name: "Semicolon-style traversal in path and query"
        description: >-
          /blog/..;/..;/app/x (uri_path) and /index.html?x=..;/..;/app/x
          (uri_query) -- only selection_semicolon matches.
        executor: powershell
        command: |-
          curl -s -o /dev/null --path-as-is 'http://localhost/blog/..;/..;/app/x'
          curl -s -o /dev/null --path-as-is 'http://localhost/index.html?x=..;/..;/app/x'
        cleanup: ""
        prerequisites:
          - nginx must be running on linux-victim and listening on port 80
          - curl must be installed (/usr/bin/curl)

      - name: "Null-byte and stream-wrapper payloads (2026-09-23 addition)"
        description: >-
          /app/../%00x (uri_path, selection_nullbyte only) and
          /index.html?x=php://filter/resource=index (uri_query,
          selection_streamwrapper only). Last budget under the 10-event
          cap; selection_windrive has no CI request at all.
        executor: powershell
        command: |-
          curl -s -o /dev/null --path-as-is 'http://localhost/app/../%00x'
          curl -s -o /dev/null --path-as-is 'http://localhost/index.html?x=php://filter/resource=index'
        cleanup: ""
        prerequisites:
          - nginx must be running on linux-victim and listening on port 80
          - curl must be installed (/usr/bin/curl)

      - name: "OS-file targets in path and query"
        description: >-
          /etc/passwd (uri_path, no traversal prefix) and
          /?file=/etc/shadow (uri_query) -- only selection_osfile
          matches.
        executor: powershell
        command: |-
          curl -s -o /dev/null --path-as-is 'http://localhost/etc/passwd'
          curl -s -o /dev/null --path-as-is 'http://localhost/?file=/etc/shadow'
        cleanup: ""
        prerequisites:
          - nginx must be running on linux-victim and listening on port 80
          - curl must be installed (/usr/bin/curl)
