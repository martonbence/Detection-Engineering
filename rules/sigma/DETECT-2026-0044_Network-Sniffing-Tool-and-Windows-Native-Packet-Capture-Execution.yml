title: Network Sniffing Tool and Windows Native Packet Capture Execution
detect_id: DETECT-2026-0044
status: experimental
description: >
  Detects execution of network packet-capture tooling on a monitored Windows
  host, covering both third-party sniffers and Windows' own built-in capture
  facilities being invoked outside routine administration: Wireshark, tshark,
  dumpcap, and WinDump (all built on the Npcap/WinPcap capture driver);
  RawCap (a standalone sniffer that needs no driver at all, since it captures
  via raw sockets); the built-in `netsh trace start capture=yes` packet
  trace; the built-in `pktmon` packet monitor; and the PowerShell
  NetEventSession cmdlet sequence (New-NetEventSession /
  Add-NetEventPacketCaptureProvider / Start-NetEventSession) that drives the
  same underlying NDIS capture provider from a script.

  This is process-creation telemetry only: it detects the tool or built-in
  utility being launched, not the on-wire sniffing itself, and it does not
  cover the Npcap/WinPcap driver *installation* step (a Sysmon EventID 6
  DriverLoad for npcap.sys/npf.sys) or NIC promiscuous-mode changes -- this
  repo has no rule on any driver_load-category logsource yet, so that signal
  is a known coverage gap rather than something folded into this rule
  unverified.
references:
  - https://attack.mitre.org/techniques/T1040/
  - https://lolbas-project.github.io/lolbas/Binaries/Pktmon/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1040/T1040.md
  - https://www.netresec.com/?page=RawCap
  - https://npcap.com/
  - https://github.com/SigmaHQ/sigma/blob/07ec293a51695cb1131a2e05260247872b31e1e1/rules/windows/process_creation/proc_creation_win_netsh_packet_capture.yml#L14
author: Bence Marton
date: 2026-09-26
modified: 2026-09-26
version: "1.0"
tags:
  - attack.credential_access
  - attack.discovery
  - attack.t1040

logsource:
  product_category: os
  product: windows
  service: sysmon
  event_type: process_creation

detection:
  selection_capture_tools:
    - Image|endswith:
        - '\tshark.exe'
        - '\dumpcap.exe'
        - '\windump.exe'
        - '\Wireshark.exe'
        - '\RawCap.exe'
    - OriginalFileName:
        - "tshark.exe"
        - "dumpcap.exe"
        - "WinDump.exe"
        - "Wireshark.exe"
        - "RawCap.exe"

  selection_pktmon:
    - Image|endswith: '\pktmon.exe'
    - OriginalFileName: "PktMon.exe"

  selection_netsh_trace:
    Image|endswith: '\netsh.exe'
    CommandLine|contains|all:
      - "trace"
      - "start"
      - "capture=yes"

  selection_powershell_netevent:
    CommandLine|contains:
      - "New-NetEventSession"
      - "Add-NetEventPacketCaptureProvider"
      - "Start-NetEventSession"

  condition: selection_capture_tools or selection_pktmon or selection_netsh_trace or selection_powershell_netevent

fields:
  - _time
  - ComputerName
  - User
  - Image
  - OriginalFileName
  - CommandLine
  - ParentImage
  - ParentCommandLine
  - ProcessId

falsepositives:
  - >-
    Network engineers and helpdesk staff legitimately troubleshooting
    connectivity or VPN issues with Wireshark/tshark, `netsh trace`, or
    `pktmon` (`pktmon` is Microsoft's own documented tool for Always On VPN
    diagnostics) -- these are the most likely source of benign hits and the
    reason this rule is not rated critical. RawCap has essentially no such
    legitimate enterprise use (it exists specifically as a portable,
    no-install sniffer), so a RawCap hit should be treated with more
    suspicion than a Wireshark/pktmon/netsh hit even though they share this
    rule. The PowerShell NetEventSession branch also has genuine scripted
    diagnostic use, though it is rarer in practice than the GUI/CLI tools.

level: medium

custom:
  splunk:
    index: sysmon
    mode: alert
    cron: "*/5 * * * *"
    earliest: "-5m"
    latest: "now"
    severity: medium

  testing:
    enabled: true
    runner: windows-victim
    type: atomic
    atomics:
      - technique: T1040
        test_numbers: [4, 5, 6, 7]
