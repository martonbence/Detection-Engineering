title: Linux Credential Access via Proc Filesystem Memory Read
detect_id: DETECT-2026-0035
status: experimental
description: >
  Detects T1003.007 OS Credential Dumping: Proc Filesystem -- reading
  another Linux process's memory via /proc/<pid>/mem to scrape credentials.
  Last remaining T1003 gap in this repo (.001-.006 on Windows, .008 shipped
  as DETECT-2026-0034). Combines two signals in one custom.splunk.raw_query:
  (1) the existing `credential_access_ptrace`/`credential_access_procmem`
  syscall watches, matched by `key` alone, same pattern as DETECT-2026-0034;
  (2) a NEW `procfs_mem_access` auditd watch on `openat` (not yet deployed,
  see `custom.testing` comments for the exact auditctl line), needed
  because the real Atomic Red Team tests read /proc/<pid>/mem as a plain
  file, not via ptrace/process_vm_readv. auditd's `-w` can't glob a per-PID
  path, so this watch is broad and the actual target path is recovered by
  joining the SYSCALL record to its paired PATH record on the shared
  `audit(<epoch>.<ms>:<serial>)` id -- a cross-event join native Sigma
  can't express, hence raw_query. Full design reasoning (regex choices,
  auid scoping, alternatives checked) lives in the testing-block comments
  below and in the T1003.007 vault note.
references:
  - https://attack.mitre.org/techniques/T1003/007/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1003.007/T1003.007.yaml
  - https://attack.mitre.org/detectionstrategies/DET0593/
author: Bence Marton
date: 2026-09-19
modified: 2026-09-19
version: "1.0"
tags:
  - attack.credential_access
  - attack.t1003.007

logsource:
  product_category: os
  product: linux
  service: auditd
  event_type: process_access

detection:
  selection:
    sourcetype: linux_audit
    key:
      - credential_access_ptrace
      - credential_access_procmem
      - procfs_mem_access
  condition: selection

fields:
  - _time
  - detection_reason
  - key
  - comm
  - exe
  - uid
  - auid
  - pid
  - target_path
  - target_pid

falsepositives:
  - >-
    Debuggers attaching to a foreign process (`gdb -p <pid>`, `strace -p
    <pid>`) legitimately read the target's /proc/<pid>/mem and, for the
    ptrace-syscall-based branch of this rule, its ptrace calls -- routine on
    a dev/troubleshooting box, and this rule does not filter it (an attacker
    could equally use gdb/strace as a scraping tool, so excluding them by
    comm would blind the rule to that path).
  - >-
    Performance profilers (`perf`, some APM/observability agents) read
    foreign process memory maps or use `process_vm_readv` for sampling --
    same reasoning as above, not filtered.
  - >-
    Core-dump generation: the kernel's own core-dump handler and tools like
    `gcore` read a crashing/target process's memory via the same procfs
    mechanism during a crash dump or manual core capture.
  - >-
    Container runtimes and orchestrators occasionally do `/proc/<pid>/`
    introspection (rare for `mem` specifically vs. `status`/`maps` alone,
    but possible for some memory-limit-enforcement or security tooling).
  - >-
    TODO: the `procfs_mem_access` branch's underlying `-S openat` watch is
    system-wide and unscoped by target path (auditd cannot filter on a
    per-PID procfs path at rule-load time, see description) -- realistic
    benign-noise volume for that branch specifically is unmeasured, because
    the auditd rule it depends on is not deployed yet as of authoring. This
    is a known gap, not an invented FP list; revisit once real log volume
    from linux-victim is available.

level: high

custom:
  splunk:
    index: main
    mode: alert
    cron: "*/5 * * * *"
    earliest: "-5m"
    latest: "now"
    severity: high
    raw_query: >-
      (sourcetype=linux_audit key IN (credential_access_ptrace, credential_access_procmem))
      | eval detection_reason=if(key="credential_access_ptrace", "ptrace_syscall", "process_vm_readv_syscall")
      | table _time, detection_reason, key, comm, exe, uid, auid, pid, success
      | append
          [ search index=main sourcetype=linux_audit (key=procfs_mem_access) OR (type=PATH name="/proc/*/mem")
          | rex field=_raw "audit\((?<audit_ts>[\d\.]+):(?<audit_serial>\d+)\)"
          | eval audit_id=audit_ts."_".audit_serial
          | rex field=name "^/proc/(?<target_pid>\d+)/mem$"
          | stats values(comm) as comm, values(exe) as exe, values(uid) as uid, values(auid) as auid, values(pid) as pid, values(name) as target_path, values(target_pid) as target_pid by audit_id, _time
          | where isnotnull(target_pid) AND isnotnull(comm)
          | where mvindex(pid,0)!=mvindex(target_pid,0)
          | eval detection_reason="procfs_mem_open"
          | table _time, detection_reason, comm, exe, uid, auid, pid, target_path, target_pid ]
      | sort - _time

  testing:
    enabled: true
    runner: linux-victim
    type: atomic
    atomics:
      - technique: T1003.007
        test_numbers: [1, 3]
