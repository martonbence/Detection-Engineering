title: Web Server SQL Injection Attempt in Request Path or Query
detect_id: DETECT-2026-0041
status: stable
description: >
  Detects nginx access-log GET/POST requests on any status except 404
  whose request path or query string carries one of nine SQLi shapes:
  UNION-based, quoted-tautology bypass ('OR'1'='1), comment-based
  termination after a quote (--/#), boolean-blind (AND/OR + numeric
  compare), time-blind (SLEEP/BENCHMARK/WAITFOR DELAY/PG_SLEEP/
  DBMS_PIPE.RECEIVE_MESSAGE), error-based (EXTRACTVALUE/UPDATEXML/
  FLOOR(RAND(/EXP(~), schema/version recon (information_schema,
  @@version, DATABASE()), stacked queries (;DROP/INSERT/...) and
  payload-builder functions (CONCAT/GROUP_CONCAT/hex literals/CHAR()).
  Ported from NetWitness ESA-067 (same nine categories, same FP gates:
  boolean-blind requires the numeric-compare pair together, not a bare
  and/or; tautology/comment require an actual quote character present).
  Cross-checked against SigmaHQ's web_sql_injection_in_access_logs.yml,
  which independently covers the same core keyword set (UNION SELECT,
  information_schema, sleep(10), '1'='1) -- confirms the category list
  rather than replacing it, and that rule's own note that WAF-bypass
  research now also documents comment-based whitespace substitution
  (/**/ in place of a literal space) and JSON-body SQLi that this
  access-log-only view cannot see (see falsepositives/limits). Checks
  both uri_path and uri_query, unlike the SigmaHQ rule (GET query only)
  and the NetWitness source (single combined url field) -- a payload
  that trips a 400 before reaching the app is logged in uri_path, not
  uri_query. Attempt-only signal (T1190): the access log has no response
  body, so a 500 here means the server errored, not that data was
  extracted. Status handling matches SigmaHQ's rule: 404 is excluded and
  nothing else is. An earlier 200/201/500 allow-list was replaced
  2026-09-26 because it contradicted the uri_path half of this same rule
  -- the reason uri_path is checked at all is that nginx rejects a
  traversal-ish or malformed payload with a 400 before the application
  sees it, and an allow-list that omits 400 discards exactly those
  requests -- and because it also dropped the 403/302 answers scanners
  routinely collect, at no gain in precision: the nine payload patterns,
  not the response code, are what make this rule specific.
references:
  - https://attack.mitre.org/techniques/T1190/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/web/webserver_generic/web_sql_injection_in_access_logs.yml
  - https://book.hacktricks.xyz/pentesting-web/sql-injection
  - https://www.picussecurity.com/resource/blog/waf-bypass-using-json-based-sql-injection-attacks
author: Bence Marton
date: 2026-09-23
modified: 2026-09-26
version: "1.1"
tags:
  - attack.initial_access
  - attack.t1190

logsource:
  product_category: web
  product: nginx
  service: access
  event_type: access_history

detection:
  selection_sourcetype:
    sourcetype: access_combined
  selection_method:
    method:
      - GET
      - POST

  filter_notfound:
    status: "404"

  selection_union:
    - uri_path|re: '(?i)union(?:\+|%20|/\*.*?\*/)*(?:all(?:\+|%20)*)?select'
    - uri_query|re: '(?i)union(?:\+|%20|/\*.*?\*/)*(?:all(?:\+|%20)*)?select'

  selection_tautology:
    - uri_path|re: '(?i)(?:%27|\x27)(?:\+|%20)*(?:or|and)(?:\+|%20)*(?:%27|\x27)?[a-z0-9_]+(?:%27|\x27)?(?:\+|%20)*(?:=|%3d)(?:\+|%20)*(?:%27|\x27)?[a-z0-9_]+(?:%27|\x27)?'
    - uri_query|re: '(?i)(?:%27|\x27)(?:\+|%20)*(?:or|and)(?:\+|%20)*(?:%27|\x27)?[a-z0-9_]+(?:%27|\x27)?(?:\+|%20)*(?:=|%3d)(?:\+|%20)*(?:%27|\x27)?[a-z0-9_]+(?:%27|\x27)?'

  selection_comment:
    - uri_path|re: '(?i)(?:%27|\x27)(?:\+|%20)*(?:--|%2d%2d|#|%23)'
    - uri_query|re: '(?i)(?:%27|\x27)(?:\+|%20)*(?:--|%2d%2d|#|%23)'

  selection_boolean_blind:
    - uri_path|re: '(?i)\b(?:and|or)\b(?:\+|%20)+\(?[0-9]+(?:=|%3d|<|>)\(?[a-z0-9_]+'
    - uri_query|re: '(?i)\b(?:and|or)\b(?:\+|%20)+\(?[0-9]+(?:=|%3d|<|>)\(?[a-z0-9_]+'

  selection_time_blind:
    - uri_path|re: '(?i)(?:sleep\(|benchmark\(|waitfor(?:\+|%20)delay|pg_sleep\(|dbms_pipe\.receive_message)'
    - uri_query|re: '(?i)(?:sleep\(|benchmark\(|waitfor(?:\+|%20)delay|pg_sleep\(|dbms_pipe\.receive_message)'

  selection_error_based:
    - uri_path|re: '(?i)(?:extractvalue\(|updatexml\(|floor\(rand\(|exp\(~)'
    - uri_query|re: '(?i)(?:extractvalue\(|updatexml\(|floor\(rand\(|exp\(~)'

  selection_recon:
    - uri_path|re: '(?i)(?:information_schema|sysobjects|syscolumns|sys\.tables|@@version|@@datadir|version\(\)|database\(\))'
    - uri_query|re: '(?i)(?:information_schema|sysobjects|syscolumns|sys\.tables|@@version|@@datadir|version\(\)|database\(\))'

  selection_stacked:
    - uri_path|re: '(?i)(?:;|%3b)(?:\+|%20)*(?:drop|insert|update|delete|exec|create|alter)(?:\+|%20)'
    - uri_query|re: '(?i)(?:;|%3b)(?:\+|%20)*(?:drop|insert|update|delete|exec|create|alter)(?:\+|%20)'

  selection_payload_builder:
    - uri_path|re: '(?i)(?:concat\(.{0,60}?,|group_concat\(|0x[0-9a-f]{10,}|char\(\s*0x?[0-9]+\s*(?:,|\)))'
    - uri_query|re: '(?i)(?:concat\(.{0,60}?,|group_concat\(|0x[0-9a-f]{10,}|char\(\s*0x?[0-9]+\s*(?:,|\)))'

  condition: >
    selection_sourcetype and selection_method and (
      selection_union or selection_tautology or selection_comment or
      selection_boolean_blind or selection_time_blind or
      selection_error_based or selection_recon or selection_stacked or
      selection_payload_builder
    ) and not filter_notfound

fields:
  - _time
  - host
  - clientip
  - method
  - uri_path
  - uri_query
  - status
  - bytes
  - useragent
  - referer

falsepositives:
  - >-
    A scanner you run yourself (sqlmap, Burp, an internal ASV scan) sends
    exactly these payloads by design -- correlate with the scan calendar
    or source IP before escalating; no allow-list built in, since one
    keyed on host/IP would also hide a genuine probe.
  - >-
    selection_recon's `database()`/`version()` and selection_stacked's
    keyword list can appear in a legitimate app's own query-string tokens
    (rare, but not impossible on a CMS with verbose URLs).
  - >-
    Known blind spot inherited from the source rule: POST-body payloads
    are invisible in the access log, comment-based whitespace obfuscation
    (/**/-as-space) is only partly covered (only inside
    selection_union's own pattern), and JSON-body SQLi (increasingly
    reported bypassing WAFs in 2025-2026) is not visible here at all.
  - >-
    selection_payload_builder's `0x[0-9a-f]{10,}` hex-literal pattern
    matches any long lowercase-hex token in the URL, whatever its purpose:
    token=0xa1b2c3d4e5f6a7, hash=0x12345678901234 and similar session IDs,
    cache-busting values, content digests and crypto addresses all trip it
    with no SQL anywhere in the request. This is the most likely
    application-driven FP in the whole rule -- unlike the other eight
    categories it needs no SQL keyword, quote or comment marker to fire,
    only a hex string long enough. Check this pattern first if the rule is
    noisy against a specific app.
  - >-
    Alert volume, not false positives: SQLi probing is constant background
    radiation on any internet-facing host. Treat as an activity/enrichment
    signal; only 404 is filtered, so the status field in the output is
    what separates a rejected attempt (400) or blocked one (403) from an
    answered 200 and from an error-based 500.

level: high

custom:
  splunk:
    index: main
    mode: alert
    cron: "*/5 * * * *"
    earliest: "-5m"
    latest: "now"
    severity: high

  # Emulation, not atomic: T1190 has no Atomic Red Team test at all
  # (its atomics YAML 404s).
  testing:
    enabled: true
    runner: linux-victim
    type: emulation
    custom:
      - name: "UNION-based and tautology-bypass payloads"
        description: "?id=1 UNION SELECT... (selection_union), ?u=admin'+OR+'1'='1 (selection_tautology)."
        executor: powershell
        command: |-
          curl -s -o /dev/null -G 'http://localhost/' --data-urlencode "id=1 UNION SELECT null,null--"
          curl -s -o /dev/null -G 'http://localhost/' --data-urlencode "u=admin' OR '1'='1"
        cleanup: ""
        prerequisites:
          - nginx must be running on linux-victim and listening on port 80
          - curl must be installed (/usr/bin/curl)

      - name: "Comment-termination, time-blind and recon payloads"
        description: >-
          ?u=admin'-- (selection_comment), ?id=1;SLEEP(5) (selection_time_blind),
          ?x=information_schema (selection_recon). With the first test
          that covers 5 of the 9 categories; the remaining four
          (boolean_blind, error_based, stacked, payload_builder) were
          validated manually against the rendered SPL and are not
          exercised in CI.
        executor: powershell
        command: |-
          curl -s -o /dev/null -G 'http://localhost/' --data-urlencode "u=admin'--"
          curl -s -o /dev/null -G 'http://localhost/' --data-urlencode "id=1;SLEEP(5)"
          curl -s -o /dev/null -G 'http://localhost/' --data-urlencode "x=information_schema"
        cleanup: ""
        prerequisites:
          - nginx must be running on linux-victim and listening on port 80
          - curl must be installed (/usr/bin/curl)
