title: Windows Password Guessing - Excessive Authentication Failures Against a Single Account
detect_id: DETECT-2026-0002
status: experimental
description: >
  Detects T1110.001 Password Guessing: one account targeted with many failed
  authentication attempts in a short window, the classic "single account, many
  passwords" brute-force pattern (e.g. Hydra against RDP/SMB with -l/-P, or
  CrackMapExec/NetExec spraying one known username across many hosts). Windows
  Security has no Sysmon equivalent for authentication -- this aggregates
  native logon-failure events (4625, 4771, 4776), filtered to the sub-status /
  failure codes that mean "wrong password" rather than "unknown account" (the
  latter is username enumeration, a different technique), and thresholds on
  failure count per TargetUserName in a short window. Domain accounts should be
  monitored on the DC's forwarded Security channel, not a member server's local
  log, which only sees attempts against local accounts.
references:
  - https://attack.mitre.org/techniques/T1110/001/
  - https://sigmahq.io/docs/meta/correlations.html
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4625
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4771
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4776
author: Bence Marton
date: 2026-09-12
modified: 2026-09-12
version: "1.0"
tags:
  - attack.credential_access
  - attack.t1110.001

logsource:
  product_category: os
  product: windows
  service: security
  event_type: authentication_failure

# Placeholder only -- this rule's real logic lives in custom.splunk.raw_query
# (see the rationale in .claude/skills/sigma-rule-authoring: a per-account
# threshold over a time window is a stats/aggregation query, and this repo's
# pipeline cannot load genuine Sigma correlation documents -- see
# docs/credential-access-buildout.md §6). This block is schema-required and
# never evaluated for a raw_query rule.
detection:
  selection:
    EventCode:
      - 4625
      - 4771
      - 4776
  condition: selection

fields:
  - _time
  - TargetUserName
  - failure_count
  - distinct_sources
  - sources
  - event_codes

falsepositives:
  - >-
    A user who forgot their password and retries manually -- typically a low
    attempt count (2-5), from a single source, often the user's own normal
    office/VPN IP. Below this rule's 10-in-5-minutes threshold in the common
    case, but a slow, deliberate retyper could still cross it.
  - >-
    A service or scheduled task running with a stale credential after a
    password change, retrying persistently against the same account from the
    same source at a constant cadence -- the most common long-lived FP source
    in practice. Distinguishable from a real attack by duration and rhythm
    (days of steady, evenly-spaced failures vs. an attack's faster, shorter
    burst) but will still cross the count threshold; investigate before
    excluding, since a compromised service account retrying a *guessed* password
    would look identical at the SPL level.
  - >-
    Vulnerability or compliance scanners testing default credentials against
    an account from a known scanner IP. Allowlistable by source once the
    scanner's IP range is confirmed.

level: medium

custom:
  splunk:
    # TODO: confirm with whoever administers the DC/forwarder which index the
    # DC's Security channel actually lands in (docs/credential-access-buildout.md
    # §3.4 flags this as unconfirmed for this whole native-log track, not
    # specific to this rule) -- "security" is a placeholder matching this
    # rule's logsource.service, not a verified index name.
    index: security
    mode: alert
    cron: "*/5 * * * *"
    earliest: "-5m"
    latest: "now"
    severity: medium
    raw_query: >-
      index=security (EventCode=4625 SubStatus="0xC000006A") OR (EventCode=4771 Status="0x18") OR (EventCode=4776 Status="0xC000006A")
      TargetUserName!="*$"
      | eval src_identifier=coalesce(IpAddress, Workstation)
      | bin _time span=5m
      | stats count as failure_count, dc(src_identifier) as distinct_sources, values(src_identifier) as sources, values(EventCode) as event_codes by TargetUserName, _time
      | where failure_count >= 10
      | sort - failure_count
      | table _time, TargetUserName, failure_count, distinct_sources, sources, event_codes

  testing:
    # A real, on-topic atomic exists (T1110.001 test 1, "Brute Force
    # Credentials of single Active Directory domain users via SMB") and it is
    # the right shape for this rule: it runs from a domain-joined host against
    # a single named account via %logonserver%\IPC$, producing real 4625
    # events on the DC with SubStatus 0xC000006A for that TargetUserName --
    # exactly what selection_-equivalent above matches. It is left disabled
    # rather than enabled, though: its wordlist is fixed at 5 passwords, which
    # is below this rule's 10-in-5-minutes threshold (chosen to match the
    # community-standard event_count correlation threshold for this exact
    # pattern, see the sigmahq.io reference above). A single run of the atomic
    # would leave the saved search's own threshold unmet and register a
    # guaranteed FAIL under this pipeline's pass/fail model (event_count < 1),
    # not because the detection is wrong -- see pass_fail_eval.py. Re-enable
    # once either the threshold is deliberately lowered for lab verification
    # or the atomic is run multiple times / looped to cross it for real.
    enabled: false
    runner: windows-victim
    type: atomic
    atomics:
      - technique: T1110.001
        test_numbers: [1]
