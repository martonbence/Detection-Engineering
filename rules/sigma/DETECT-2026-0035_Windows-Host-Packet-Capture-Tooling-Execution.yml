title: Windows Host Packet Capture Tooling Execution
detect_id: DETECT-2026-0035
status: experimental
description: >
  Detects execution of packet-capture tooling on a monitored Windows host: the
  Windows-native capture paths (netsh trace, pktmon, and the PowerShell
  NetEventPacketCapture cmdlets) plus Wireshark's capture engine (dumpcap/tshark).
  Capturing traffic on a host the attacker already controls is a sniffing
  primitive (T1040) used both to harvest credentials in transit and to map the
  network. It is a noisy signal on its own -- IT and support staff run these same
  tools for legitimate troubleshooting -- so this rule is experimental and
  intended to be tuned with a parent-process / user-group allowlist before it is
  promoted. Split out of DETECT-2026-0034, which now covers only the T1557.001
  poisoning / SMB-relay tooling.
references:
  - https://attack.mitre.org/techniques/T1040/
  - https://learn.microsoft.com/en-us/windows-server/networking/technologies/pktmon/pktmon
author: Bence Marton
date: 2026-09-10
modified: 2026-09-10
version: "1.0"
tags:
  - attack.credential_access
  - attack.discovery       # T1040's second tactic in this repo's own ATT&CK cache
  - attack.t1040

logsource:
  product_category: os
  product: windows
  service: sysmon
  event_type: process_creation

detection:
  selection_netsh_trace:
    Image|endswith: '\netsh.exe'
    CommandLine|contains|all:
      - "trace"
      - "start"

  selection_pktmon:
    Image|endswith: '\pktmon.exe'
    CommandLine|contains:
      - "start"
      - "filter"

  selection_wireshark_capture:
    Image|endswith:
      - '\dumpcap.exe'
      - '\tshark.exe'

  selection_powershell_capture:
    CommandLine|contains|all:
      - "NetEventSession"
      - "NetEventPacketCaptureProvider"

  condition: 1 of selection_*

fields:
  - _time
  - ComputerName
  - User
  - Image
  - CommandLine
  - ParentImage
  - ParentCommandLine
  - ProcessId

falsepositives:
  - Legitimate network troubleshooting by IT/support staff using netsh trace,
    pktmon, or Wireshark -- the dominant false-positive source. Microsoft support
    engineers routinely instruct "netsh trace start" during case work. A
    ParentImage / user-group allowlist is expected before this rule leaves
    experimental status.
  - Security tooling that legitimately captures traffic for its own detection
    purposes -- some NDR/EDR agents use pktmon or ETW packet capture internally.
    Allowlist the vendor's process path if observed.
  - Automated network diagnostics baked into some laptop-vendor support suites
    (Dell SupportAssist, Lenovo Vantage) that trigger netsh trace on connectivity
    faults.

level: medium

custom:
  splunk:
    index: sysmon
    mode: alert
    cron: "*/5 * * * *"
    earliest: "-5m"
    latest: "now"
    severity: medium

  testing:
    enabled: false
    runner: windows-victim
    type: atomic
    atomics:
      - technique: T1040
        test_numbers: [5, 6, 7, 16]
        # Test 5 ("netsh trace start capture=yes ...") -> selection_netsh_trace.
        # Tests 6 ("pktmon.exe start --etw ...") and 7 ("pktmon.exe filter add
        # -p 445") -> selection_pktmon. Test 16 ("New-NetEventSession ..." plus
        # Add-NetEventPacketCaptureProvider) -> selection_powershell_capture.
        # Test 4 (tshark.exe) is deliberately excluded: it requires Wireshark
        # installed as a prerequisite, an external-tool dependency this rule does
        # not otherwise need -- same reasoning this repo already applies to
        # Mimikatz-download atomics. Tests 1-3 and 8-15 are Linux/macOS/FreeBSD
        # and out of scope for a Windows/Sysmon logsource.
