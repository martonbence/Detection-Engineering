title: Windows Password Spraying - Multiple Accounts Single Password Short Window
detect_id: DETECT-2026-0003
status: stable
description: >
  Detects T1110.003 Password Spraying: a single source attempting logons
  against many distinct accounts with a (presumed) single password in a
  short window -- the "one password, many accounts" pattern used to stay
  under per-account lockout thresholds (e.g. DomainPasswordSpray, Kerbrute,
  or a plain `net use` loop against IPC$). Mirrors DETECT-2026-0002's log
  sourcing (native Windows logon-failure events 4625/4771/4776, since
  Windows Security has no Sysmon equivalent for authentication) but inverts
  the aggregation: DETECT-2026-0002 groups by target account and counts
  failures; this rule groups by source and counts *distinct target
  accounts*, because spraying deliberately keeps the per-account attempt
  count low (often 1) to avoid lockout -- the account fan-out from one
  source is the actual signal, not the raw failure volume. Filtered to the
  same sub-status/failure codes that mean "wrong password" (not "unknown
  account", which is username enumeration, a different technique).
references:
  - https://attack.mitre.org/techniques/T1110/003/
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4625
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4771
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4776
author: Bence Marton
date: 2026-09-16
modified: 2026-09-16
version: "1.0"
tags:
  - attack.credential_access
  - attack.t1110.003

logsource:
  product_category: os
  product: windows
  service: security
  event_type: authentication_failure

detection:
  selection:
    EventCode:
      - 4625
      - 4771
      - 4776
  condition: selection

fields:
  - _time
  - src_identifier
  - src_ip
  - distinct_accounts
  - attempt_count
  - targeted_accounts

falsepositives:
  - >-
    A shared jump host or admin workstation where a single sysadmin
    authenticates as themselves against many machines/services with one
    typo'd password before correcting it -- distinguishable from real
    spraying by the source being a known admin IP/host and the burst
    ending after one correction rather than continuing across accounts.
  - >-
    A misconfigured service or scheduled task running under multiple stale
    service-account credentials from the same host after a bulk password
    rotation -- all fail with the same old password from one source.
    Distinguishable from an attack by recurrence at a fixed cadence over
    days rather than a single short burst, but will still cross the
    threshold on first occurrence; investigate before excluding.
  - >-
    Vulnerability or compliance scanners testing a known default/weak
    password against a list of discovered accounts from a known scanner
    IP. Allowlistable by source once the scanner's IP range is confirmed.
  - >-
    A multi-user system such as a Citrix/RDS farm or terminal server, where
    one host legitimately authenticates as many different users throughout
    the day. Distinguishable from spraying by a wider, steadier spread of
    attempts over the day rather than a short concentrated burst, and by
    the source being a known, allowlisted multi-user host.
  - >-
    A NAT gateway, VPN concentrator, or RADIUS/NPS server proxying
    authentication on behalf of many distinct, legitimate users -- each
    with their own real password, coincidentally failing (e.g. a mass
    post-reset confusion) around the same time from what the logs see as
    one source. Distinct from the Citrix case above: there one host
    authenticates *as* many users; here many users' *own* auth is funneled
    through one visible source IP. Allowlistable once the gateway's IP is
    confirmed as a known aggregation point.

level: medium

custom:
  splunk:
    index: wineventlog
    mode: alert
    cron: "*/5 * * * *"
    earliest: "-20m"
    latest: "now"
    severity: medium

    raw_query: >-
      index=wineventlog source="wineventlog:security" (EventCode=4625 Sub_Status="0xC000006A") OR (EventCode=4771 Failure_Code="0x18") OR (EventCode=4776 Error_Code="0xC000006A")
      | eval target_account=case(EventCode=4625, mvindex(Account_Name, -1), EventCode=4771, Account_Name, EventCode=4776, Logon_Account)
      | eval target_account=lower(replace(target_account, "@.*$", ""))
      | where NOT match(target_account, "\$$")
      | eval src_identifier=coalesce(if(Workstation_Name!="" AND Workstation_Name!="-", Workstation_Name, null()), if(Source_Workstation!="" AND Source_Workstation!="-", Source_Workstation, null()), if(Source_Network_Address!="127.0.0.1" AND Source_Network_Address!="::1" AND Source_Network_Address!="-", Source_Network_Address, null()), if(Client_Address!="::1" AND Client_Address!="127.0.0.1" AND Client_Address!="-", Client_Address, null()))
      | eval src_ip=coalesce(if(Source_Network_Address!="127.0.0.1" AND Source_Network_Address!="::1" AND Source_Network_Address!="-", Source_Network_Address, null()), if(Client_Address!="::1" AND Client_Address!="127.0.0.1" AND Client_Address!="-", Client_Address, null()))
      | sort 0 _time
      | streamstats time_window=10m dc(target_account) as distinct_accounts, count as attempt_count, values(target_account) as targeted_accounts, values(src_ip) as src_ip by src_identifier
      | where distinct_accounts >= 8
      | stats latest(_time) as _time, max(distinct_accounts) as distinct_accounts, max(attempt_count) as attempt_count, values(targeted_accounts) as targeted_accounts, values(src_ip) as src_ip by src_identifier
      | sort - distinct_accounts
      | table _time, src_identifier, src_ip, distinct_accounts, attempt_count, targeted_accounts

  testing:
    enabled: true
    runner: windows-victim
    type: atomic
    atomics:
      - technique: T1110.003
        test_numbers: [1]
