title: Web Server Requests from Known Scanner and Attack-Tool User-Agents
detect_id: DETECT-2026-0038
status: experimental
description: >
  Detects nginx access-log requests whose User-Agent is the default
  identifier of a known scanning/attack tool: sqlmap, Nikto, Nmap NSE,
  zgrab, gobuster, feroxbuster, ffuf, WPScan, Wfuzz (SigmaHQ's
  web_susp_useragents.yml), libredtail-http (RedTail cryptominer, SANS
  ISC diary 2026-04-29), wp2shell (WordPress RCE PoC, CVE-2026-63030 /
  CVE-2026-60137), plus ~55 additional tool identifiers across six
  categories (web-app scanners, network/port scanners, fuzzers,
  brute-force/exploit frameworks, webshell clients, scan-database tools)
  ported 2026-09-23 from a production NetWitness/RSA ESA rule covering
  the same nginx UA use case. All matched as substrings (tools append a
  version). Generic HTTP-client UAs (curl, wget, python-requests,
  Go-http-client, and the scripted-library UAs libwww-perl/node-fetch/
  aiohttp/guzzle/lwp) are deliberately excluded as legitimate-tool noise
  -- the NetWitness source rule independently reached the same
  exclusion after its own FP review, which validates rather than argues
  for the choice made here. libredtail-http is kept despite that
  cleanup dropping it elsewhere: it identifies one specific malware
  campaign's client, not a generic library. Tagged as vulnerability
  scanning (T1595.002) uniformly, including for the newer
  brute-force/webshell-client/port-scanner/fuzzer categories that would
  individually map closer to T1110, T1505.003 or T1595.001/.003: the
  User-Agent alone shows tool identity, not what the tool did, so one
  activity-signal tag is used throughout rather than splitting the rule
  by tactic (the same call this rule already made for wp2shell, an RCE
  tool, pre-merge). Several newly-added strings (Hydra, c99, commix) are
  bare tool-name substrings with no version/phrase anchor, unlike most
  existing entries ("sqlmap/", "WPScan v") -- higher incidental-FP risk,
  taken as-is from the source's production-validated list. Limits: a
  User-Agent is client-set, so changing it defeats this rule trivially
  (GreyNoise reports fleets already doing so); on an internet-facing
  host this is high-volume background radiation -- an activity/
  enrichment signal, not evidence of compromise. A 400-rejected request
  logs UA as "-", so it never matches here. Field names are Splunk-native
  access_combined extractions (useragent); no field-mapping pipeline
  exists for this log source.
references:
  - https://attack.mitre.org/techniques/T1595/002/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/web/webserver_generic/web_susp_useragents.yml
  - https://github.com/SigmaHQ/sigma/blob/master/rules-emerging-threats/2026/Malware/RedTail-Cryptominer/web_malware_redtail_useragent.yml
  - https://github.com/SigmaHQ/sigma/blob/master/rules-emerging-threats/2026/Exploits/CVE-2026-63030/web_exploit_cve_2026_63030_wp2shell_tool_useragent.yml
  - https://isc.sans.edu/diary/Danger+of+Libredtail+Guest+Diary/32936/
  - https://www.greynoise.io/blog/threat-actors-posing-as-ai-crawlers
  - https://slcyber.io/research-center/wp2shell-pre-authentication-rce-in-wordpress-core/
author: Bence Marton
date: 2026-09-20
modified: 2026-09-23
version: "1.1"
tags:
  - attack.reconnaissance
  - attack.t1595.002

logsource:
  product_category: web
  product: nginx
  service: access
  event_type: access_history

detection:
  selection_sourcetype:
    sourcetype: access_combined

  # Default UA substrings of recon/fuzzing tools (SigmaHQ
  # web_susp_useragents.yml and the tools' own source).
  selection_scanner_ua:
    useragent|contains:
      - "sqlmap/"
      - "Nikto/"
      - "Nmap Scripting Engine"
      - "zgrab/"
      - "gobuster/"
      - "feroxbuster/"
      - "Fuzz Faster U Fool"
      - "WPScan v"
      - "Wfuzz/"

  # Exploit-tool UAs. Source Sigma rules match these exactly; this rule
  # uses `contains` on purpose (deliberately looser).
  selection_redtail_ua:
    useragent|contains: "libredtail-http"

  selection_wp2shell_ua:
    useragent|contains: "wp2shell"

  # Additional web-app vulnerability scanners, added 2026-09-23. ZmEu
  # targets PHPMyAdmin specifically.
  selection_webapp_scanner_ua2:
    useragent|contains:
      - "acunetix"
      - "Nessus"
      - "Arachni"
      - "Burp Suite"
      - "Netsparker"
      - "Invicti"
      - "nuclei"
      - "OpenVAS"
      - "w3af"
      - "Uniscan"
      - "Vega/"
      - "XSSer"
      - "joomscan"
      - "dotdotpwn"
      - "fimap"
      - "shiro-"
      - "Havij"
      - "commix"
      - "sqlninja"
      - "dalfox"
      - "XSStrike"
      - "jaeles"
      - "ZmEu"

  # Network/port scanners and recon/OSINT tools, added 2026-09-23.
  selection_recon_scanner_ua:
    useragent|contains:
      - "masscan"
      - "zmap"
      - "naabu"
      - "censys"
      - "Shodan"
      - "massdns"
      - "dnsrecon"
      - "fierce"
      - "amass"
      - "Sublist3r"
      - "recon-ng"
      - "WhatWeb"
      - "CensysInspect"
      - "InternetMeasurement"
      - "l9explore"

  # Path/parameter fuzzers and directory brute-forcers beyond gobuster/
  # feroxbuster/ffuf/Wfuzz above, added 2026-09-23.
  selection_fuzzer_ua2:
    useragent|contains:
      - "dirbuster"
      - "dirsearch"
      - "kiterunner"
      - "Arjun"
      - "ParamSpider"
      - "getallurls"
      - "katana"
      - "Interlace"
      - "TestProxy"
      - "Xenu"
      - "PanScan"
      - "Retina"

  # Brute-force/exploitation frameworks, added 2026-09-23.
  selection_bruteforce_ua:
    useragent|contains:
      - "Hydra"
      - "metasploit"

  # Webshell-upload/-management clients beyond wp2shell above, added
  # 2026-09-23.
  selection_webshell_ua2:
    useragent|contains:
      - "r57shell"
      - "c99"
      - "weevely"

  # Misc named scan/exploit-database tooling, added 2026-09-23.
  selection_scandb_ua:
    useragent|contains:
      - "exploitdb"
      - "scan.io"
      - "site-digger"
      - "vegajk"

  condition: >
    selection_sourcetype and (
      selection_scanner_ua or selection_redtail_ua or selection_wp2shell_ua or
      selection_webapp_scanner_ua2 or selection_recon_scanner_ua or
      selection_fuzzer_ua2 or selection_bruteforce_ua or
      selection_webshell_ua2 or selection_scandb_ua
    )

fields:
  - _time
  - host
  - clientip
  - method
  - uri_path
  - uri_query
  - status
  - bytes
  - useragent
  - referer

falsepositives:
  - >-
    A scanner you operate yourself (Nikto, Nmap NSE, ffuf, an internal
    scan) sends these User-Agents by design -- correlate with the scan
    calendar or source IP before escalating; no allow-list built in,
    since one keyed on host/IP would also hide a genuine probe.
  - >-
    Security-research/internet-measurement crawlers using zgrab or
    similar openly (e.g. projects that publish their source ranges) --
    still a probe, so whether it counts as an FP is a policy call.
  - >-
    Alert volume, not false positives: constant background radiation on
    any internet-facing host.
  - >-
    Several 2026-09-23 additions are bare tool-name substrings with no
    version/phrase anchor (Hydra, c99, commix); "c99" especially is short
    enough to appear inside an unrelated UA token. Taken as-is from the
    source's production-validated list rather than independently
    re-derived; worth revisiting if any shows non-scanner traffic.

level: medium

custom:
  splunk:
    index: main
    mode: alert
    cron: "*/5 * * * *"
    earliest: "-5m"
    latest: "now"
    severity: medium

  testing:
    enabled: true
    runner: linux-victim
    type: emulation
    custom:
      - name: "Scanner User-Agents (substring list)"
        description: >-
          sqlmap, Nikto, Nmap NSE, gobuster, zgrab, ffuf, WPScan against /
          (selection_scanner_ua, 7 of 9 substrings).
        executor: powershell
        command: |-
          curl -s -o /dev/null -A 'sqlmap/1.8#stable (https://sqlmap.org)' 'http://localhost/'
          curl -s -o /dev/null -A 'Mozilla/5.00 (Nikto/2.5.0) (Evasions:None) (Test:001)' 'http://localhost/'
          curl -s -o /dev/null -A 'Mozilla/5.0 (compatible; Nmap Scripting Engine; https://nmap.org/book/nse.html)' 'http://localhost/'
          curl -s -o /dev/null -A 'gobuster/3.6' 'http://localhost/'
          curl -s -o /dev/null -A 'Mozilla/5.0 zgrab/0.x' 'http://localhost/'
          curl -s -o /dev/null -A 'Fuzz Faster U Fool v2.1.0' 'http://localhost/'
          curl -s -o /dev/null -A 'WPScan v3.8.25 (https://wpscan.com/wordpress-security-scanner)' 'http://localhost/'
        cleanup: ""
        prerequisites:
          - nginx must be running on linux-victim and listening on port 80
          - curl must be installed (/usr/bin/curl)

      - name: "Exploit-tool User-Agents (substring match)"
        description: "libredtail-http, wp2shell (selection_redtail_ua, selection_wp2shell_ua)."
        executor: powershell
        command: |-
          curl -s -o /dev/null -A 'libredtail-http' 'http://localhost/'
          curl -s -o /dev/null -A 'wp2shell' 'http://localhost/'
        cleanup: ""
        prerequisites:
          - nginx must be running on linux-victim and listening on port 80
          - curl must be installed (/usr/bin/curl)

      - name: "Additional scanner User-Agent (2026-09-23 addition)"
        description: >-
          "acunetix" (selection_webapp_scanner_ua2) -- last budget under
          the 10-event cap; the other five new groups are untested in CI.
        executor: powershell
        command: |-
          curl -s -o /dev/null -A 'Mozilla/5.0 (compatible; acunetix)' 'http://localhost/'
        cleanup: ""
        prerequisites:
          - nginx must be running on linux-victim and listening on port 80
          - curl must be installed (/usr/bin/curl)
