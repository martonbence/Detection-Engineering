title: Keylogger Tooling Execution or Keystroke Log Creation via PowerShell
detect_id: DETECT-2026-0045
status: experimental
description: >
  Detects PowerShell-based keystroke capture on Windows from two Sysmon event
  types. Process creation (EventID 1): a powershell.exe/pwsh.exe command line
  that names a public PowerShell keylogger (PowerSploit/Empire
  Get-Keystrokes, Nishang Keylogger.ps1) or carries the keystroke-capture
  Win32/.NET primitives inline (GetAsyncKeyState polling, SetWindowsHookEx
  hook installation, RegisterRawInputDevices raw-input registration,
  [Windows.Input.Keyboard]::IsKeyDown). File creation (EventID 11): a
  PowerShell process creating a file named key.log, the hardcoded default
  capture file of both PowerSploit Get-Keystrokes ($env:TEMP\key.log) and
  Nishang Keylogger.ps1 ($env:temp\key.log), which only happens once the
  capture routine actually runs.

  Sysmon ImageLoad (7) and CreateRemoteThread (8) are deliberately not used:
  WH_KEYBOARD_LL hooks, GetAsyncKeyState polling and raw-input keyloggers run
  entirely inside the capturing process and inject nothing into other
  processes, so neither event is generated. The API calls themselves are
  visible only to ETW-based sensors or PowerShell ScriptBlock logging (4104),
  neither of which is ingested here.
references:
  - https://attack.mitre.org/techniques/T1056/001/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1056.001/T1056.001.yaml
  - https://github.com/PowerShellMafia/PowerSploit/blob/master/Exfiltration/Get-Keystrokes.ps1
  - https://github.com/samratashok/nishang/blob/master/Gather/Keylogger.ps1
  - https://github.com/BC-SECURITY/Empire/blob/main/empire/server/modules/powershell/credentials/keylogger.yaml
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/powershell/powershell_script/posh_ps_keylogging.yml
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/powershell/powershell_script/posh_ps_susp_keylogger_activity.yml
  - https://learn.microsoft.com/en-us/windows/win32/winmsg/lowlevelkeyboardproc
  - https://www.elastic.co/security-labs/protecting-your-devices-from-information-theft-keylogger-protection
author: Bence Marton
date: 2026-09-27
modified: 2026-09-27
version: "1.0"
tags:
  - attack.collection
  - attack.credential_access
  - attack.t1056.001

logsource:
  product_category: os
  product: windows
  service: sysmon
  event_type: process_creation

detection:
  selection_powershell:
    - Image|endswith:
        - '\powershell.exe'
        - '\pwsh.exe'
    - OriginalFileName:
        - 'PowerShell.EXE'
        - 'pwsh.dll'
  selection_keylogger:
    CommandLine|contains:
      - 'Get-Keystrokes'
      - 'Keylogger.ps1'
      - 'GetAsyncKeyState'
      - 'SetWindowsHookEx'
      - 'RegisterRawInputDevices'
      - 'Windows.Input.Keyboard]::IsKeyDown'
  condition: selection_powershell and selection_keylogger

fields:
  - _time
  - ComputerName
  - User
  - EventCode
  - detection_branch
  - Image
  - OriginalFileName
  - CommandLine
  - ParentImage
  - ParentCommandLine
  - TargetFilename
  - ProcessId

falsepositives:
  - >-
    Authorized red team or penetration test use of PowerSploit, Empire or
    Nishang. Every branch of this rule fires on that, and nothing in Sysmon
    telemetry distinguishes it from a real intrusion.
  - >-
    The inline-API branch (GetAsyncKeyState / SetWindowsHookEx /
    RegisterRawInputDevices / IsKeyDown on the command line) also matches
    benign PowerShell that reads keyboard state: global-hotkey or
    "press a key to continue" helpers, kiosk and accessibility scripts,
    and developer P/Invoke experiments. These are uncommon passed inline on
    the command line rather than from a .ps1 file, but they exist.
  - >-
    The key.log branch fires on any PowerShell process that creates a file
    literally named key.log, whatever its content, e.g. a script that
    happens to use that name for an unrelated log. Parent process and path
    are the triage pivots.
  - >-
    Blind spots rather than false positives. Get-Keystrokes loaded in memory
    by an existing agent (Empire's module runs inside the agent process, and
    its output goes to the C2 server, not key.log), -EncodedCommand
    launches, a renamed or relocated capture file, and compiled keyloggers
    (C/C++, .NET, Meterpreter keyscan) all produce none of this telemetry.
    Covering them needs ScriptBlock logging (4104) or an ETW/EDR sensor for
    the keyboard APIs.
  - >-
    Overlap: DETECT-2026-0018 also matches Get-Keystrokes in the command
    line (tagged T1059.001), so the tool-name branch double-alerts with it.

level: medium

custom:
  splunk:
    index: sysmon
    mode: alert
    cron: "*/5 * * * *"
    earliest: "-5m"
    latest: "now"
    severity: medium
    raw_query: >-
      index=sysmon
      ((EventCode=1
      (Image="*\\powershell.exe" OR Image="*\\pwsh.exe" OR OriginalFileName="PowerShell.EXE" OR OriginalFileName="pwsh.dll")
      (CommandLine="*Get-Keystrokes*" OR CommandLine="*Keylogger.ps1*" OR CommandLine="*GetAsyncKeyState*" OR CommandLine="*SetWindowsHookEx*" OR CommandLine="*RegisterRawInputDevices*" OR CommandLine="*Windows.Input.Keyboard]::IsKeyDown*"))
      OR (EventCode=11
      (Image="*\\powershell.exe" OR Image="*\\pwsh.exe")
      TargetFilename="*\\key.log"))
      | eval detection_branch=case(EventCode=11, "keystroke_log_file", match(CommandLine, "(?i)get-keystrokes|keylogger[.]ps1"), "known_keylogger_tool", true(), "keystroke_api_inline")
      | table _time, ComputerName, User, EventCode, detection_branch, Image, OriginalFileName, CommandLine, ParentImage, ParentCommandLine, TargetFilename, ProcessId

  # Atomic test 1 only proves the tool-name branch. Its payload file defines
  # Get-Keystrokes but never calls it, so no hook is installed and no key.log
  # is written. Only the EventID 1 command line naming Get-Keystrokes.ps1
  # exists. To confirm the key.log branch by hand on windows-victim, from an
  # elevated PowerShell with the atomics folder present, run:
  #   . C:\AtomicRedTeam\atomics\T1056.001\src\Get-Keystrokes.ps1; Get-Keystrokes -LogPath $env:TEMP\key.log -Timeout 0.1
  # Then check Splunk for EventCode=11 TargetFilename=*\key.log with
  # detection_branch=keystroke_log_file. Clean up with:
  #   Remove-Item $env:TEMP\key.log
  testing:
    enabled: true
    runner: windows-victim
    type: atomic
    atomics:
      - technique: T1056.001
        test_numbers: [1]
