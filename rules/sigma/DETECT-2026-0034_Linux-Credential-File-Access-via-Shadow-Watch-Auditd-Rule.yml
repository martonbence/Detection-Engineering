title: Linux Credential File Access via Shadow-Watch Auditd Rule
detect_id: DETECT-2026-0034
status: stable
description: >
  Detects T1003.008 OS Credential Dumping: /etc/passwd, /etc/master.passwd
  and /etc/shadow -- root-level access to Linux's password-hash-bearing
  files. Keys on the auditd watch `key` field (`credential_access_shadow`,
  `credential_access_opasswd`) rather than process/command name, so it
  isn't defeated by which binary or shell mechanism did the reading
  (`cat`, `ed`, or a shell `read` builtin with no external process at all).
  `/etc/passwd` is deliberately out of scope: it's world-readable and read
  constantly by benign things (PAM, `getent`, `id`), and only its *writes*
  are watched here -- a different, non-credential-dump signal -- see
  falsepositives for that gap. `/etc/master.passwd` is FreeBSD-only, not
  applicable to this Ubuntu lab target. A native Sigma `filter` excludes
  known password/account-management tooling (`passwd`, `chpasswd`,
  `usermod`, `chage`, `chsh`, `chfn`, `unix_chkpwd`) so routine admin/PAM
  activity doesn't alert; `sudo`, `su`, `login`, `cat`, `ed` and shells
  stay unfiltered, since they're this rule's actual detection target. The
  exact-file ambiguity between `/etc/shadow` and `/etc/gshadow` (both
  share one watch key) is a known, documented gap, not silently dropped
  -- see falsepositives.
references:
  - https://attack.mitre.org/techniques/T1003/008/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1003.008/T1003.008.yaml
  - https://research.splunk.com/endpoint/0419cb7a-57ea-467b-974f-77c303dfe2a3/
author: Bence Marton
date: 2026-09-19
modified: 2026-09-19
version: "1.3"
tags:
  - attack.credential_access
  - attack.t1003.008

logsource:
  product_category: os
  product: linux
  service: auditd
  event_type: file_access

detection:
  selection:
    sourcetype: linux_audit
    key:
      - credential_access_shadow
      - credential_access_opasswd
  filter:
    comm:
      - passwd
      - chpasswd
      - usermod
      - chage
      - chsh
      - chfn
      - unix_chkpwd
  condition: selection and not filter

fields:
  - _time
  - key
  - uid
  - auid
  - comm
  - exe
  - success

falsepositives:
  - >-
    ACTIVELY FILTERED, not just documented: password/account-management
    tooling -- `passwd`, `chpasswd`, `usermod`, `chage`, `chsh`, `chfn` --
    rewrites /etc/shadow as part of a completely normal admin-initiated
    password or account change; this was the single most common expected
    trigger and is now excluded from firing via the `filter` block by
    `comm`.
  - >-
    ACTIVELY FILTERED, not just documented: `unix_chkpwd`, the setuid
    `pam_unix` helper binary PAM execs specifically to perform shadow
    lookups on behalf of authentication (PAM never reads /etc/shadow
    directly from the calling process), producing routine SSH/su/login
    noise -- now excluded via the `filter` block by `comm`.
  - >-
    Configuration-management tooling (Ansible with `become: yes`, Puppet,
    Chef) or backup jobs running as root that read or include /etc/shadow
    as part of a full-filesystem backup or a fact-gathering/audit run.
  - >-
    Vulnerability or compliance scanners (Lynis, OpenSCAP, CIS-CAT) auditing
    password-policy hardening, which read /etc/shadow's format/permissions
    as part of a scheduled scan.
  - >-
    KNOWN GAP, not a false positive: a plain, unprivileged read of
    /etc/passwd (Atomic Red Team T1003.008 test #3) produces no event under
    this ruleset at all, because /etc/passwd is watched `-p wa` only (see
    description). This rule cannot and does not claim to cover that read
    path -- flagged here rather than silently ignored.
  - >-
    KNOWN GAP, not a false positive: alerts on `credential_access_shadow`
    do not distinguish which of /etc/shadow or /etc/gshadow was touched
    (both share that watch key and the SYSCALL record alone doesn't carry
    the file path) -- a deliberate tradeoff for native Sigma syntax over a
    raw_query correlation, see description.

level: high

custom:
  splunk:
    index: main
    mode: alert
    cron: "*/5 * * * *"
    earliest: "-10m"
    latest: "now"
    severity: high

  testing:
    enabled: true
    runner: linux-victim
    type: atomic
    atomics:
      - technique: T1003.008
        test_numbers: [1, 5]
