title: Linux Credential File Access via Shadow-Watch Auditd Rule
detect_id: DETECT-2026-0034
status: experimental
description: >
  Detects T1003.008 OS Credential Dumping: /etc/passwd, /etc/master.passwd
  and /etc/shadow -- root-level access to Linux's password-hash-bearing
  files, correlated by auditd watch key rather than by process/command name
  so it isn't defeated by which binary or shell mechanism did the reading
  (`cat`, `ed`, or a shell `read` builtin with no external process at all).
  Built specifically around this lab's deployed auditd ruleset, which is
  deliberately asymmetric across the three files the technique names:
  `/etc/shadow` and `/etc/gshadow` are watched `-p rwa` (key
  `credential_access_shadow`, includes reads) because root-only reads of
  those are comparatively rare and a strong signal; `/etc/security/opasswd`
  is watched `-p rwa` (key `credential_access_opasswd`) for the same reason;
  `/etc/passwd` is deliberately watched `-p wa` only (key
  `credential_access_passwd`, write/attribute-change, NOT read) because it
  is world-readable and read constantly by completely benign things (PAM,
  `getent`, `id`, countless services) -- a read-watch on it would be pure
  noise. This rule therefore keys on `credential_access_shadow` and
  `credential_access_opasswd` only; `credential_access_passwd` write events
  are a structurally different signal (account/file tampering, not a
  credential *dump*, since a plain read of `/etc/passwd` never touches
  write/attribute-change and so never fires that watch at all) and are out
  of scope here -- see falsepositives for the resulting, known telemetry
  gap. `/etc/master.passwd` is FreeBSD-only and not applicable to this
  Ubuntu-based lab target. Matching is native Sigma, single-event, on the
  `key` field alone (Splunk auto-extracts `key`, `comm`, `exe`, `uid`,
  `auid` and `success` as clean quote-stripped fields directly from the
  auditd SYSCALL record on this sourcetype, with no pipeline or custom
  extraction needed -- `key` is unmapped in config/backends.yml, so it
  passes through Sigma-to-SPL unchanged). This intentionally does not
  correlate the SYSCALL record to its paired PATH record (the two are
  separate raw events joined only by the shared
  `audit(<epoch>.<ms>:<serial>)` id) to recover the exact file path -- that
  cross-event join is exactly the kind of multi-event correlation this
  pipeline's Sigma-to-SPL conversion cannot express, so it would require a
  `custom.splunk.raw_query` fallback that fully bypasses native conversion.
  Given `credential_access_opasswd` already names exactly one file and
  `credential_access_shadow` narrows to one of only two (`/etc/shadow` or
  `/etc/gshadow`), that residual ambiguity was judged not worth trading
  away native Sigma syntax, a maintainable `fields:` block, and pipeline
  consistency with the rest of this repo's rules -- an analyst can still
  pivot to the raw event's `audit_id` to find the paired PATH record by
  hand when the exact file matters.
references:
  - https://attack.mitre.org/techniques/T1003/008/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1003.008/T1003.008.yaml
  - https://research.splunk.com/endpoint/0419cb7a-57ea-467b-974f-77c303dfe2a3/
author: Bence Marton
date: 2026-09-19
modified: 2026-09-19
version: "1.1"
tags:
  - attack.credential_access
  - attack.t1003.008

logsource:
  product_category: os
  product: linux
  service: auditd
  event_type: file_access

detection:
  selection:
    host: linux-victim
    sourcetype: linux_audit
    key:
      - credential_access_shadow
      - credential_access_opasswd
  condition: selection

fields:
  - _time
  - key
  - uid
  - auid
  - comm
  - exe
  - success

falsepositives:
  - >-
    Password-change tooling: `passwd`, `chpasswd`, `usermod -p`, or `chage`
    all rewrite /etc/shadow as part of a completely normal admin-initiated
    password change -- this is write access under the same `-p rwa` watch
    and the single most common expected trigger.
  - >-
    PAM modules (`pam_unix`, `pam_pwhistory`) reading /etc/security/opasswd
    on every password change to enforce password-history policy -- expected
    and frequent wherever that policy is enabled, distinct from the
    shadow-read FP source above.
  - >-
    Configuration-management tooling (Ansible with `become: yes`, Puppet,
    Chef) or backup jobs running as root that read or include /etc/shadow
    as part of a full-filesystem backup or a fact-gathering/audit run.
  - >-
    Vulnerability or compliance scanners (Lynis, OpenSCAP, CIS-CAT) auditing
    password-policy hardening, which read /etc/shadow's format/permissions
    as part of a scheduled scan.
  - >-
    KNOWN GAP, not a false positive: a plain, unprivileged read of
    /etc/passwd (Atomic Red Team T1003.008 test #3) produces no event under
    this ruleset at all, because /etc/passwd is watched `-p wa` only (see
    description). This rule cannot and does not claim to cover that read
    path -- flagged here rather than silently ignored.
  - >-
    KNOWN GAP, not a false positive: alerts on `credential_access_shadow`
    do not distinguish which of /etc/shadow or /etc/gshadow was touched
    (both share that watch key and the SYSCALL record alone doesn't carry
    the file path) -- a deliberate tradeoff for native Sigma syntax over a
    raw_query correlation, see description.

level: high

custom:
  splunk:
    index: main
    mode: alert
    cron: "*/5 * * * *"
    earliest: "-10m"
    latest: "now"
    severity: high

  testing:
    enabled: true
    runner: linux-victim
    type: atomic
    atomics:
      - technique: T1003.008
        test_numbers: [1, 5]
        # Test 2 (/etc/master.passwd) is FreeBSD-only, not applicable to
        # this Ubuntu target. Test 3 (plain `cat /etc/passwd`, no
        # elevation) is deliberately NOT cited -- it produces no
        # credential_access_passwd event at all under this -p wa ruleset,
        # see the falsepositives "KNOWN GAP" entry. Test 4 (via `ed`) is
        # not cited because `ed` is not confirmed installed on this
        # minimized Ubuntu Server 24.04 image -- worth adding later once
        # verified rather than assumed. Test 1 (sudo cat /etc/shadow)
        # exercises the shadow rwa watch end to end; test 5 (shell
        # read-builtin, no external process) specifically exercises why
        # this rule keys on the watch's `key=` field rather than `comm`.
