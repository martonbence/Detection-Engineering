title: Web Server Probing for Secret, VCS and Config Files
detect_id: DETECT-2026-0036
status: experimental
description: >
  Detects nginx access-log requests for files that should never be
  web-reachable: env/secret files (/.env and variants like
  .env.production, /app/.env), VCS metadata (/.git/, /.svn/, /.hg/),
  credential/key directories (/.aws/, /.ssh/, /.docker/config.json,
  /.kube/config), client-side leftovers (.DS_Store, .npmrc, .htpasswd,
  .bash_history, .pgpass), CMS config backups (wp-config.php.bak-style)
  and DB/site archives (backup.sql, backup.zip, dump.sql). Wordlist-style
  recon run at scale by mass scanners (see GreyNoise AI-crawler-impostor
  scanning and CISA AA24-016A/Androxgh0st in references). Tagged
  T1595.003, not T1552.001: an access-log line only shows the attempt,
  not whether the file was served -- status/bytes (200 + bytes>0) show
  that. The path list is curated, deliberately not "any dotfile"
  (/.well-known/, /.github/ excluded on purpose). nginx logs the raw,
  undecoded request line, so two %2e-encoded leading-dot forms are
  matched alongside the literal ones; deeper double-encoding is not
  covered. Field names are Splunk-native access_combined extractions
  (uri_path), since there is no field-mapping pipeline for this log
  source.
references:
  - https://attack.mitre.org/techniques/T1595/003/
  - https://attack.mitre.org/techniques/T1552/001/
  - https://www.greynoise.io/blog/threat-actors-posing-as-ai-crawlers
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-016a
  - https://github.com/SigmaHQ/sigma/blob/master/rules/web/webserver_generic/web_source_code_enumeration.yml
author: Bence Marton
date: 2026-09-20
modified: 2026-09-26
version: "1.0"
tags:
  - attack.reconnaissance
  - attack.t1595.003

logsource:
  product_category: web
  product: nginx
  service: access
  event_type: access_history

detection:
  selection_sourcetype:
    sourcetype: access_combined

  selection_env:
    uri_path|endswith:
      - "/.env"
      - "/.env~"
  selection_env_variant:
    uri_path|contains:
      - "/.env."
      - "/%2eenv"

  selection_vcs:
    uri_path|contains:
      - "/.git/"
      - "/%2egit/"
      - "/.svn/"
      - "/.hg/"
  selection_vcs_bare:
    uri_path|endswith:
      - "/.git"
      - "/%2egit"

  selection_creds:
    uri_path|contains:
      - "/.aws/"
      - "/.ssh/"
      - "/.docker/config.json"
      - "/.kube/config"
  selection_dotfiles:
    uri_path|endswith:
      - "/.DS_Store"
      - "/.npmrc"
      - "/.htpasswd"
      - "/.bash_history"
      - "/.pgpass"

  selection_cms_backup:
    uri_path|contains:
      - "wp-config.php."
      - "wp-config.bak"
      - "wp-config.old"
      - "wp-config.txt"
  selection_cms_backup_tilde:
    uri_path|endswith:
      - "wp-config.php~"
      - "/config.php.bak"
      - "/config.inc.php.bak"

  selection_archives:
    uri_path|endswith:
      - "/backup.sql"
      - "/backup.zip"
      - "/backup.tar.gz"
      - "/backup.tar"
      - "/dump.sql"
      - "/database.sql"
      - "/db.sql"
      - "/db_backup.sql"
      - "/site.zip"
      - "/www.zip"
      - "/wwwroot.zip"

  condition: >
    selection_sourcetype and (
      selection_env or selection_env_variant or
      selection_vcs or selection_vcs_bare or
      selection_creds or selection_dotfiles or
      selection_cms_backup or selection_cms_backup_tilde or
      selection_archives
    )

fields:
  - _time
  - host
  - clientip
  - method
  - uri_path
  - uri_query
  - status
  - bytes
  - useragent
  - referer

falsepositives:
  - >-
    A scanner you run yourself (Nessus, Nikto, nuclei, an internal ASV
    scan) requests these exact paths by design -- correlate with the
    scan calendar or source IP before escalating; no allow-list built in,
    since one keyed on host/IP would also hide a genuine probe.
  - >-
    A site that intentionally serves one of these paths (e.g. a public
    git mirror exposing /.git/).
  - >-
    Alert volume, not false positives: mass scanners request /.env and
    /.git/config constantly on any internet-facing host, so true-positive
    volume is expected to be high. Treat as an activity/enrichment
    signal; escalation belongs to the served tier (status 200, bytes>0).
  - >-
    selection_archives' /backup.zip, /site.zip and /db.sql are the three
    entries in the path list a site could plausibly serve on purpose (a
    published dataset dump, a downloadable site export, a release
    archive). Whether such a request counts as a false positive is a
    per-site policy call this rule deliberately does not decide: the path
    list is curated for "should never be web-reachable", and these three
    are the ones where that assumption is the weakest. Watch them first
    if the rule needs tuning.

level: medium

custom:
  splunk:
    index: main
    mode: alert
    cron: "*/5 * * * *"
    earliest: "-5m"
    latest: "now"
    severity: medium

  testing:
    enabled: true
    runner: linux-victim
    type: emulation
    custom:
      - name: "Environment file variants"
        description: "/.env, /.env.production (selection_env, selection_env_variant)."
        executor: powershell
        command: |-
          curl -s -o /dev/null 'http://localhost/.env'
          curl -s -o /dev/null 'http://localhost/.env.production'
        cleanup: ""
        prerequisites:
          - nginx must be running on linux-victim and listening on port 80
          - curl must be installed (/usr/bin/curl)

      - name: "VCS metadata and bare directory probes"
        description: "/.git/config, bare /.git (selection_vcs, selection_vcs_bare)."
        executor: powershell
        command: |-
          curl -s -o /dev/null 'http://localhost/.git/config'
          curl -s -o /dev/null 'http://localhost/.git'
        cleanup: ""
        prerequisites:
          - nginx must be running on linux-victim and listening on port 80
          - curl must be installed (/usr/bin/curl)

      - name: "Cloud credential and dotfile probes"
        description: "/.aws/credentials, /.DS_Store (selection_creds, selection_dotfiles)."
        executor: powershell
        command: |-
          curl -s -o /dev/null 'http://localhost/.aws/credentials'
          curl -s -o /dev/null 'http://localhost/.DS_Store'
        cleanup: ""
        prerequisites:
          - nginx must be running on linux-victim and listening on port 80
          - curl must be installed (/usr/bin/curl)

      - name: "CMS config backups and database archive"
        description: >-
          /wp-config.php.bak, /wp-config.php~, /backup.sql
          (selection_cms_backup, selection_cms_backup_tilde,
          selection_archives).
        executor: powershell
        command: |-
          curl -s -o /dev/null 'http://localhost/wp-config.php.bak'
          curl -s -o /dev/null 'http://localhost/wp-config.php~'
          curl -s -o /dev/null 'http://localhost/backup.sql'
        cleanup: ""
        prerequisites:
          - nginx must be running on linux-victim and listening on port 80
          - curl must be installed (/usr/bin/curl)
