title: Web Server Probing for Secret, VCS and Config Files
detect_id: DETECT-2026-0036
status: experimental
description: >
  Detects HTTP requests in the nginx access log whose path targets files that
  should never be web-reachable: environment/secret files (/.env and its
  variants such as .env.production, .env.bak, /app/.env), version-control
  metadata (/.git/config, /.git/HEAD, /.svn/, /.hg/), credential and key
  directories (/.aws/credentials, /.ssh/id_rsa), client-side leftovers
  (/.DS_Store, /.npmrc, /.htpasswd, /.bash_history), CMS config backups
  (wp-config.php.bak and similar) and database or site archives (backup.sql,
  backup.zip, dump.sql). This is wordlist-style reconnaissance, run at scale
  by mass scanners -- see GreyNoise (AI-crawler impostor scanning) and CISA
  AA24-016A (Androxgh0st) in references. The attacker's goal is credential
  harvesting (T1552.001), but a request in an access log only shows the
  attempt, so the rule is tagged T1595.003 and not T1552.001. It fires on the
  attempt regardless of HTTP status: a 404 on /.env is still the signal, and
  `status` and `bytes` are in the output so an analyst can triage whether the
  file was actually served (200 with bytes > 0). The match is a curated path
  list and deliberately not "any dotfile", so /.well-known/ (ACME challenges,
  security.txt) and /.github/ do not match. nginx logs the request line as
  sent, without percent-decoding, so two illustrative encoded forms of the
  leading dot (%2e) are matched alongside the literal ones; deeper
  double-encoding is not covered. Field names are the Splunk-native
  access_combined extractions (uri_path, not the Sigma webserver
  cs-uri-stem), because there is no field-mapping pipeline for this log
  source.
references:
  - https://attack.mitre.org/techniques/T1595/003/
  - https://attack.mitre.org/techniques/T1552/001/
  - https://www.greynoise.io/blog/threat-actors-posing-as-ai-crawlers
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-016a
  - https://github.com/SigmaHQ/sigma/blob/master/rules/web/webserver_generic/web_source_code_enumeration.yml
author: Bence Marton
date: 2026-09-20
modified: 2026-09-20
version: "1.0"
tags:
  - attack.reconnaissance
  - attack.t1595.003

logsource:
  product_category: web
  product: nginx
  service: access
  event_type: access_history

detection:
  selection_sourcetype:
    sourcetype: access_combined

  # uri_path is the request path without the query string, unmodified as sent.
  # A leading "/" (or a ".<suffix>" boundary) is required in every pattern so
  # that /.envelope, /my.git-notes or /.github/ are not swept in.
  selection_env:
    uri_path|endswith:
      - "/.env"
      - "/.env~"
    # `contains` on "/.env." catches .env.production, .env.bak, .env.local ...
  selection_env_variant:
    uri_path|contains:
      - "/.env."
      - "/%2eenv"

  selection_vcs:
    uri_path|contains:
      - "/.git/"
      - "/%2egit/"
      - "/.svn/"
      - "/.hg/"
    # bare "/.git" (no trailing slash) is a probe too
  selection_vcs_bare:
    uri_path|endswith:
      - "/.git"
      - "/%2egit"

  selection_creds:
    uri_path|contains:
      - "/.aws/"
      - "/.ssh/"
      - "/.docker/config.json"
      - "/.kube/config"
  selection_dotfiles:
    uri_path|endswith:
      - "/.DS_Store"
      - "/.npmrc"
      - "/.htpasswd"
      - "/.bash_history"
      - "/.pgpass"

  selection_cms_backup:
    uri_path|contains:
      - "wp-config.php."
      - "wp-config.bak"
      - "wp-config.old"
      - "wp-config.txt"
    # "wp-config.php~" editor backup; plain /wp-config.php is NOT matched
  selection_cms_backup_tilde:
    uri_path|endswith:
      - "wp-config.php~"
      - "/config.php.bak"
      - "/config.inc.php.bak"

  selection_archives:
    uri_path|endswith:
      - "/backup.sql"
      - "/backup.zip"
      - "/backup.tar.gz"
      - "/backup.tar"
      - "/dump.sql"
      - "/database.sql"
      - "/db.sql"
      - "/db_backup.sql"
      - "/site.zip"
      - "/www.zip"
      - "/wwwroot.zip"

  condition: >
    selection_sourcetype and (
      selection_env or selection_env_variant or
      selection_vcs or selection_vcs_bare or
      selection_creds or selection_dotfiles or
      selection_cms_backup or selection_cms_backup_tilde or
      selection_archives
    )

fields:
  - _time
  - host
  - clientip
  - method
  - uri_path
  - uri_query
  - status
  - bytes
  - useragent
  - referer

falsepositives:
  - >-
    A vulnerability or web-content scanner you operate yourself (Nessus, Nikto,
    nuclei, an internal ASV scan) requests these exact paths by design;
    expected, not a false positive in the security sense, but correlate with
    the scan calendar or source IP before escalating. No allow-list is built
    in, because an allow-list keyed on a host or IP would also hide a genuine
    probe.
  - >-
    Legitimate crawlers and uptime checkers requesting a path from this list
    that the site really serves. The realistic case is a site that
    intentionally publishes one of these files (for example a public repository
    mirror exposing /.git/) -- then every request fires and the pattern list
    must be tuned to that site. Unknown for this lab: the server serves a
    default nginx page only.
  - >-
    Alert volume, not false positives: on any internet-facing host, mass
    scanners request /.env and /.git/config constantly, so true-positive
    volume is expected to be high even though false positives are rare
    (unmeasured; this is a guess, not a measured rate -- the lab receives only
    dozens of nginx events a week). Treat this rule as an activity and
    enrichment signal; escalation belongs to the served tier (status 200 with
    bytes > 0), not to the mere attempt.
  - >-
    TODO: broad patterns worth watching first for legitimate downloads are
    "/backup.zip", "/site.zip" and "/db.sql", which a site could offer on
    purpose.

level: medium

custom:
  splunk:
    index: main
    mode: alert
    cron: "*/5 * * * *"
    earliest: "-5m"
    latest: "now"
    severity: medium

  # Emulation, not atomic: Atomic Red Team has no test for HTTP probing of an
  # nginx access log (T1595.003 has none at all), and the rule keys on the
  # access-log line itself, so the minimal reproduction is the request.
  #
  # Runner facts (scripts/atomic/run_atomic_linux.ps1): every command below is
  # run with Invoke-Expression under PowerShell 7 on Linux and the `executor`
  # label is ignored, so this is PowerShell syntax, URLs are single-quoted (an
  # unquoted `&`/`;` breaks, double quotes would expand `$`), and `curl` is the
  # native /usr/bin/curl (no alias off Windows). A failing native curl does not
  # throw, so a 404 (expected: nginx serves a default site with none of these
  # files) is fine and is exactly the request the rule fires on.
  #
  # Event cap: pass_fail_eval.py (--min-pass 1 --max-pass 10) counts matched
  # events per RULE over the verification window, not per test, so the whole
  # test set below is exactly 9 requests, one per selection group (9 groups).
  # Do not add requests here without dropping others.
  testing:
    enabled: true
    runner: linux-victim
    type: emulation
    custom:
      - name: "Environment file variants"
        description: >
          Requests /.env and /.env.production (one request each for selection_env and selection_env_variant). The full 18-path matrix (including /app/.env, /.env~,
          /.git/HEAD, /.svn/entries, /.ssh/id_rsa, /.docker/config.json,
          /backup.zip, /%2eenv, /.ENV) was validated manually against Splunk
          on 2026-09-20 and is deliberately NOT repeated in CI, because
          pass_fail_eval.py caps a rule at 10 matched events; the %2e branches
          are therefore untested in CI.
        executor: powershell
        command: |-
          curl -s -o /dev/null 'http://localhost/.env'
          curl -s -o /dev/null 'http://localhost/.env.production'
        cleanup: ""
        prerequisites:
          - nginx must be running on linux-victim and listening on port 80
          - curl must be installed (/usr/bin/curl)

      - name: "VCS metadata and bare directory probes"
        description: >
          Requests /.git/config and the bare /.git (selection_vcs and selection_vcs_bare). The full 18-path matrix (including /app/.env, /.env~,
          /.git/HEAD, /.svn/entries, /.ssh/id_rsa, /.docker/config.json,
          /backup.zip, /%2eenv, /.ENV) was validated manually against Splunk
          on 2026-09-20 and is deliberately NOT repeated in CI, because
          pass_fail_eval.py caps a rule at 10 matched events; the %2e branches
          are therefore untested in CI.
        executor: powershell
        command: |-
          curl -s -o /dev/null 'http://localhost/.git/config'
          curl -s -o /dev/null 'http://localhost/.git'
        cleanup: ""
        prerequisites:
          - nginx must be running on linux-victim and listening on port 80
          - curl must be installed (/usr/bin/curl)

      - name: "Cloud credential and dotfile probes"
        description: >
          Requests /.aws/credentials and /.DS_Store (selection_creds and selection_dotfiles). The full 18-path matrix (including /app/.env, /.env~,
          /.git/HEAD, /.svn/entries, /.ssh/id_rsa, /.docker/config.json,
          /backup.zip, /%2eenv, /.ENV) was validated manually against Splunk
          on 2026-09-20 and is deliberately NOT repeated in CI, because
          pass_fail_eval.py caps a rule at 10 matched events; the %2e branches
          are therefore untested in CI.
        executor: powershell
        command: |-
          curl -s -o /dev/null 'http://localhost/.aws/credentials'
          curl -s -o /dev/null 'http://localhost/.DS_Store'
        cleanup: ""
        prerequisites:
          - nginx must be running on linux-victim and listening on port 80
          - curl must be installed (/usr/bin/curl)

      - name: "CMS config backups and database archive"
        description: >
          Requests /wp-config.php.bak, /wp-config.php~ and /backup.sql (selection_cms_backup, selection_cms_backup_tilde and selection_archives). The full 18-path matrix (including /app/.env, /.env~,
          /.git/HEAD, /.svn/entries, /.ssh/id_rsa, /.docker/config.json,
          /backup.zip, /%2eenv, /.ENV) was validated manually against Splunk
          on 2026-09-20 and is deliberately NOT repeated in CI, because
          pass_fail_eval.py caps a rule at 10 matched events; the %2e branches
          are therefore untested in CI.
        executor: powershell
        command: |-
          curl -s -o /dev/null 'http://localhost/wp-config.php.bak'
          curl -s -o /dev/null 'http://localhost/wp-config.php~'
          curl -s -o /dev/null 'http://localhost/backup.sql'
        cleanup: ""
        prerequisites:
          - nginx must be running on linux-victim and listening on port 80
          - curl must be installed (/usr/bin/curl)
