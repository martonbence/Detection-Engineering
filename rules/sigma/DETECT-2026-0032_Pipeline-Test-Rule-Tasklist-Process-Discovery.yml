title: Pipeline Test Rule - Tasklist Process Discovery
detect_id: DETECT-2026-0032
status: test
description: >
  Disposable pipeline test rule -- validates the dev workflow's non-lab path
  (schema validation, MITRE tag checking, Sigma-to-SPL conversion, and
  committing the converted .spl output) while LAB_ONLINE=false skips the
  Splunk deploy, atomic execution, and verification jobs. Detection logic
  deliberately targets a simple, well-understood technique (tasklist.exe
  process enumeration) purely to exercise the conversion path end to end.
  Not intended as production detection coverage -- do not tune or promote
  without re-evaluating it as a real rule first.
references:
  - https://attack.mitre.org/techniques/T1057/
author: Bence Marton
date: 2026-08-15
modified: 2026-08-21
version: "1.2"
tags:
  - attack.discovery
  - attack.t1057

logsource:
  product_category: os
  product: windows
  service: sysmon
  event_type: process_creation

detection:
  selection:
    Image|endswith:
      - "\\tasklist.exe"
      - "\\qwinsta.exe"
      - "\\pslist.exe"
  condition: selection

fields:
  - _time
  - ComputerName
  - User
  - Image
  - CommandLine
  - ParentImage
  - ProcessId

falsepositives:
  - Routine administrative and monitoring scripts that enumerate running
    processes (health checks, software inventory agents, help-desk
    troubleshooting)
  - This is a disposable pipeline-test rule and is not intended to be tuned
    for production FP suppression

level: low

custom:
  splunk:
    index: sysmon
    mode: alert
    cron: "*/5 * * * *"
    earliest: "-5m"
    latest: "now"
    severity: low

  testing:
    enabled: true
    runner: windows-victim
    type: atomic
    atomics:
      - technique: T1057
        test_numbers: [2, 6]
