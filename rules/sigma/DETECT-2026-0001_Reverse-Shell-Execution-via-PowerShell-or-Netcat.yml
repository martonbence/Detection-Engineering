title: Reverse Shell Execution via PowerShell or Netcat
detect_id: DETECT-2026-0001
status: stable
description: >
  Detects reverse-shell establishment via PowerShell (Nishang/powercat
  toolkit, raw .NET TCPClient socket usage), netcat/ncat exec or bind
  listener flags, and local msfvenom payload generation. Covers both
  named-tool signatures and generic PowerShell socket idioms to catch
  bespoke reverse-shell scripts. Complements DETECT-2026-0007 and
  DETECT-2026-0009 for obfuscated/encoded PowerShell execution.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1095/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_powershell_reverse_shell_connection.yml
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_pua_netcat.yml
  - https://www.volexity.com/blog/2021/03/02/active-exploitation-of-microsoft-exchange-zero-day-vulnerabilities/
  - https://www.microsoft.com/security/blog/2021/03/02/hafnium-targeting-exchange-servers/
  - https://github.com/samratashok/nishang/blob/master/Shells/Invoke-PowerShellTcpOneLine.ps1
author: Bence Marton
date: 2026-09-07
modified: 2026-09-09
version: "1.1"
tags:
  - attack.execution
  - attack.t1059.001
  - attack.command_and_control
  - attack.t1095
  - attack.t1071.001

logsource:
  product_category: os
  product: windows
  service: sysmon
  event_type: process_creation

detection:
  selection_img:
    - OriginalFileName:
        - "PowerShell.EXE"
        - "pwsh.dll"
    - Image|endswith:
        - "\\powershell.exe"
        - "\\pwsh.exe"

  selection_named_tool:
    CommandLine|contains:
      - "New-Object Net.Sockets.TCPClient"
      - "System.Net.Sockets.TCPClient"
      - "System.Net.Sockets.NetworkStream"
      - "Invoke-PowerShellTcp"
      - "Invoke-PowerShellTcpOneLine"
      - "Invoke-PowerShellTcpOneLineBind"
      - "Invoke-PowerShellUdp"
      - "Invoke-PowerShellUdpOneLine"
      - "Invoke-PowerShellIcmp"
      - "Invoke-ConPtyShell"
      - "Invoke-PoshRatHttp"
      - "Invoke-PowerShellWmi"
      - "Invoke-JSRatRegsvr"
      - "Invoke-JSRatRundll"
      - "Out-RundllCommand"
      - "powercat"
      - "Start-PowerCat"
      - "Connect-PowerCat"

  selection_raw_socket_idiom:
    CommandLine|contains|all:
      - " Net.Sockets.TCPClient"
      - ".GetStream("
      - ".Write("

  selection_netcat_img:
    Image|endswith:
      - "\\nc.exe"
      - "\\ncat.exe"
      - "\\nc64.exe"
      - "\\netcat.exe"

  selection_netcat_flag:
    CommandLine|contains:
      - " -e "
      - " --exec "
      - " --lua-exec "
      - " --sh-exec "
      - " -lvp "
      - " -lvnp "
      - " -l -v -p "
      - " -lv -p "

  selection_msfvenom_tool:
    CommandLine|contains|all:
      - "msfvenom"
      - " -p "
  selection_msfvenom_intent:
    CommandLine|contains:
      - "reverse_tcp"
      - "reverse_http"
      - "reverse_https"
      - "reverse_powershell"
      - "bind_tcp"
      - "shell_reverse"
      - "shell_bind"

  condition: (selection_img and (selection_named_tool or selection_raw_socket_idiom)) or (selection_netcat_img and selection_netcat_flag) or (selection_msfvenom_tool and selection_msfvenom_intent)

fields:
  - _time
  - ComputerName
  - User
  - Image
  - OriginalFileName
  - CommandLine
  - ParentImage
  - ParentCommandLine
  - ProcessId
  - ParentProcessId

falsepositives:
  - Bespoke internal automation or monitoring tooling that opens a raw .NET
    TCP socket directly (uncommon, but not unheard of in custom scripts)
  - Authorized penetration testing or red-team engagements running msfvenom,
    powercat, or a netcat/ncat -e reverse shell directly on the target host
    as part of a sanctioned exercise -- expected, not a false positive, but
    worth cross-checking against the current test calendar before escalating
  - Legitimate ncat/netcat use for connectivity testing or ad-hoc file
    transfer that happens to use a listener flag (-lvp/-lvnp) without ever
    piping a shell into it -- selection_netcat_flag treats a bare listener
    the same as an exec flag (matching SigmaHQ's own
    proc_creation_win_pua_netcat.yml, which rates bare netcat listener use
    "high" on Windows since the tool isn't native and its mere presence is
    already notable), so a truly benign listener-only session still fires
    this rule; check whether a shell was actually piped in before assuming
    compromise
  - A renamed or path-relocated netcat/ncat binary, or an msfvenom invocation
    that does not put "msfvenom", " -p " and a recognised payload-family token
    ("reverse_tcp", "bind_tcp", "shell_reverse", ...) together in the same
    CommandLine -- a wrapper script, a non-default payload name, or a payload
    string built up from a variable -- evades the relevant selection's literal
    match. This is a known detection gap, not a false positive, but worth
    remembering when triaging a quiet period

level: high

custom:
  splunk:
    index: sysmon
    mode: alert
    cron: "*/5 * * * *"
    earliest: "-5m"
    latest: "now"
    severity: high

  testing:
    enabled: true
    runner: windows-victim
    type: emulation
    custom:
      - name: "PowerShell Native TCPClient Socket Keyword"
        description: >
          Spawns a non-interactive powershell.exe process whose CommandLine
          contains "New-Object Net.Sockets.TCPClient" as a trailing comment
          after exit 0 -- the same safe pattern DETECT-2026-0012 uses for
          AMSI keywords. Sysmon records the full CommandLine for detection,
          but the socket call is never evaluated, so nothing is actually
          created or connected. The real powershell.exe process this spawns
          satisfies selection_img on both Image and OriginalFileName.
          Exercises selection_named_tool.
        executor: powershell
        command: >-
          powershell.exe -NonInteractive -Command "exit 0 #New-Object Net.Sockets.TCPClient"
        cleanup: ""
        prerequisites:
          - powershell.exe must be available (present by default on Windows)

      - name: "Raw TCPClient/GetStream/Write Socket Idiom"
        description: >
          Spawns a non-interactive powershell.exe process whose CommandLine
          contains " Net.Sockets.TCPClient", ".GetStream(" and ".Write("
          together as a trailing comment after exit 0 -- none of the calls
          are evaluated, only the CommandLine text is produced. Deliberately
          omits every selection_named_tool keyword (no "New-Object"/"System."
          prefix, no tool name) so this test exercises
          selection_raw_socket_idiom specifically, not selection_named_tool.
        executor: powershell
        command: >-
          powershell.exe -NonInteractive -Command "exit 0 # Net.Sockets.TCPClient .GetStream( .Write("
        cleanup: ""
        prerequisites:
          - powershell.exe must be available (present by default on Windows)

      - name: "msfvenom Payload-Flag CommandLine Keyword"
        description: >
          Spawns a non-interactive powershell.exe process whose CommandLine
          contains "msfvenom", " -p " and "reverse_tcp" together as a trailing
          comment after exit 0. No Metasploit tooling is invoked and no payload
          is generated -- only the CommandLine text is produced. Satisfies
          selection_msfvenom_tool ("msfvenom" + " -p ") and
          selection_msfvenom_intent ("reverse_tcp"), the two selections whose
          AND forms the msfvenom branch of the condition.
        executor: powershell
        command: >-
          powershell.exe -NonInteractive -Command "exit 0 #msfvenom -p windows/meterpreter/reverse_tcp"
        cleanup: ""
        prerequisites:
          - powershell.exe must be available (present by default on Windows)

      - name: "Netcat Image + -e Flag Keyword"
        description: >
          Copies the real powershell.exe to a temp path literally named
          nc.exe, then runs it non-interactively with the -e flag text
          tucked into a trailing comment after exit 0. Because it's really
          powershell.exe underneath, -NonInteractive -Command guarantees an
          immediate, predictable exit -- no netcat binary is ever invoked,
          no listener or outbound connection is created, and no shell is
          piped anywhere. Sysmon still records Image ending in \nc.exe
          (satisfying selection_netcat_img) and a CommandLine containing
          " -e" (satisfying selection_netcat_flag), exercising the combined
          condition without the hang risk a real renamed shell binary given
          unrecognised arguments would carry.
        executor: powershell
        command: >-
          $nc = Join-Path $env:TEMP 'nc.exe';
          Copy-Item "$PSHOME\powershell.exe" $nc -Force;
          & $nc -NonInteractive -Command "exit 0 # -e cmd.exe 127.0.0.1 4444"
        cleanup: >-
          Remove-Item (Join-Path $env:TEMP 'nc.exe') -Force -ErrorAction SilentlyContinue
        prerequisites:
          - powershell.exe must be available (present by default on Windows)
